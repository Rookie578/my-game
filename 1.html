<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>军旅 · 美军篇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:#06070a;color:#c8d0b8;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  font-size:14px;line-height:1.6;
  margin:0;padding:0;
  width:100%;
  max-width:100vw;
  overflow-x:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
body{
  display:flex;justify-content:center;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
#app{
  width:100%;max-width:480px;
  height:100vh;
  height:100dvh;
  overflow:hidden;background:#0d1009;
  display:flex;flex-direction:column;
  border-left:1px solid #1c2216;border-right:1px solid #1c2216;
  position:relative;
}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}

/* ===== 开局界面 ===== */
#screen-start{
  padding:28px 20px;
  overflow-y:auto;
  justify-content:flex-start;
  scrollbar-width:thin;
  scrollbar-color:#4a5c30 #10150c;
}
#screen-start::before,
#screen-start::after{
  content:'';
  display:block;
  flex:1 0 0;
  min-height:0;
}
#screen-start::-webkit-scrollbar{width:8px}
#screen-start::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#screen-start::-webkit-scrollbar-thumb{
  background:#3a4a26;border-radius:4px;border:2px solid #10150c;
}
#screen-start::-webkit-scrollbar-thumb:hover{background:#5a6b3a}
.title{font-size:26px;letter-spacing:6px;color:#9dbb6a;text-align:center;margin-bottom:6px;font-weight:700}
.subtitle{text-align:center;color:#5d6b48;font-size:12px;letter-spacing:2px;margin-bottom:28px}
.section-label{color:#7d8f5e;font-size:12px;letter-spacing:2px;margin-bottom:10px;border-left:3px solid #4a5c30;padding-left:8px}
.bg-options{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.opt{
  background:#141a0e;border:1px solid #2a3520;border-radius:4px;padding:12px 14px;
  cursor:pointer;transition:.15s;
}
.opt:hover,.opt.sel{border-color:#7ba34a;background:#1a2312}
.opt-name{color:#b6cc8a;font-weight:700;margin-bottom:3px;font-size:14px}
.opt-desc{color:#68774f;font-size:11.5px;line-height:1.5}

/* ===== 天赋 ===== */
.talents{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.talent{
  background:#141a0e;border:1px solid #2a3520;border-radius:4px;padding:11px 14px;cursor:pointer;transition:.15s;
}
.talent:hover,.talent.sel{border-color:#c9a227;background:#1e1c0e}
.talent-name{color:#d9b84a;font-weight:700;font-size:13.5px;margin-bottom:2px}
.talent-desc{color:#7a7550;font-size:11.5px}

.btn-primary{
  width:100%;padding:14px;background:#1f2b14;border:1px solid #6d9440;color:#b9d98a;
  font-family:inherit;font-size:15px;letter-spacing:3px;border-radius:4px;cursor:pointer;
  transition:.15s;font-weight:700;
}
.btn-primary:hover:not(:disabled){background:#2a3a1a;box-shadow:0 0 14px rgba(109,148,64,.3)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}

/* ===== 游戏界面 ===== */
#hud{
  padding:8px 14px;background:#10150c;border-bottom:1px solid #1c2216;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#hud-avatar{
  width:60px;height:60px;flex-shrink:0;
  border:2px solid #4a5c30;border-radius:6px;
  background:#b8b0a0;overflow:hidden;
  position:relative;
  box-shadow:0 0 8px rgba(74,92,48,.35);
  transition:border-color .3s, box-shadow .3s;
}
#avatar-img{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:center 40%;
  user-select:none;-webkit-user-drag:none;
}
#avatar-svg{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}
#hud-avatar.rank-bronze{border-color:#8a6a3a;box-shadow:0 0 8px rgba(138,106,58,.45)}
#hud-avatar.rank-silver{border-color:#8a9aa8;box-shadow:0 0 8px rgba(138,154,168,.45)}
#hud-avatar.rank-gold  {border-color:#c9a227;box-shadow:0 0 10px rgba(201,162,39,.55)}
#hud-avatar.rank-wo    {border-color:#6d9440;box-shadow:0 0 10px rgba(109,148,64,.55)}

#hud-unit{
  color:#5d6b48;font-size:10px;letter-spacing:1px;
  margin-top:2px;
  display:none;
}
#hud-unit.show{display:block}
#hud-unit .unit-name{color:#7d8f5e}
#hud-unit .unit-loc{color:#5d6b48}
#hud-unit .unit-deploy{color:#d98a4a}

.hud-rank{color:#b9d98a;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.hud-rank small{color:#5d6b48;font-weight:400;font-size:10.5px;display:block;letter-spacing:1px}
#rank-badge{
  width:26px;height:26px;flex-shrink:0;
}
#rank-badge svg{display:block;width:100%;height:100%}
.hud-meta{
  text-align:right;color:#6d7d52;font-size:11px;line-height:1.5;
  margin-left:auto;flex-shrink:0;white-space:nowrap;
}

#stats{
  padding:10px 14px;background:#0b0e08;border-bottom:1px solid #1c2216;
  display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;flex-shrink:0;
}
.stat{display:flex;align-items:center;gap:6px;font-size:11px}
.stat-label{color:#68774f;width:30px;flex-shrink:0}
.stat-bar{flex:1;height:5px;background:#1a2013;border-radius:2px;overflow:hidden}
.stat-fill{height:100%;background:linear-gradient(90deg,#4a6b2a,#8fbf55);border-radius:2px;transition:width .4s}
.stat-fill.low{background:linear-gradient(90deg,#7a2a1a,#c94a2a)}
.stat-fill.mid{background:linear-gradient(90deg,#7a6a1a,#c9a227)}
.stat-val{color:#94a878;width:24px;text-align:right;flex-shrink:0;font-size:10.5px}

#feed{
  flex:1 1 0;
  min-height:0;
  overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#4a5c30 #10150c;
}
#feed::-webkit-scrollbar{width:8px}
#feed::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#feed::-webkit-scrollbar-thumb{
  background:#3a4a26;border-radius:4px;border:2px solid #10150c;
}
#feed::-webkit-scrollbar-thumb:hover{background:#5a6b3a}
.entry{opacity:0;transform:translateY(6px);transition:.3s}
.entry.show{opacity:1;transform:none}
.entry.year{
  color:#c9a227;font-size:11.5px;letter-spacing:2px;text-align:center;
  border-top:1px dashed #2a3520;padding-top:9px;margin-top:4px;
}
.entry.year:first-child{border-top:none;margin-top:0;padding-top:0}
.entry.ev{color:#c8d0b8;font-size:13px;line-height:1.75}
.entry.fx{color:#7d9a5a;font-size:11.5px;padding-left:10px;border-left:2px solid #3a4a26}
.entry.warn{color:#d98a4a;font-size:11.5px;padding-left:10px;border-left:2px solid #7a4a1a}
.entry.bad{color:#d95a4a;font-size:12px;padding-left:10px;border-left:2px solid #7a2a1a}
.entry.good{color:#9dd96a;font-size:12px;padding-left:10px;border-left:2px solid #4a7a2a}
.entry.rank{color:#e8d98a;font-size:13px;text-align:center;font-weight:700;letter-spacing:1px;
  background:#1a1a0e;border:1px solid #5a5020;border-radius:3px;padding:8px;margin:4px 0}

#choices{display:none;flex-direction:column;gap:7px;padding:0 14px 10px;flex-shrink:0}
.choice-btn{
  background:#161d0f;border:1px solid #3a4a26;color:#b6cc8a;padding:11px 14px;
  font-family:inherit;font-size:13px;border-radius:4px;cursor:pointer;text-align:left;transition:.15s;
}
.choice-btn:hover{background:#1f2b14;border-color:#6d9440}

#actions{padding:11px 14px;border-top:1px solid #1c2216;background:#10150c;flex-shrink:0}
#ap-bar{color:#c9a227;font-size:11.5px;letter-spacing:1px;text-align:center;margin-bottom:9px}
#ap-bar b{color:#e8d98a}
#action-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}

/* 行动弹出层 */
#action-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(6,7,10,.96);display:none;z-index:150;
  padding:20px 14px 40px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a5c30 #10150c;
}
#action-overlay.show{display:block}
#action-overlay::-webkit-scrollbar{width:8px}
#action-overlay::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#action-overlay::-webkit-scrollbar-thumb{background:#3a4a26;border-radius:4px;border:2px solid #10150c}
#action-content{
  width:100%;max-width:440px;margin:0 auto;background:#0d1009;
  border:1px solid #2a3520;border-radius:6px;padding:20px 18px;
}
.act-btn{
  background:#161d0f;border:1px solid #3a4a26;color:#b6cc8a;
  padding:8px 6px;font-family:inherit;font-size:12px;border-radius:4px;
  cursor:pointer;text-align:center;transition:.15s;line-height:1.35;
}
.act-btn:hover:not(:disabled){background:#1f2b14;border-color:#6d9440}
.act-btn:disabled{opacity:.28;cursor:not-allowed}
.act-btn .cost{display:block;color:#68774f;font-size:10px;margin-top:2px}
.act-btn .cost b{color:#c9a227}

/* ===== 结束界面 ===== */
#screen-end{padding:28px 20px;overflow-y:auto;justify-content:center;text-align:center}
.end-title{font-size:20px;color:#c9a227;letter-spacing:4px;margin-bottom:20px}
.end-card{background:#141a0e;border:1px solid #2a3520;border-radius:5px;padding:18px;margin-bottom:16px;text-align:left}
.end-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1c2216;font-size:12.5px}
.end-row:last-child{border-bottom:none}
.end-row span:first-child{color:#68774f}
.end-row span:last-child{color:#c8d0b8;font-weight:700}
.end-text{color:#94a878;font-size:13px;line-height:1.85;text-align:left;margin-bottom:18px}
.medal{display:inline-block;background:#1e1c0e;border:1px solid #5a5020;color:#d9b84a;
  font-size:10.5px;padding:3px 8px;border-radius:3px;margin:2px 3px 2px 0}

/* ===== 晋升考核覆盖层 ===== */
#promo-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(6,7,10,.97);display:none;z-index:200;
  padding:20px 14px 40px;overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#4a5c30 #10150c;
}
#promo-overlay::-webkit-scrollbar{width:8px}
#promo-overlay::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#promo-overlay::-webkit-scrollbar-thumb{
  background:#3a4a26;border-radius:4px;border:2px solid #10150c;
}
#promo-overlay::-webkit-scrollbar-thumb:hover{background:#5a6b3a}
#promo-overlay.show{display:block}
#promo-content{
  width:100%;max-width:440px;margin:0 auto;background:#0d1009;
  border:1px solid #2a3520;border-radius:6px;padding:20px 18px;
}
.promo-title{color:#c9a227;font-size:16px;letter-spacing:4px;text-align:center;font-weight:700;margin-bottom:5px}
.promo-sub{color:#68774f;font-size:11.5px;text-align:center;margin-bottom:18px;letter-spacing:1px}
.promo-section{color:#7d8f5e;font-size:12px;letter-spacing:2px;border-left:3px solid #4a5c30;padding-left:8px;margin:16px 0 10px}
.promo-item{display:flex;justify-content:space-between;padding:8px 11px;font-size:12.5px;border-bottom:1px solid #1c2216}
.promo-item:last-child{border-bottom:none}
.promo-item.pass{color:#9dd96a}
.promo-item.fail{color:#d95a4a}
.promo-phase{background:#10150c;border:1px solid #2a3520;border-radius:4px;padding:14px;margin-bottom:10px}
.phase-name{color:#c9a227;font-size:13px;font-weight:700;margin-bottom:7px;letter-spacing:1px}
.phase-desc{color:#94a878;font-size:12.5px;line-height:1.75;margin-bottom:12px}
.phase-choice{
  display:block;width:100%;text-align:left;background:#161d0f;border:1px solid #3a4a26;
  color:#b6cc8a;padding:10px 13px;font-family:inherit;font-size:12.5px;border-radius:3px;
  margin-bottom:7px;cursor:pointer;transition:.15s;line-height:1.55;
}
.phase-choice:hover{background:#1f2b14;border-color:#6d9440}
.phase-choice.selected{background:#1e2c10;border-color:#c9a227;color:#e8d98a}
.phase-choice .hint{color:#68774f;font-size:11px;display:block;margin-top:3px}
.phase-choice.selected .hint{color:#a89a4a}
.result-line{font-size:12.5px;padding:9px 12px;border-radius:3px;margin:5px 0;line-height:1.55}
.result-excellent{background:#1a2a0e;color:#9dd96a;border-left:3px solid #4a7a2a}
.result-good{background:#1a1e0e;color:#b6cc8a;border-left:3px solid #6d9440}
.result-pass{background:#1a1a0e;color:#c9a227;border-left:3px solid #7a6a1a}
.result-marginal{background:#2a1e0e;color:#d98a4a;border-left:3px solid #7a4a1a}
.result-fail{background:#2a0e0e;color:#d95a4a;border-left:3px solid #7a2a1a}
.promo-btn{
  display:block;width:100%;padding:13px;background:#1f2b14;border:1px solid #6d9440;
  color:#b9d98a;font-family:inherit;font-size:14px;letter-spacing:3px;border-radius:4px;
  cursor:pointer;font-weight:700;margin-top:16px;transition:.15s;
}
.promo-btn:hover:not(:disabled){background:#2a3a1a;box-shadow:0 0 14px rgba(109,148,64,.3)}
.promo-btn:disabled{opacity:.35;cursor:not-allowed}

/* ===== 特种部队选拔 ===== */
.sof-header{text-align:center;margin-bottom:14px}
.sof-phase-counter{color:#68774f;font-size:11px;letter-spacing:2px;margin-top:3px}
.sof-dor{
  display:block;width:100%;padding:9px;background:#1a0e0e;border:1px solid #5a2020;
  color:#c95a4a;font-family:inherit;font-size:11.5px;letter-spacing:2px;border-radius:4px;
  cursor:pointer;font-weight:700;margin-top:12px;transition:.15s;
}
.sof-dor:hover{background:#2a1010;border-color:#a04040}
.sof-pass{
  color:#9dd96a;font-size:15px;text-align:center;font-weight:700;letter-spacing:3px;
  padding:16px;background:#1a2a0e;border:1px solid #4a7a2a;border-radius:4px;margin:14px 0;
}
.sof-fail{
  color:#d95a4a;font-size:15px;text-align:center;font-weight:700;letter-spacing:3px;
  padding:16px;background:#1a0e0e;border:1px solid #5a2020;border-radius:4px;margin:14px 0;
}
.sof-score-line{
  display:flex;justify-content:space-between;padding:7px 10px;font-size:12px;
  border-bottom:1px solid #1c2216;
}
.sof-score-line:last-child{border-bottom:none}

/* ===== 部署系统 ===== */
.deploy-header{text-align:center;margin-bottom:14px}
.deploy-meta{color:#68774f;font-size:11px;letter-spacing:2px;margin-top:3px}
.deploy-status{
  display:inline-block;padding:3px 9px;border-radius:3px;font-size:10.5px;
  letter-spacing:1px;margin-top:6px;
}
.deploy-status.low{background:#1a2a0e;color:#9dd96a;border:1px solid #4a7a2a}
.deploy-status.mid{background:#1a1a0e;color:#c9a227;border:1px solid #7a6a1a}
.deploy-status.high{background:#2a1e0e;color:#d98a4a;border:1px solid #7a4a1a}
.deploy-status.veryhigh{background:#2a0e0e;color:#d95a4a;border:1px solid #7a2a1a}
.deploy-narr{
  color:#94a878;font-size:12.5px;line-height:1.8;padding:9px 12px;
  background:#10150c;border-left:3px solid #3a4a26;border-radius:3px;margin:9px 0;
}

/* ===== 人际关系面板 ===== */
#rel-panel{
  padding:7px 14px;background:#0b0e08;border-bottom:1px solid #1c2216;
  display:flex;flex-direction:column;gap:4px;flex-shrink:0;
}
.rel-row{display:flex;align-items:center;gap:6px;font-size:11px}
.rel-label{color:#5d6b48;width:56px;flex-shrink:0;font-size:10.5px}
.rel-name{color:#94a878;width:52px;flex-shrink:0;font-size:10.5px}
.rel-bar{flex:1;height:4px;background:#1a2013;border-radius:2px;overflow:hidden}
.rel-fill{height:100%;border-radius:2px;transition:width .4s}
.rel-fill.high{background:linear-gradient(90deg,#4a6b2a,#8fbf55)}
.rel-fill.mid{background:linear-gradient(90deg,#7a6a1a,#c9a227)}
.rel-fill.low{background:linear-gradient(90deg,#7a2a1a,#c94a2a)}
.rel-val{color:#94a878;width:22px;text-align:right;flex-shrink:0;font-size:10.5px}
.npc-event{border-left:3px solid #c9a227;padding-left:10px;color:#d9b84a;font-size:12px}

/* ===== 履历页 ===== */
#career-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(6,7,10,.97);display:none;z-index:100;
  padding:20px 14px 40px;overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#4a5c30 #10150c;
}
#career-overlay::-webkit-scrollbar{width:8px}
#career-overlay::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#career-overlay::-webkit-scrollbar-thumb{
  background:#3a4a26;border-radius:4px;border:2px solid #10150c;
}
#career-overlay::-webkit-scrollbar-thumb:hover{background:#5a6b3a}
#rel-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(6,7,10,.97);display:none;z-index:100;
  padding:20px 14px 40px;overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#4a5c30 #10150c;
}
#rel-overlay.show{display:block}
#rel-overlay::-webkit-scrollbar{width:8px}
#rel-overlay::-webkit-scrollbar-track{background:#10150c;border-radius:4px}
#rel-overlay::-webkit-scrollbar-thumb{
  background:#3a4a26;border-radius:4px;border:2px solid #10150c;
}
#rel-overlay::-webkit-scrollbar-thumb:hover{background:#5a6b3a}
#rel-content{
  width:100%;max-width:440px;margin:0 auto;background:#0d1009;
  border:1px solid #2a3520;border-radius:6px;padding:20px 18px;
}

/* 事件选项弹窗 */
.promo-title + .deploy-narr{margin-top:0}

/* ===== 人事Tab ===== */
.rel-tabs{display:flex;margin-bottom:16px;border-bottom:1px solid #2a3520}
.rel-tab{
  flex:1;padding:10px;text-align:center;
  color:#68774f;font-size:12.5px;letter-spacing:2px;
  cursor:pointer;transition:.15s;
  background:transparent;border:none;font-family:inherit;
  border-bottom:2px solid transparent;
}
.rel-tab:hover{color:#94a878}
.rel-tab.active{color:#e8d98a;border-bottom-color:#c9a227}

/* ===== 战友卡片 ===== */
.squad-section-label{
  color:#7d8f5e;font-size:11.5px;letter-spacing:2px;
  border-left:3px solid #4a5c30;padding-left:8px;margin:14px 0 8px;
}
.squad-card{
  background:#141a0e;border:1px solid #2a3520;border-radius:4px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s;
}
.squad-card:hover{border-color:#7ba34a;background:#1a2312}
.squad-card.core{border-left:3px solid #c9a227}
.squad-card.flow{border-left:3px solid #4a6b2a}
.squad-name{color:#b6cc8a;font-weight:700;font-size:13.5px;margin-bottom:3px}
.squad-meta{color:#68774f;font-size:11px;margin-bottom:5px}
.squad-bars{display:flex;flex-direction:column;gap:3px}
.squad-bar-row{display:flex;align-items:center;gap:6px;font-size:10.5px}
.squad-bar-label{color:#68774f;width:28px;flex-shrink:0}
.squad-bar{flex:1;height:4px;background:#1a2013;border-radius:2px;overflow:hidden}
.squad-bar-fill{height:100%;border-radius:2px;transition:width .4s}

const PERF_THRESHOLD = {

  'W-1':68,'W-2':75,'W-3':81,'W-4':86,'W-5':91,

};

/* =========================================================
   事件移除规则（倍率 < 1）
   ========================================================= */
const REMOVAL_RULES = [
  // 家庭链转岗 → 部署类大幅减少
  { cond:s=>s.chains && s.chains.familyEnd==='career_change',
    ids:['first_deploy','combat_tour','combat_cool','field_ex','patrol','mos_11b_assault','mos_11b_drill'],
    mult:0.35 },
  // SOF 队友牺牲 + 心理评估坦诚 → 战斗类减少
  { cond:s=>s.chains && s.chains.sofStage2==='honest',
    ids:['combat_tour','combat_cool','patrol','sof_recon'],
    mult:0.5 },
  // 政治站队中立派 → 政治类减少
  { cond:s=>s.chains && s.chains.politics==='neutral',
    ids:['politics_1','staff_job','cons_politics_reward','cons_politics_neutral_rep','media'],
    mult:0.6 },
  // 伤亡问责后退役 → 晋升相关事件几乎不再触发
  { cond:s=>s.chains && s.chains.casualtyEnd==='retire',
    ids:['nco_board','pool_officer_politics','cons_politics_reward','cons_politics_enemy_move','pool_officer_junior_ask'],
    mult:0.25 },
  // 有污点 → 被推荐类正面事件减少
  { cond:s=>hasTag('compromised'),
    ids:['award','cons_gray_clean_reputation','pool_officer_junior_ask','cons_general_medal_review','cons_general_legacy'],
    mult:0.45 },
  // 战后创伤 + 逃避 → 高强度战斗减少
  { cond:s=>s.chains && s.chains.ptsdStage2==='deny',
    ids:['combat_tour','patrol','mos_11b_drill','mos_11b_assault','field_ex'],
    mult:0.4 },
  // 家庭至上标签 → 部署类大幅减少
  { cond:s=>hasTag('family_first'),
    ids:['first_deploy','combat_tour','patrol','mos_11b_assault','mos_68w_masscal'],
    mult:0.3 },
  // 家庭链已触发 + 高士气 → 家庭类事件减少（已经处理好）
  { cond:s=>s.chains && s.chains.familyEnd,
    ids:['family_1','pool_family_crisis'],
    mult:0.4 },
  // 军事法庭 + 申诉成功 → 被调查类减少
  { cond:s=>s.chains && s.chains.courtEnd==='appeal',
    ids:['ig_complaint','cons_court_shadow','cons_gray_whitewash'],
    mult:0.5 },
  // 有"生死之交"标签 → 战友类事件减少
  { cond:s=>hasTag('battle_bond'),
    ids:['buddy_1','cons_sof_ptsd_recur'],
    mult:0.5 },
  // 政治≥80 且 上级关系≥70 → 被打压类减少
  { cond:s=>s.pol>=80 && s.npcs && s.npcs.superior.value>=70,
    ids:['ig_complaint','cons_politics_enemy_move','budget_cut'],
    mult:0.4 },
  // 服役 20 年+ → 早期事件减少
  { cond:s=>s.yos>=20,
    ids:['bt1','bt2','bt3','bt4','bt5','bt6','acft_pass','acft_fail','field_ex'],
    mult:0.2 }
];

function getRemovalMultiplier(e){
  let m = 1.0;
  for(const r of REMOVAL_RULES){
    if(!r.ids.includes(e.id)) continue;
    try{ if(r.cond(state)) m *= r.mult; }catch(err){}
  }
  return m;
}

/* =========================================================
   世界状态系统
   ========================================================= */
const WORLD_STATES = {
  normal: {
    id:'normal', name:'常态', color:'#94a878', icon:'◌',
    desc:'国际局势相对平静，军队处于例行状态。',
    weight:1.0
  },
  wartime: {
    id:'wartime', name:'战时状态', color:'#d95a4a', icon:'⚔',
    desc:'某地区极端组织活动急剧增加，国家宣布进入战时状态。所有部署任务翻倍，晋升名额增加，但伤亡风险也大幅上升。',
    weight:1.6, deployMult:2.0, promoBonus:0.10, casualtyMult:1.5
  },
  peace: {
    id:'peace', name:'裁军时期', color:'#94a878', icon:'☮',
    desc:'大规模裁军开始。晋升名额减半，但转业安置条件优厚。',
    weight:0.5, promoBonus:-0.15, retireChance:1.5
  },
  budget_cut: {
    id:'budget_cut', name:'预算削减', color:'#d98a4a', icon:'✂',
    desc:'国防预算被削减。训练减少，晋升名额紧缩，全军士气低落。',
    weight:0.6, promoBonus:-0.10, moraleDrift:-2
  },
  reform: {
    id:'reform', name:'军事改革', color:'#c9a227', icon:'⚙',
    desc:'军队推行新一轮改革。考核标准提高，但优秀者晋升更快。',
    weight:1.15, examDifficulty:8, promoBonus:0.05
  },
  election: {
    id:'election', name:'大选之年', color:'#7ba34a', icon:'◆',
    desc:'国会进入大选周期。军队的政治敏感度显著提升。',
    weight:1.3, polWeightMult:1.4
  },
  scandal: {
    id:'scandal', name:'军中丑闻', color:'#d95a4a', icon:'!',
    desc:'一起军中丑闻被媒体曝光。全军展开整顿，IG 调查频繁。',
    weight:0.5, igChance:2.0, promoBonus:-0.08
  }
};

const WORLD_STATE_TRANSITIONS = [
  { from:'normal', to:'wartime', prob:0.08 },
  { from:'normal', to:'peace', prob:0.06 },
  { from:'normal', to:'budget_cut', prob:0.05 },
  { from:'normal', to:'reform', prob:0.07 },
  { from:'normal', to:'election', prob:0.04 },
  { from:'normal', to:'scandal', prob:0.03 },
  { from:'wartime', to:'normal', prob:0.40 },
  { from:'peace', to:'normal', prob:0.40 },
  { from:'budget_cut', to:'normal', prob:0.45 },
  { from:'reform', to:'normal', prob:0.35 },
  { from:'election', to:'normal', prob:0.60 },
  { from:'scandal', to:'normal', prob:0.50 }
];

function getCurrentWorldState(){
  if(!state.worldState) return WORLD_STATES.normal;
  return WORLD_STATES[state.worldState.current] || WORLD_STATES.normal;
}

function tickWorldState(){
  if(!state.worldState){
    state.worldState = { current:'normal', yearsIn:0, history:[] };
  }
  const w = state.worldState;
  w.yearsIn++;

  // 状态持续 2~5 年后强制回归
  if(w.current !== 'normal' && w.yearsIn >= 2 + Math.floor(Math.random()*3)){
    if(Math.random() < 0.5){
      w.history.push({ year:state.yos, from:w.current, to:'normal' });
      w.current = 'normal';
      w.yearsIn = 0;
      addLog(`🌍 世界状态：进入常态。${WORLD_STATES.normal.desc}`, 'fx');
      return;
    }
  }

  const candidates = WORLD_STATE_TRANSITIONS.filter(t=>t.from===w.current);

  // 保底：normal 连续 3 年后强制切换
  const forceSwitch = (w.current === 'normal' && w.yearsIn >= 3);

  // 概率递增：normal 持续越久，进入特殊状态概率越高
  let probMult = 1.0;
  if(w.current === 'normal'){
    if(w.yearsIn >= 2) probMult = 2.0;
    if(w.yearsIn >= 3) probMult = 3.0;
  }

  // 保底触发：从候选里随机选一个非 normal 状态
  if(forceSwitch){
    const nonNormal = candidates.filter(t=>t.to !== 'normal');
    if(nonNormal.length){
      const pick = nonNormal[Math.floor(Math.random()*nonNormal.length)];
      w.history.push({ year:state.yos, from:w.current, to:pick.to });
      w.current = pick.to;
      w.yearsIn = 0;
      const newState = WORLD_STATES[pick.to];
      addLog(`🌍 世界状态：${newState.icon} ${newState.name}`, 'good');
      addLog(newState.desc, 'fx');
      return;
    }
  }

  // 正常概率触发（受 probMult 影响）
  for(const t of candidates){
    if(Math.random() < t.prob * probMult){
      w.history.push({ year:state.yos, from:w.current, to:t.to });
      w.current = t.to;
      w.yearsIn = 0;
      const newState = WORLD_STATES[t.to];
      if(t.to === 'normal'){
        addLog(`🌍 世界状态：进入常态。${newState.desc}`, 'fx');
      } else {
        addLog(`🌍 世界状态：${newState.icon} ${newState.name}`, 'good');
        addLog(newState.desc, 'fx');
      }
      return;
    }
  }

  // 特殊状态下的额外影响
  if(w.current === 'budget_cut'){
    state.morale = clamp(state.morale-2, 0, 100);
  }
}

function getWorldWeightMultiplier(e){
  const w = getCurrentWorldState();
  let m = 1.0;

  // 战时：战斗/部署类事件大幅提升
  if(w.id === 'wartime'){
    const warIds = ['first_deploy','combat_tour','combat_cool','patrol','mos_11b_assault','mos_11b_drill','field_ex','sof_recon'];
    if(warIds.includes(e.id)) m *= 2.0;
  }
  // 裁军：部署/晋升类事件减少
  if(w.id === 'peace'){
    const peaceIds = ['first_deploy','combat_tour','patrol','nco_board','pool_officer_politics'];
    if(peaceIds.includes(e.id)) m *= 0.4;
  }
  // 预算削减：训练类减少，士气类增加
  if(w.id === 'budget_cut'){
    const cutIds = ['bt1','bt2','bt5','field_ex','acft_pass'];
    if(cutIds.includes(e.id)) m *= 0.5;
    if(e.id === 'cons_general_ghost') m *= 1.5;
  }
  // 改革：考核类、学习类增加
  if(w.id === 'reform'){
    const refIds = ['school','pmE','acft_pass','mos_school','pool_wo_equipment'];
    if(refIds.includes(e.id)) m *= 1.5;
  }
  // 大选：政治类事件增加
  if(w.id === 'election'){
    const polIds = ['ig_complaint','media','staff_job','politics_1','cons_politics_reward','cons_politics_enemy_move'];
    if(polIds.includes(e.id)) m *= 1.6;
  }
  // 丑闻：IG 调查类增加
  if(w.id === 'scandal'){
    const igIds = ['ig_complaint','cons_gray_whitewash','cons_court_shadow','budget_cut'];
    if(igIds.includes(e.id)) m *= 2.0;
  }
  return m;
}

  // 家庭链已触发 → 家庭类
  { cond:s=>s.chains && s.chains.family, ids:['cons_family_grown_child','family_2'], mult:1.5 },
  // 老兵转型期 → 转型事件
  { cond:s=>s.yos>=15, ids:['cons_transition_offer','cons_transition_academic','cons_transition_stay','transition_1'], mult:1.4 }
];

function getWeightMultiplier(e){
  let m = 1.0;
  for(const mod of WEIGHT_MODIFIERS){
    if(!mod.ids.includes(e.id)) continue;
    try{ if(mod.cond(state)) m *= mod.mult; }catch(err){}
  }
  return m;
}

function resolveInvestReturn(){
  if(!state.financeFlags.investType) return;
  const principal = state.financeFlags.investPrincipal || 0;
  const type = state.financeFlags.investType;
  const years = state.yos - (state.financeFlags.investStartYear || state.yos);

  // 三种方案的基础回报率 + 波动
  let annualRate, volatility;
  if(type === 'safe'){ annualRate = 0.06; volatility = 0.02; }
  else if(type === 'standard'){ annualRate = 0.12; volatility = 0.08; }
  else { annualRate = 0.25; volatility = 0.25; }

  // 最终收益率 = 复利 × 随机波动（三档）
  const roll = (Math.random() - 0.5) * volatility * years;
  const finalRate = Math.pow(1 + annualRate, years) + roll;

  // 限幅：最低 -50%，最高 4 倍
  const finalMultiplier = clamp(finalRate, -0.5, 4.0);
  const finalAmount = Math.round(principal * (1 + finalMultiplier));

  state.finance.balance += finalAmount;
  state.financeFlags.investResolved = true;

  if(finalAmount > principal){
    const profit = finalAmount - principal;
    state.morale = clamp(state.morale + 5, 0, 100);
    addLog(`📈 投资回报：+$${profit.toLocaleString()}（本金 $${principal.toLocaleString()} → $${finalAmount.toLocaleString()}）`, 'good');
    addCareer('milestone', '投资获利', `+$${profit.toLocaleString()}`);
  } else {
    const loss = principal - finalAmount;
    state.morale = clamp(state.morale - 6, 0, 100);
    addLog(`📉 投资亏损：-$${loss.toLocaleString()}（本金 $${principal.toLocaleString()} → $${finalAmount.toLocaleString()}）`, 'bad');
    addCareer('milestone', '投资亏损', `-$${loss.toLocaleString()}`);
  }
}

function handleDebtChoice(choice){
  if(choice === 'loan'){
    state.finance.loans += 300;
    state.finance.balance += 10000;
    state.morale = clamp(state.morale - 5, 0, 100);
    addLog('你申请了个人贷款。余额 +$10,000，月供增加 $300', 'warn');
    addCareer('milestone', '债务危机：贷款', '');
    state.financeFlags.debtCrisisActive = false;
  } else if(choice === 'cut'){
    state.financeFlags.cutExpense = 12;
    state.morale = clamp(state.morale - 5, 0, 100);
    addLog('你决定彻底削减开支。月支出减半，持续 12 个月。士气 -5', 'warn');
    addCareer('milestone', '债务危机：节流', '');
    state.financeFlags.debtCrisisActive = false;
  } else if(choice === 'sell'){
    if(state.finance.hasCar){
      state.finance.hasCar = false;
      state.finance.balance += 8000;
      addLog('你卖掉了车。余额 +$8,000', 'warn');
    } else if(state.finance.hasHouse){
      state.finance.hasHouse = false;
      state.finance.balance += 40000;
      addLog('你卖掉了房子。余额 +$40,000', 'bad');
    } else {
      state.finance.balance += 3000;
      addLog('你卖掉了所有能卖的东西。余额 +$3,000', 'warn');
    }
    state.morale = clamp(state.morale - 10, 0, 100);
    addCareer('milestone', '债务危机：变卖资产', '');
    state.financeFlags.debtCrisisActive = false;
  } else {
    state.morale = clamp(state.morale - 15, 0, 100);
    addLog('你无视了债务。士气 -15，债务继续累积', 'bad');
    addCareer('milestone', '债务危机：无视', '');
    state.financeFlags.debtCrisisActive = false;
    state.financeFlags.debtIgnoreCount = (state.financeFlags.debtIgnoreCount || 0) + 1;
  }
}

function monthlyMarriage(){
  if(!state.spouse) return;
  const sp = state.spouse;
  if(sp.status === 'single' || sp.status === 'divorced') return;

  const pers = getSpousePersonality(sp.personality);

  // 恋爱/订婚期
  if(sp.status === 'dating' || sp.status === 'engaged'){
    sp.love = clamp(sp.love - 1, 0, 100);
    sp.love = clamp(sp.love + (pers.loveDrift || 0), 0, 100);
  }

  // 婚姻期
  if(sp.status === 'married'){
    if(state.flags.in_deploy){
      sp.pressure = clamp(sp.pressure + 5, 0, 100);
    } else {
      sp.pressure = clamp(sp.pressure - (pers.pressureResist || 0) * 2, 0, 100);
    }
    sp.pressure = clamp(sp.pressure - 1, 0, 100);

    // 爱意随压力缓慢降低
    if(sp.pressure >= 70){
      sp.love = clamp(sp.love - 1, 0, 100);
    } else if(sp.pressure <= 30){
      sp.love = clamp(sp.love + 1, 0, 100);
    }
  }

  // 孩子年龄增长（每 12 个月 +1）
  if(sp.children && sp.children.length){
    sp.children.forEach(c=>{
      if((state.yos + state.month/12) - c.birthAt >= 1 && c.age < (state.yos - c.birthYear)){
        // 简化：用 yos 差计算年龄
      }
    });
    // 每年 1 月孩子 +1 岁 + 成长
    if(state.month === 1){
      sp.children.forEach(c=>{
        c.age += 1;
        // 属性自然成长
        c.intelligence = clamp(c.intelligence + randomInt(1,2), 0, 100);
        c.physique = clamp(c.physique + randomInt(1,2), 0, 100);
        c.discipline = clamp(c.discipline + randomInt(1,2), 0, 100);

          c.militaryInterest = clamp(c.militaryInterest + randomInt(-2, 3), 0, 100);
        }
        c.events.push(`第 ${state.yos} 年 · ${c.age} 岁`);
      });
    }
  }
}

function addFinance(type, amount, note){
  if(!state.finance) return;
  state.finance.balance += amount;
  if(amount > 0) state.finance.totalIncome += amount;
  if(amount < 0) state.finance.totalExpense += Math.abs(amount);
  state.finance.log.push({
    year: state.yos, month: state.month,
    type: type, amount: amount, note: note || ''
  });
  // 只保留最近 30 条
  if(state.finance.log.length > 30){
    state.finance.log = state.finance.log.slice(-30);
  }
  state.finance.status = getFinanceStatus().id;
}

function monthlyFinance(){
  if(!state.finance) return;

  // 收入
  const pay = getCurrentPay();
  const deployMult = state.flags.in_deploy ? 1.5 : 1.0;
  const income = Math.round(pay * deployMult);
  addFinance('pay', income, '军饷');

  // 配偶收入
  if(state.spouse && state.spouse.status === 'married' && state.spouse.profession){
    const prof = getSpouseProfession(state.spouse.profession);
    if(prof && prof.income > 0){
      addFinance('spouse', prof.income, `${state.spouse.name} 的收入`);
    }
  }

  // 支出
  let expense = LIVING_COST.food + LIVING_COST.personal + LIVING_COST.insurance;

  // 节流
  if(state.financeFlags.cutExpense > 0){
    expense = Math.round(expense * 0.5);
    state.financeFlags.cutExpense -= 1;
    if(state.financeFlags.cutExpense === 0){
      addLog('你的节流期结束了。恢复正常支出。', 'fx');
    }
  }

  if(state.spouse && state.spouse.status === 'married'){
    expense += 600;
  }

  if(state.finance.hasHouse) expense += 1200;
  if(state.finance.hasCar) expense += 300;
  if(state.finance.mortgage > 0) expense += state.finance.mortgage;
  if(state.finance.loans > 0) expense += state.finance.loans;

  // 孩子教育支出
  if(state.spouse && state.spouse.children){
    state.spouse.children.forEach(c=>{
      if(c.age >= 6 && c.age <= 18) expense += 400;
      else if(c.age > 18 && c.age <= 22) expense += 800;
    });
  }

  addFinance('living', -expense, '日常支出');

  // 财务状态对士气的影响
  const st = getFinanceStatus();
  if(st.id === 'wealthy') state.morale = clamp(state.morale + 1, 0, 100);
  else if(st.id === 'debt') state.morale = clamp(state.morale - 1, 0, 100);
  else if(st.id === 'bankrupt') state.morale = clamp(state.morale - 2, 0, 100);

  // 债务危机检查
  checkDebtCrisis();
}

function renderFinanceLine(){
  const el = document.getElementById('finance-line');
  if(!el) return;
  if(!state.finance){
    el.classList.remove('show');
    return;
  }
  const st = getFinanceStatus();
  const balance = state.finance.balance;
  const display = balance >= 0 ? `$${balance.toLocaleString()}` : `-$${Math.abs(balance).toLocaleString()}`;
  el.classList.add('show');
  el.innerHTML = `<span style="color:${st.color}">💰 ${display}</span><span style="color:#5d6b48;margin-left:8px">·</span><span style="color:${st.color};margin-left:6px">${st.label}</span>`;
}

function randomPick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function randomInt(min, max){
  return Math.floor(Math.random()*(max-min+1)) + min;
}

function generateSquadMember(isCore, index){
  // 角色：核心用固定建制，流动从剩余池里选
  const role = isCore
    ? CORE_SQUAD_ROLES[index % CORE_SQUAD_ROLES.length]
    : FLOW_SQUAD_ROLES[Math.floor(Math.random()*FLOW_SQUAD_ROLES.length)];

  const personality = randomPick(SQUAD_PERSONALITIES);
  const name = SQUAD_NAMES.splice(Math.floor(Math.random()*SQUAD_NAMES.length), 1)[0] || `士兵${index}`;

  let basePT, baseMOS, baseLoyalty, baseMorale, baseRank, baseAge;
  if(isCore){
    baseAge = Math.max(19, state.age - randomInt(2, 6));
    basePT = randomInt(55, 75);
    baseMOS = randomInt(50, 70);
    baseLoyalty = randomInt(55, 75);
    baseMorale = randomInt(60, 80);
    const playerGrade = state.grade;
    baseRank = Math.max(2, Math.min(playerGrade - 1, randomInt(2, 4)));
  } else {
    baseAge = Math.max(19, state.age - randomInt(1, 8));
    basePT = randomInt(45, 80);
    baseMOS = randomInt(40, 75);
    baseLoyalty = randomInt(40, 70);
    baseMorale = randomInt(50, 80);
    baseRank = randomInt(2, 5);
  }

  return {
    id: isCore ? 'core_' + index : 'flow_' + index,
    name,
    age: baseAge,
    joinYear: state.yos - randomInt(1, 4),
    rank: baseRank,
    role,
    personality: personality.id,
    personalityName: personality.name,
    pt: basePT,
    mos: baseMOS,
    loyalty: baseLoyalty,
    morale: baseMorale,
    isCore: !!isCore,
    alive: true,
    bio: randomPick(SQUAD_BIOS[role] || SQUAD_BIOS['步枪手']),
    bioUnlocked: false,
    events: [],
    medals: []
  };
}

function ensureSquadExists(){
  if(state.squad) return;
  if(state.track !== 'E') return;
  if(state.grade < 4) return;

  // 生成 3 核心 + 4 流动
  const core = [];
  const flow = [];
  for(let i = 0; i < 3; i++){
    core.push(generateSquadMember(true, i));
  }
  for(let i = 0; i < 4; i++){
    flow.push(generateSquadMember(false, i));
  }

  state.squad = {
    core,
    flow,
    memorial: []
  };

  addLog('你被任命为班长，手下有了一支小队。3 名核心战友将长期跟随你，4 名流动战友会因调动而轮换。', 'good');
  addCareer('milestone', '组建小队', '3 核心 · 4 流动');
}

function getSquadMember(id){
  if(!state.squad) return null;
  return state.squad.core.find(m=>m.id===id) || state.squad.flow.find(m=>m.id===id);
}

function getSquadRankName(grade){
  return RANK_NAMES['E-' + grade] || '士兵';
}

const COMMAND_TIERS = {
  company:   { id:'company',   name:'连',   strength:[100, 150], rankReq:'E-7 / O-3', fullPrefix:'连' },
  battalion: { id:'battalion', name:'营',   strength:[500, 700], rankReq:'E-8 / O-5', fullPrefix:'营' },
  brigade:   { id:'brigade',   name:'旅',   strength:[3000, 4000], rankReq:'E-9 / O-6', fullPrefix:'旅' },
  division:  { id:'division',  name:'师',   strength:[10000, 15000], rankReq:'O-7+', fullPrefix:'师' }
};

function getLocationUnitModifiers(){
  if(!state.location) return { morale:0, training:0, equipment:0 };
  const loc = state.location;
  const key = loc._key;

  // 训练中心
  if(['benning','bliss','riley','stewart'].includes(key)){
    return { morale:0, training:+1, equipment:0 };
  }
  // 战斗部队
  if(['bragg','campbell','hood','drum','lewis'].includes(key)){
    return { morale:+1, training:0, equipment:-1 };
  }
  // 后勤基地
  if(['meade'].includes(key)){
    return { morale:0, training:0, equipment:+1 };
  }
  // 海外常驻
  if(['humphreys','kadena','ramstein','vicenza','schofield'].includes(key)){
    return { morale:-1, training:0, equipment:0 };
  }
  // 关岛/阿拉斯加
  if(['guam','wainwright'].includes(key)){
    return { morale:-1, training:-1, equipment:-1 };
  }
  // 部署战区
  if(loc.isDeploy){
    return { morale:-2, training:+2, equipment:-1 };
  }
  return { morale:0, training:0, equipment:0 };
}

function monthlyCommandUpdate(){
  if(!state.command || !state.command.active) return;

  const cmd = state.command;
  const mod = getLocationUnitModifiers();

  // 自然衰减
  cmd.morale     = clamp(cmd.morale     - 1 + mod.morale,     0, 100);
  cmd.training   = clamp(cmd.training   - 1 + mod.training,   0, 100);
  cmd.equipment  = clamp(cmd.equipment  - 2 + mod.equipment,  0, 100);

  // 战备等级自然衰减：连续 6 个月不维护，降一级
  if(state.month === 1){
    if(state.yos - cmd.lastMaintenanceYear >= 1){
      cmd.readiness = clamp(cmd.readiness + 1, 1, 4);
    }
  }

  // 单位 AP 每月重置
  cmd.ap = cmd.apMax;
}

function checkCommandYearlyReport(){
  if(!state.command) return;
  const cmd = state.command;
  const baseScore = (cmd.morale + cmd.training + cmd.equipment) / 3;
  const readinessMult = (5 - cmd.readiness) / 4;
  const score = Math.round(baseScore * readinessMult);

  let grade, gradeClass;
  if(score >= 90){ grade = '卓越'; gradeClass = 'excellent'; }
  else if(score >= 75){ grade = '优秀'; gradeClass = 'good'; }
  else if(score >= 60){ grade = '良好'; gradeClass = 'fair'; }
  else if(score >= 40){ grade = '及格'; gradeClass = 'poor'; }
  else { grade = '不及格'; gradeClass = 'fail'; }

  cmd.yearlyReports.push({ year: state.yos, score, grade, gradeClass });
  if(cmd.yearlyReports.length > 10) cmd.yearlyReports = cmd.yearlyReports.slice(-10);

  addLog(`📋 ${state.yos} 年度单位评估：${score} 分 · ${grade}`, gradeClass === 'excellent' ? 'good' : gradeClass === 'fail' ? 'bad' : 'fx');
  addCareer('milestone', `${state.yos} 年度单位评估`, `${score} 分 · ${grade}`);

  // 影响政治和上级关系
  if(score >= 90){
    state.pol = clamp(state.pol+3, 0, 100);
    state.npcs.superior.value = clamp(state.npcs.superior.value+3, 0, 100);
    addFaction('warrior', 5);
  } else if(score < 40){
    state.pol = clamp(state.pol-3, 0, 100);
    state.npcs.superior.value = clamp(state.npcs.superior.value-5, 0, 100);
    addFaction('warrior', -3);
  } else if(score >= 75){
    state.pol = clamp(state.pol+2, 0, 100);
    state.npcs.superior.value = clamp(state.npcs.superior.value+1, 0, 100);
  }
}

function getCommandTier(){
  if(state.track === 'E'){
    if(state.grade >= 9) return 'brigade';
    if(state.grade >= 8) return 'battalion';
    if(state.grade >= 7) return 'company';
  } else if(state.track === 'O'){
    if(state.grade >= 7) return 'division';
    if(state.grade >= 6) return 'brigade';
    if(state.grade >= 4) return 'battalion';
    if(state.grade >= 3) return 'company';
  } else if(state.track === 'W'){
    // 准尉不指挥战斗单位，但可以管技术团队
    return null;
  }
  return null;
}

function generateCompanyLetter(){
  return ['A','B','C','D','E'][Math.floor(Math.random()*5)];
}

function generateBattalionNumber(){
  return [1,2,3,4][Math.floor(Math.random()*4)];
}

function buildCommandFullName(tierId){
  if(!state.unit) return '未分配';
  const unitName = state.unit.name;
  if(tierId === 'company'){
    return `${unitName} · ${generateBattalionNumber()} 营 ${generateCompanyLetter()} 连`;
  }
  if(tierId === 'battalion'){
    return `${unitName} · ${generateBattalionNumber()} 营`;
  }
  if(tierId === 'brigade'){
    return `${unitName} · 旅部`;
  }
  if(tierId === 'division'){
    return `${unitName} · 师部`;
  }
  return unitName;
}

function generateCommandUnit(tierId){
  const tier = COMMAND_TIERS[tierId];
  if(!tier) return null;
  const strengthRange = tier.strength;
  const strength = randomInt(strengthRange[0], strengthRange[1]);
  return {
    active: true,
    tier: tierId,
    fullName: buildCommandFullName(tierId),
    strength: strength,
    morale: randomInt(50, 70),
    training: randomInt(50, 70),
    equipment: randomInt(50, 70),
    readiness: 3,
    ap: 4,
    apMax: 4,
    lastMaintenanceYear: state.yos,
    yearlyReports: []
  };
}

function ensureCommandExists(){
  if(state.track === 'W') return;
  const tierId = getCommandTier();
  if(!tierId) return;
  if(!state.unit) return;

  if(!state.command || state.command.tier !== tierId){
    const oldName = state.command ? state.command.fullName : null;
    state.command = generateCommandUnit(tierId);
    if(oldName){
      addLog(`🎖 你被任命为新的指挥岗位：${state.command.fullName}（${state.command.strength} 人）`, 'rank');
      addCareer('promotion', `就任 ${state.command.fullName}`, `兵力 ${state.command.strength}`);
    } else {
      addLog(`🎖 你被任命为 ${state.command.fullName} 指挥官（${state.command.strength} 人）`, 'rank');
      addCareer('promotion', `就任 ${state.command.fullName}`, `兵力 ${state.command.strength}`);
    }
  }
}

function refreshCommandFullName(){
  if(!state.command) return;
  state.command.fullName = buildCommandFullName(state.command.tier);
}

function checkMOHPrerequisites(){
  // 前置条件检查
  if(state.medals.includes('国会荣誉勋章')) return false;
  if(state.flags.mohAttempted) return false;
  if(!state.flags.sof && !state.flags.deployed) return false;
  if(state.lead < 85) return false;
  if(state.morale < 70) return false;
  if(state.yos < 5) return false;
  // 必须已经有至少一枚高级勋章（铜星或银星）或一等功
  const hasHighMedal = state.medals.includes('银星勋章') ||
                       state.medals.includes('铜星勋章') ||
                       (state.rankMedals && state.rankMedals.first > 0);
  if(!hasHighMedal) return false;
  // 必须有战友阵亡（代价）
  const hasLostBuddy = state.squad && state.squad.memorial &&
                       state.squad.memorial.some(m=>m.reason && m.reason.includes('阵亡'));
  if(!hasLostBuddy) return false;
  return true;
}

function checkMOHTrigger(){
  if(!checkMOHPrerequisites()) return false;
  // 每年 12 月判定，概率极低
  const roll = Math.random();
  // 基础 3%，SOF +2%，战时 +2%
  let chance = 0.03;
  if(state.flags.sof) chance += 0.02;
  const ws = getCurrentWorldState();
  if(ws && ws.id === 'wartime') chance += 0.02;
  if(state.lead >= 95) chance += 0.01;
  return roll < chance;
}

function getLocationsForMOS(mosCode){
  return UNITS.filter(u=>u.mos.includes(mosCode));
}

function assignInitialUnit(mosCode){
  const candidates = getLocationsForMOS(mosCode);
  if(!candidates.length) return UNITS[0];
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function getUnitLabel(){
  if(!state.unit) return '';
  return state.unit.name;
}

function triggerPCS(){
  if(!state.unit) return;
  const candidates = UNITS.filter(u=>{
    if(u.id === state.unit.id) return false;
    if(state.track === 'E' && !u.mos.includes(state.mosCode)) return false;
    if(state.track === 'O' && u.tier !== '师' && u.tier !== '旅' && u.tier !== '司令部') return false;
    if(state.flags.sof && !u.sof) return false;
    if(!state.flags.sof && u.sof) return false;
    return true;
  });
  if(!candidates.length) return;

  const newUnit = candidates[Math.floor(Math.random()*candidates.length)];
  const newLoc = LOCATIONS[newUnit.loc];
  const oldUnitName = state.unit.name;
  const oldLocName = state.location ? state.location.name : '未知';

  state.unit = { id: newUnit.id, name: newUnit.name, code: newUnit.code, tier: newUnit.tier, sof: !!newUnit.sof };
  state.location = Object.assign({}, newLoc);
  state.location._key = newUnit.loc;
  state._lastPCS = state.yos;

  addLog(`📦 PCS 调令：从 ${oldUnitName}（${oldLocName}）调往 ${newUnit.name}（${newLoc.name}）。`, 'good');
  addCareer('milestone', `PCS 调动：${newUnit.name}`, `从 ${oldLocName} → ${newLoc.name}`);
  // 单位重置（调到新部队接管新单位）
  if(state.command){
    const tierId = state.command.tier;
    state.command = generateCommandUnit(tierId);
    addLog(`你接管了新的单位：${state.command.fullName}`, 'rank');
  }
}

function getLocationLabel(){
  if(!state.location) return '';
  return state.location.state ? `${state.location.name}（${state.location.state}）` : state.location.name;
}

function getUnitWithLocation(){
  if(!state.unit || !state.location) return '—';
  return `${state.unit.name} · ${state.location.name}`;
}

function getDutyTitle(){
  const t = state.track;
  const g = state.grade;

  if(t === 'E'){
    const map = {
      1:'新兵', 2:'步枪手', 3:'自动步枪手',
      4:'火力组长', 5:'班长', 6:'排军士',
      7:'连军士长', 8:'营军士长', 9:'旅军士长'
    };
    return map[g] || '士兵';
  }
  if(t === 'W'){
    const map = {
      1:'技术主管', 2:'装备主管', 3:'装备主管',
      4:'高级技术顾问', 5:'技术总顾问'
    };
    return map[g] || '准尉';
  }
  if(t === 'O'){
    const map = {
      1:'排长', 2:'副连长', 3:'连长', 4:'参谋',
      5:'营长', 6:'旅长', 7:'副师长', 8:'师长',
      9:'军长', 10:'战区司令'
    };
    return map[g] || '军官';
  }
  return '—';
}

function renderUnitLine(){
  const el = document.getElementById('hud-unit');
  if(!el) return;
  if(!state.unit || !state.location){
    el.classList.remove('show');
    return;
  }
  el.classList.add('show');
  const deployLabel = state.deployedLocation
    ? `<span class="unit-deploy">⚔ 部署于 ${state.deployedLocation.name}</span>`
    : `<span class="unit-loc">${getLocationLabel()}</span>`;
  el.innerHTML = `<span class="unit-name">${state.unit.name}</span> · ${deployLabel}`;
}

const STORAGE_META_KEY = 'military_sim_meta_v1';
const STORAGE_SAVE_PREFIX = 'military_sim_save_v1_';
const SAVE_SLOTS = [1, 2, 3];

let activeSaveSlot = 1;

function readMeta(){
  try {
    const raw = localStorage.getItem(STORAGE_META_KEY);
    if(!raw) return getDefaultMeta();
    const data = JSON.parse(raw);
    return Object.assign(getDefaultMeta(), data);
  } catch(e){
    return getDefaultMeta();
  }
}

function getDefaultMeta(){
  return {
    achievements: [],
    legacyStarts: [],
    leaderboard: [],
    gallery: { medals: [], tags: [], endings: [], npcs: [] },
    totalGames: 0,
    totalYears: 0,
    bestScore: 0
  };
}

function writeMeta(meta){
  try {
    localStorage.setItem(STORAGE_META_KEY, JSON.stringify(meta));
  } catch(e){}
}

function saveGame(slot){
  if(!state) return;
  try {
    if(!state.usedEvents) state.usedEvents = [];
    state.usedEvents = [...usedEvents];
    const payload = {
      state: state,
      timestamp: Date.now(),
      version: 1
    };
    localStorage.setItem(STORAGE_SAVE_PREFIX + slot, JSON.stringify(payload));
  } catch(e){}
}

function loadGame(slot){
  try {
    const raw = localStorage.getItem(STORAGE_SAVE_PREFIX + slot);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !data.state) return null;

    // 与默认状态合并，兼容新字段
    const blank = newState(BACKGROUNDS[0], TALENTS[0], MOS_LIST[0]);
    const merged = deepMerge(data.state, blank);
    return merged;
  } catch(e){
    return null;
  }
}

function deleteSave(slot){
  try {
    localStorage.removeItem(STORAGE_SAVE_PREFIX + slot);
  } catch(e){}
}

function getSaveInfo(slot){
  try {
    const raw = localStorage.getItem(STORAGE_SAVE_PREFIX + slot);
    if(!raw) return null;
    const data = JSON.parse(raw);
    return data;
  } catch(e){
    return null;
  }
}

function deepMerge(target, defaults){
  for(const key in defaults){
    if(!(key in target)){
      target[key] = JSON.parse(JSON.stringify(defaults[key]));
    } else if(
      defaults[key] !== null && typeof defaults[key] === 'object' && !Array.isArray(defaults[key]) &&
      target[key] !== null && typeof target[key] === 'object' && !Array.isArray(target[key])
    ){
      deepMerge(target[key], defaults[key]);
    }
  }
  return target;
}

function formatSlotTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${day} ${hh}:${mm}`;
}

  intellect:  ['warrior', 'idealist'],

function getFactionLevel(value){
  if(value >= 90) return { level:'core',     label:'核心成员' };
  if(value >= 70) return { level:'member',   label:'正式成员' };
  if(value >= 40) return { level:'accepted', label:'被接纳' };
  if(value >= -10) return { level:'neutral',  label:'中立' };
  if(value >= -40) return { level:'marginal', label:'边缘人' };
  return { level:'enemy', label:'公敌' };
}

function addFaction(key, delta){
  if(!state.factions) state.factions = { warrior:0, intellect:0, pragmatist:0, idealist:0 };
  if(!state.factions[key] && state.factions[key] !== 0) return;
  const before = state.factions[key];
  state.factions[key] = clamp(state.factions[key] + delta, -100, 100);
  const after = state.factions[key];

  // 提升 A 必然降低 B
  if(delta > 0){
    const ops = FACTION_OPPOSITES[key] || [];
    ops.forEach(op=>{
      const opBefore = state.factions[op];
      // 对立方降低的幅度 = 提升幅度的 50%，但不低于 -100
      const opDelta = -Math.round(delta * 0.5);
      state.factions[op] = clamp(state.factions[op] + opDelta, -100, 100);
      if(state.factions[op] !== opBefore){
        // 不写日志，避免刷屏
      }
    });
  }

  // 检查是否获得派系勋章
  checkFactionMedals();
}

function checkFactionMedals(){
  if(!state.factions) return;
  if(!state.factionMedals) state.factionMedals = [];
  const medalMap = {
    warrior:    { member:'铁血勋章', core:'钢铁十字' },
    intellect:  { member:'智谋勋章', core:'智慧之环' },
    pragmatist: { member:'务实勋章', core:'秩序之星' },
    idealist:   { member:'理想勋章', core:'人性之光' }
  };

  ['warrior','intellect','pragmatist','idealist'].forEach(k=>{
    const v = state.factions[k];
    const def = medalMap[k];
    if(v >= 70 && !state.factionMedals.includes(def.member)){
      state.factionMedals.push(def.member);
      addLog(`⚔ 获得派系勋章：${def.member}（${FACTION_DEFS[k].name} 正式成员）`, 'good');
      addCareer('medal', `获得${def.member}`, `${FACTION_DEFS[k].name}好感 ≥ 70`);
    }
    if(v >= 90 && !state.factionMedals.includes(def.core)){
      state.factionMedals.push(def.core);
      addLog(`🏆 获得派系核心勋章：${def.core}（${FACTION_DEFS[k].name} 核心成员）`, 'good');
      addCareer('medal', `获得${def.core}`, `${FACTION_DEFS[k].name}好感 ≥ 90`);
    }
  });
}

function getFactionMedalBonus(key){
  if(!state.factionMedals) return 0;
  const v = state.factions[key] || 0;
  if(v >= 90) return 6;
  if(v >= 70) return 3;
  return 0;
}


function getNPC(key){
  return NPC_PROFILES[key];
}

function getNPCAttitude(key){
  const npc = state.npcs[key];
  const profile = NPC_PROFILES[key];
  if(!npc || !profile) return '';
  const v = npc.value;
  for(const a of profile.attitudes){
    if(v >= a.min) return a.text;
  }
  return profile.attitudes[profile.attitudes.length-1].text;
}

function getActionNPCMod(actionId, npcKey){
  const profile = NPC_PROFILES[npcKey];
  if(!profile) return 0;
  if(profile.likes && profile.likes[actionId] !== undefined) return profile.likes[actionId];
  if(profile.dislikes && profile.dislikes[actionId] !== undefined) return profile.dislikes[actionId];
  return 0;
}

function getMOS(code){
  return MOS_LIST.find(m=>m.code===code);
}
function getMOSEffectiveCap(){
  if(!state.mosCode || !state.track || state.track !== 'E') return 999;
  const m = getMOS(state.mosCode);
  if(!m) return 999;
  return m.cap + (state.breakthroughDone ? 1 : 0);
}

        const score = s.lead*0.3+s.pol*0.3+s.net*0.25+s.morale*0.15;
        if(score>=80){ s.pol+=5; s.net+=5; s.morale+=6; return '你通过了听证。总统签署了你的晋升令。你将星挂上了肩章。'; }
        else { s.morale-=10; return '你在听证会上被一位参议员追问了四十分钟关于某次部署的决策细节。晋升被搁置。'; }
      } },
    { label:'主动退出，申请退役', apply:s=>{ s.flags.retire_early=true; return '你给委员会回了一封信，感谢他们的信任，但你选择把机会留给更年轻的人。'; } }
  ]},

/* ---------- 通用随机事件 ---------- */
{ id:'family', w:9, cond:s=>s.yos>=2,
  text:'长期驻防让你和家人的关系变得紧张。妻子/丈夫在电话里说："你什么时候才能回来？孩子都不认识你了。"',
  fx:{morale:-5,pol:2,net:2} },

{ id:'injury', w:7, cond:s=>s.yos>=3&&s.pt>=50,
  text:'一次跳伞训练中你的着陆姿势出了问题，左膝韧带撕裂。军医说需要手术，恢复期至少六个月。',
  fx:{pt:-10,morale:-6,mos:2} },

{ id:'award', w:8, cond:s=>s.yos>=4&&s.lead>=60,
  text:'年度表彰大会上，你被授予陆军commendation medal，以表彰你在过去一年中的出色表现。',
  fx:{lead:3,net:4,morale:6,pol:2}, medals:['陆军嘉奖勋章'] },

{ id:'pcs', w:9, cond:s=>s.yos>=3&&s.yos%3===0,
  text:'永久换防命令（PCS）下达。你要打包全部家当，跨越半个国家去新的基地报到。',
  fx:{morale:-3,net:3,pol:2} },

{ id:'school', w:8, cond:s=>s.grade>=5&&!s.flags.pmE,
  text:'你被选中参加高级军士课程（Advanced NCO Course）。为期十周，同期学员都是各单位的精英。',
  fx:{mos:6,lead:5,pol:3,net:4}, flag:'pmE' },

{ id:'mentor', w:7, cond:s=>s.yos>=5,
  text:'一位即将退役的一级军士长找你喝酒。他说："我干了28年，最后悔的不是没升上去，是错过了孩子的成长。"',
  fx:{morale:-3,pol:4,lead:2} },

{ id:'budget_cut', w:6, cond:s=>s.grade>=6,
  text:'国防预算削减，你所在单位面临裁员。你需要在两周内提交一份削减15%人力的方案。',
  choices:[
    { label:'按绩效排名，末位淘汰', apply:s=>{ s.lead+=4; s.net-=6; s.morale-=3; return '方案执行了。被裁掉的士兵里有一个刚当上父亲。他离开时没有看你。'; } },
    { label:'平均分摊，全员承担', apply:s=>{ s.net+=3; s.lead-=2; s.pol+=3; return '没有人被裁，但所有人的工作量都增加了。上级对你的"柔性方案"不太满意。'; } }
  ]},

{ id:'media', w:5, cond:s=>s.grade>=7,
  text:'一家全国性媒体到基地采访，记者问了一个关于军队文化敏感话题的问题。公关部门让你"谨慎回答"。',
  choices:[
    { label:'按公关稿回答', apply:s=>{ s.pol+=5; s.net+=2; s.morale-=2; return '报道平稳发布。你被上级表扬"政治成熟"，但你自己知道刚才没说真话。'; } },
    { label:'说出真实想法', apply:s=>{ s.pol-=4; s.lead+=4; s.net+=4; s.morale+=3; return '你的话被原样引用。网上引起了争议，但很多基层士兵在社交媒体上支持你。'; } }
  ]},

/* ---------- MOS 专属事件 ---------- */
{ id:'mos_11b_drill', w:9, cond:s=>s.mosCode==='11B'&&s.grade>=3&&s.yos>=2,
  text:'连队战术比武。你带领的班组在城镇攻坚科目中拿到了全营第一，营长在总结会上专门提到了你的名字。',
  fx:{lead:4,pt:3,morale:4,net:2} },

{ id:'mos_12b_blast', w:9, cond:s=>s.mosCode==='12B'&&s.grade>=3&&s.yos>=2,
  text:'废弃弹药销毁任务。你亲手拆解了一枚未爆的 155mm 炮弹，手稳得像石头。事后教官说"这种活，不是谁都干得了"。',
  fx:{mos:5,pt:2,lead:2,morale:-1} },

{ id:'mos_68w_save', w:9, cond:s=>s.mosCode==='68W'&&s.grade>=3&&s.yos>=2,
  text:'一次实弹训练中的走火事故。你在三分钟内完成了止血、固定、输液，把伤员从死亡线上拉了回来。',
  fx:{mos:5,morale:5,lead:3,net:2}, medals:['陆军成就勋章'] },

{ id:'mos_35f_analysis', w:9, cond:s=>s.mosCode==='35F'&&s.grade>=3&&s.yos>=2,
  text:'一份情报分析报告呈交旅部，你从繁杂的信号情报中识别出了一条被忽视的线索，后续行动证实了你的判断。',
  fx:{mos:5,pol:4,net:3,lead:1} },

{ id:'mos_25b_outage', w:9, cond:s=>s.mosCode==='25B'&&s.grade>=3&&s.yos>=2,
  text:'营区通信系统突发故障。你在没有手册的情况下，用三个小时恢复了全营的指挥链路。营长亲自到机房看了你一眼。',
  fx:{mos:6,pol:3,net:3,morale:2} },

{ id:'mos_92y_shortage', w:9, cond:s=>s.mosCode==='92Y'&&s.grade>=3&&s.yos>=2,
  text:'一次大规模演习前的物资危机。你用一张电话表和几个人情，在 48 小时内补齐了全营短缺的 800 件装备。',
  fx:{pol:5,net:5,lead:2,mos:2} },

{ id:'mos_88m_convoy', w:9, cond:s=>s.mosCode==='88M'&&s.grade>=3&&s.yos>=2,
  text:'一次跨州长途运输任务。你在暴风雪中带队行驶了 900 英里，所有车辆和物资无一损失。',
  fx:{pt:4,mos:3,lead:3,pol:2} }

  ,

/* =========================================================
   剧情链条 · 1
   战友负伤链（4 步）
   ========================================================= */
{ id:'buddy_1', w:0, force:true,
  cond:s=>s.flags.deployed && s.yos>=3 && s.yos<=6 && s.grade>=3 && s.grade<=5 && !s.chains.buddy,
  text:'一次夜间巡逻，你身边的战友踩到了简易爆炸装置。爆炸声响起时你本能地趴下，等抬起头，他已经倒在地上，右腿不见了。你把他拖到掩体后面，用止血带扎住大腿根，但他一直在喊"我不想死"。',
  choices:[
    { label:'一直守着他，直到医疗后送到达', 
      apply:s=>{ s.chains.buddy='stayed'; s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale-8,0,100); 
        return '你在泥地上跪了四十分钟，握着他的手。直升机来的时候他还活着。事后你被连长点名表扬，但你连着几个晚上睡不着。'; } },
    { label:'把他交给卫生员，自己带队继续任务', 
      apply:s=>{ s.chains.buddy='continued'; s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale-5,0,100); 
        return '任务完成，目标被清剿。但你在回程的车上一直想，如果他死了，是不是因为你没能多陪他一会儿。'; } },
    { label:'留下两个人陪他，自己带主力继续', 
      apply:s=>{ s.chains.buddy='split'; s.lead=clamp(s.lead+2,0,100); s.mos=clamp(s.mos+2,0,100); s.morale=clamp(s.morale-6,0,100); s.net=clamp(s.net+2,0,100);
        return '你留下了两个弟兄陪护，自己带主力完成了任务。事后连长说："你做了正确的战术决定。" 但你回到营地那天晚上，还是去看了他一眼。'; } }
  ]},

{ id:'buddy_2a', w:0, force:true,
  cond:s=>s.chains.buddy==='stayed',
  text:'一年后，你在医院第一次见到他装上义肢的样子。他笑着说"你看，还能走路"，但你知道他花了多长时间练习。他递给你一封信，"等我走了再看"。',
  choices:[
    { label:'回信，写下你一直没说出口的话',
      apply:s=>{ s.chains.buddyStage2='replied'; s.morale=clamp(s.morale+6,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你在信里写了他负伤那天的每一个细节，以及你有多庆幸他还活着。他回信说："那天你握着我手的时候，我就知道我不会死。"'; } },
    { label:'把信收好，没有回', 
      apply:s=>{ s.chains.buddyStage2='silent'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-3,0,100);
        return '你把信锁进了抽屉。有些话，你不知道怎么说。'; } },
    { label:'请假去他家看看他的家人',
      apply:s=>{ s.chains.buddyStage2='visited'; s.net=clamp(s.net+4,0,100); s.morale=clamp(s.morale+8,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你在周末开了四个小时车去他家。他母亲抓着你的手一直哭，他父亲一直说"谢谢你把儿子带回来"。那天晚上你在回程车上哭了。'; } }
  ]},

{ id:'buddy_2b', w:0, force:true,
  cond:s=>s.chains.buddy==='continued',
  text:'一年后，你在一份退役人员名单上看到了他的名字。他活了下来，但没能保住右腿，也没能继续服役。你给他写了封信，他没回。',
  choices:[
    { label:'再写一封，附上当年的任务报告',
      apply:s=>{ s.chains.buddyStage2='persisted'; s.morale=clamp(s.morale+5,0,100); s.lead=clamp(s.lead+2,0,100);
        return '两个月后，他终于回信了。信上只有一句话："我当时理解你，现在也理解你。但那段时间我确实恨过你。"'; } },
    { label:'不再打扰他', 
      apply:s=>{ s.chains.buddyStage2='withdrew'; s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale-4,0,100);
        return '你把他的地址收进抽屉，再也没写过信。有些事，时间不一定能解决，只能让它过去。'; } },
    { label:'托战友捎一封信给他',
      apply:s=>{ s.chains.buddyStage2='indirect'; s.net=clamp(s.net+3,0,100); s.morale=clamp(s.morale-1,0,100);
        return '你把信交给一个跟他同乡的战友。三周后，那个战友说"他收到了"。仅此而已。'; } }
  ]},

{ id:'buddy_2c', w:0, force:true,
  cond:s=>s.chains.buddy==='split',
  text:'一年后，你收到了他母亲的一封信。他在信中说"那天有两个兄弟陪着我"，但那封信是三个月前写的——他在上个月因为并发症去世了。',
  choices:[
    { label:'去参加他的葬礼', 
      apply:s=>{ s.chains.buddyStage2='funeral'; s.morale=clamp(s.morale-10,0,100); s.lead=clamp(s.lead+5,0,100); s.net=clamp(s.net+3,0,100);
        return '葬礼那天你在他的棺木前站了很久。他的母亲对你说"谢谢你派了人陪他"。你什么也说不出来。'; } },
    { label:'写一封长信，寄给他的家人', 
      apply:s=>{ s.chains.buddyStage2='letter'; s.morale=clamp(s.morale-6,0,100); s.pol=clamp(s.pol+4,0,100);
        return '你在信里写下了那晚的所有细节。他的母亲后来把这封信裱起来挂在客厅里。'; } },
    { label:'从此不再提起这件事',
      apply:s=>{ s.chains.buddyStage2='avoided'; s.morale=clamp(s.morale-12,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你把这段记忆封存起来。从此以后你再也不提那个晚上。但你偶尔会在梦里听到他母亲的声音。'; } }
  ]},

{ id:'buddy_3', w:0, force:true,
  cond:s=>s.yos>=8 && s.chains.buddyStage2 && !s.chains.buddyEnd,
  text:'多年后，你已经在部队里担任更高的职务。一天，你收到了一封信——来自战友的家属或他本人。',
  choices:[
    { label:'认真读完，写下自己的回信',
      apply:s=>{ s.chains.buddyEnd='responded'; 
        if(s.chains.buddy==='stayed' && s.chains.buddyStage2==='visited'){ 
          addTag('battle_bond'); s.morale=clamp(s.morale+12,0,100); s.net=clamp(s.net+4,0,100); s.lead=clamp(s.lead+4,0,100);
          return '他后来成为了一名退伍军人事务官。他给你写信说："我见过太多回来的人，他们需要的不是安慰，是有人记得。"你在回信里只写了一句话："我一直记得。"'; 
        }
        if(s.chains.buddyStage2==='replied'){ 
          addTag('battle_bond'); s.morale=clamp(s.morale+8,0,100); s.lead=clamp(s.lead+3,0,100);
          return '你们成为了终身的朋友。每隔几年你们会见一次面，喝酒，聊当年的蠢事。他从不抱怨自己的腿。'; 
        }
        s.morale=clamp(s.morale+4,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你把信收进抽屉。有些人，有些事，需要时间来接受。'; } },
    { label:'把信转交给相关部门处理',
      apply:s=>{ s.chains.buddyEnd='transferred'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale-4,0,100);
        return '你把信转交给了退伍军人事务部门，按流程处理。这很专业，但你心里知道，有些事情不该让流程来处理。'; } }
  ]},

/* =========================================================
   剧情链条 · 2
   恩师传承链（4 步）
   ========================================================= */
{ id:'mentor_1', w:0, force:true,
  cond:s=>s.track==='E' && s.yos>=4 && s.yos<=8 && s.grade>=4 && s.grade<=6 && !s.chains.mentor,
  text:'连队里有一位服役了二十四年的一级军士长。他很少说话，但他带的兵从来没有一个掉队。某个晚上，他把你叫到办公室，递给你一杯咖啡。"我注意你很久了，"他说，"你想不想跟我学点东西？"',
  choices:[
    { label:'接受，每周跟他学两个小时', 
      apply:s=>{ s.chains.mentor='accepted'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale-3,0,100); 
        return '接下来一年，你每周有两个晚上在他的办公室度过。他教你如何读人、如何带队、如何在压力下做决定。那些东西不在任何条令里。'; } },
    { label:'婉拒，自己摸索', 
      apply:s=>{ s.chains.mentor='declined'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale+2,0,100); 
        return '你说你想先自己琢磨琢磨。他点了点头，没再说什么。走出办公室的时候，你有点后悔。'; } },
    { label:'答应，但也请他看你带一次兵',
      apply:s=>{ s.chains.mentor='mutual'; s.lead=clamp(s.lead+2,0,100); s.net=clamp(s.net+2,0,100); s.morale=clamp(s.morale-2,0,100); 
        return '他说"好"，然后在你下一次带队训练时站在操场边看了整整两个小时。事后他只说了一句："你有底子，但还差一层窗户纸。"'; } }
  ]},

{ id:'mentor_2', w:0, force:true,
  cond:s=>s.chains.mentor==='accepted' || s.chains.mentor==='mutual',
  text:'一年半后，一级军士长病倒了。他把你叫到病床前，递给你一本旧笔记本。"这是我二十四年的带兵笔记，"他说，"里面有些东西，条令里不写。"',
  choices:[
    { label:'郑重收下，答应替他传承',
      apply:s=>{ s.chains.mentorStage2='accepted'; s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你把笔记本贴在胸口，说了句"我会的"。他闭上眼，笑了一下。'; } },
    { label:'收下，但坦白说"我怕我做不到"',
      apply:s=>{ s.chains.mentorStage2='honest'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+2,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他睁开眼看着你说："说真话的人，才带得动兵。" 他把笔记本放回你手里。'; } },
    { label:'建议他把笔记整理成教材，供全连使用',
      apply:s=>{ s.chains.mentorStage2='share'; s.net=clamp(s.net+4,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+3,0,100);
        return '他沉默了很久，说"我这辈子没想过这个"。后来那本笔记被整理成了连队的内部教材。'; } }
  ]},

{ id:'mentor_3', w:0, force:true,
  cond:s=>s.chains.mentorStage2 && !s.chains.mentorEnd,
  text:'一级军士长去世了。葬礼上，来了近百名他带过的兵——有现役的，有退役的，有当了军官的，有开卡车的。你站在人群里，第一次意识到一个人可以影响那么多人。',
  choices:[
    { label:'在葬礼上发言，承诺继承他的衣钵',
      apply:s=>{ s.chains.mentorEnd='speech'; addTag('mentor_legacy'); s.lead=clamp(s.lead+7,0,100); s.morale=clamp(s.morale+6,0,100); s.net=clamp(s.net+4,0,100);
        return '你在灵前讲了五分钟。最后你说："他教我的东西，我会一个字一个字传下去。" 台下响起掌声的时候，你听见了自己声音里的颤抖。'; } },
    { label:'安静地参加，不说一句话',
      apply:s=>{ s.chains.mentorEnd='silent'; addTag('mentor_legacy'); s.pol=clamp(s.pol+5,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你没有发言。但接下来的十年里，每一个你带过的兵，都在他们成长的某个时刻，听到过一句"这是我当年一个老军士长教我的"。'; } },
    { label:'提议全连以他的名字命名一项年度奖',
      apply:s=>{ s.chains.mentorEnd='memorial'; addTag('mentor_legacy'); s.net=clamp(s.net+6,0,100); s.pol=clamp(s.pol+5,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你提议设立"XXX 军士长带兵奖"，全连全票通过。多年后这个奖还在颁发，每年都会有人提到他的名字。'; } }
  ]},

{ id:'mentor_4', w:0, force:true,
  cond:s=>s.chains.mentorEnd && s.grade>=6,
  text:'你第一次独立带教一批新兵。其中一个 19 岁的小伙子让你想起了当年的自己。你翻开那本旧笔记本，找到了他当年写的一句话："带兵先带心，命令管一时，人心管一世。"',
  fx:{lead:+6,morale:+6,net:+3} },

/* =========================================================
   剧情链条 · 3
   军官的抉择链（4 步）
   ========================================================= */
{ id:'officer_1', w:0, force:true,
  cond:s=>s.track==='O' && s.grade>=1 && s.grade<=3 && s.yos>=2 && !s.chains.officer_trial,
  text:'你手下的一名士兵在基地外醉酒打人，被宪兵拘留。他是一名优秀射手，还有三个月就要参加晋升考核。宪兵队把档案交到你手上，等你的处理意见。',
  choices:[
    { label:'按条令上报，走军事司法程序', 
      apply:s=>{ s.chains.officer_trial='strict'; s.lead=clamp(s.lead+5,0,100); s.net=clamp(s.net-4,0,100); s.pol=clamp(s.pol+3,0,100); 
        return '士兵被降级、罚款、留营察看。晋升考核取消。他在营区里看见你会绕路走，但连里的老军士长看你的眼神变了——那不是敌意，是尊重。'; } },
    { label:'内部处理，给他一次机会', 
      apply:s=>{ s.chains.officer_trial='lenient'; s.net=clamp(s.net+5,0,100); s.lead=clamp(s.lead-2,0,100); s.morale=clamp(s.morale+3,0,100); 
        return '你用自己的权限把事情压了下来。士兵感激涕零，从此对你死心塌地。但如果这件事将来被捅出去，你会有麻烦。'; } },
    { label:'公开处理，但为他保住军籍',
      apply:s=>{ s.chains.officer_trial='public_but_saved'; s.lead=clamp(s.lead+3,0,100); s.pol=clamp(s.pol+4,0,100); s.net=clamp(s.net-1,0,100);
        return '你在全连面前宣布处理决定，同时为他争取到了保留军籍的机会。士兵哭了出来。你也失去了三个月晋升的资格，但换来了一个愿意为你死的兵。'; } }
  ]},

{ id:'officer_2', w:0, force:true,
  cond:s=>s.chains.officer_trial && !s.chains.officerStage2,
  text:'四年后，你已经在另一个岗位上。当年那名士兵，现在还在部队里。你收到了他的一封信。',
  choices:[
    { label:'认真读完，回信',
      apply:s=>{ s.chains.officerStage2='replied';
        if(s.chains.officer_trial==='strict'){ s.pol=clamp(s.pol+4,0,100); s.lead=clamp(s.lead+2,0,100);
          return '他在信里说："当年你把我送上军事法庭，我恨过你。但后来我明白了，你教会了我什么叫底线。" 他现在是一名出色的军士长。'; }
        if(s.chains.officer_trial==='lenient'){ s.pol=clamp(s.pol+3,0,100); s.net=clamp(s.net+4,0,100);
          return '他在信里说："谢谢你当年相信我。" 但信的末尾加了一句："我最近又犯了一次，这次你可能帮不了我了。" 你放下信，心里一沉。'; }
        s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+4,0,100);
        return '他在信里说："你当年公开处理我，但也救了我的军籍。现在我是连里最老的班长了。" 信里还夹着一张他带兵训练的照片。'; } },
    { label:'不回信，让这件事过去',
      apply:s=>{ s.chains.officerStage2='silent'; s.pol=clamp(s.pol+3,0,100);
        return '你把信放进档案夹，没有回。军队是一台机器，人走茶凉是常态。你这样告诉自己。'; } }
  ]},

{ id:'officer_3', w:0, force:true,
  cond:s=>s.chains.officerStage2 && !s.chains.officerEnd,
  text:'又过了三年。你现在是少校。在一次旅部会议上，你看到了那名士兵——他也在场。他已经参加了 OCS，现在是旅里最年轻的情报参谋。会议结束后他走向你。',
  choices:[
    { label:'主动打招呼，握手',
      apply:s=>{ s.chains.officerEnd='reconcile'; addTag('principled'); s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+5,0,100); s.morale=clamp(s.morale+6,0,100);
        return '他握着你的手说："那年的事，我想了四年。你教会我的东西，比我上过的任何课都值。" 那一刻你意识到，当年那个决定没有错。'; } },
    { label:'保持距离，公事公办',
      apply:s=>{ s.chains.officerEnd='distant'; s.pol=clamp(s.pol+4,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你们在会议桌上互相敬礼，然后各自离开。有些关系不需要和解，只需要专业的距离。'; } },
    { label:'私下找他喝一杯',
      apply:s=>{ s.chains.officerEnd='drinks'; s.net=clamp(s.net+4,0,100); s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale+8,0,100);
        return '那天晚上你们在一个小镇酒吧里聊到凌晨。他告诉了你他这四年的所有事情，包括他曾经想举报你。最后他说："但我没写那封信。" 你和他都笑了。'; } }
  ]},

{ id:'officer_4', w:0, force:true,
  cond:s=>s.chains.officerEnd && s.yos>=14,
  text:'你已经是中校。一次军校的授课邀请，要你给刚入伍的军官讲一节"带兵之道"。你站在讲台上，看着台下那些年轻的脸。',
  fx:{lead:+6,pol:+5,net:+3,morale:+5} },

/* =========================================================
   剧情链条 · 4
   灰色地带链（4 步）
   ========================================================= */
{ id:'gray_1', w:0, force:true,
  cond:s=>s.grade>=5 && s.yos>=7 && !s.chains.gray,
  text:'你在整理营部后勤文件时发现了一些"不对劲"的地方——一批本应报废的装备在账面上被"销毁"，但实际上流入了某个私人渠道。签收人是你一直很尊敬的一位高级军士长。',
  choices:[
    { label:'整理证据，向监察长办公室举报', 
      apply:s=>{ s.chains.gray='reported'; s.pol=clamp(s.pol-5,0,100); s.lead=clamp(s.lead+6,0,100); s.morale=clamp(s.morale-5,0,100); 
        return '你花了三个晚上整理了一份二十页的报告。交上去的那一刻，你知道自己刚刚得罪了一个比你高两级的人。'; } },
    { label:'把文件放回原处，假装没看见', 
      apply:s=>{ s.chains.gray='silent'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale-8,0,100); 
        return '你合上文件夹，放回原处。走出办公室的时候，你告诉自己"这不关我的事"。但那天晚上你失眠了。'; } },
    { label:'私下找他谈一谈，给他一个台阶下', 
      apply:s=>{ s.chains.gray='confronted'; s.net=clamp(s.net+3,0,100); s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-3,0,100); 
        return '你约他喝了杯咖啡，什么都没直说，只是提了一句"最近的账目我有点看不懂"。他看了你三秒，说"我明白了"。之后那些文件再也没出现过。'; } }
  ]},

{ id:'gray_2', w:0, force:true,
  cond:s=>s.chains.gray && !s.chains.grayStage2,
  text:'六个月后，那批装备的去向出现了新的线索。监察长办公室开始了初步调查。',
  choices:[
    { label:'主动配合调查，提供所有记录',
      apply:s=>{ s.chains.grayStage2='cooperate'; s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale-2,0,100);
        return '你把所有相关记录整理成册，主动送到调查组。调查组的人说"你是第一个主动配合的"，但你知道，这句话本身就意味着有其他人没配合。'; } },
    { label:'保持沉默，等待调查结束',
      apply:s=>{ s.chains.grayStage2='silent'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-3,0,100);
        return '你没有主动联系调查组。接下来的三个月，你每天上班时都会看到调查组的车停在门口。'; } }
  ]},

{ id:'gray_3', w:0, force:true,
  cond:s=>s.chains.grayStage2 && !s.chains.grayEnd,
  text:'调查结束。那位高级军士长被降级并强制退役。但调查过程中，有些事情被翻了出来——包括你。',
  choices:[
    { label:'主动向上级说明当年的全部决定',
      apply:s=>{ 
        if(s.chains.gray==='reported'){ s.chains.grayEnd='clean'; addTag('whistleblower'); addTag('clean_hands'); s.lead=clamp(s.lead+6,0,100); s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+6,0,100); s.net=clamp(s.net-3,0,100);
          return '你向指挥官坦白了整个经过。指挥官听完后说："你做的没错。" 但你注意到他眼里的犹豫——不是对你的怀疑，是对这件事本身的疲惫。'; }
        if(s.chains.gray==='confronted'){ addTag('reconciler'); addTag('peacemaker'); s.pol=clamp(s.pol+6,0,100); s.lead=clamp(s.lead+3,0,100); s.net=clamp(s.net+3,0,100);
          return '你说明了当年与他当面对峙的全过程。调查组认定"未构成包庇"。你没有被追责，但这件事让你更清楚了一件事：在军队里，沉默有时也是一种罪。'; }
        addTag('compromised'); s.pol=clamp(s.pol-4,0,100); s.morale=clamp(s.morale-6,0,100);
        return '你向指挥官说明了当年"看不懂账目但没上报"的过程。指挥官听完沉默了很久，最后说："我明白，但记录上会有备注。" 你的档案上从此多了一条："曾知情未报。"';
      } },
    { label:'保持沉默，让调查组自己查',
      apply:s=>{ 
        if(s.chains.gray==='reported'){ addTag('whistleblower'); s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale-2,0,100);
          return '你没有主动联系调查组。六个月后，你收到了三封来自基层士兵的匿名感谢信——他们都曾是那批"报废装备"的受害者。'; }
        addTag('compromised'); s.pol=clamp(s.pol-6,0,100); s.morale=clamp(s.morale-8,0,100); s.net=clamp(s.net-3,0,100);
        return '调查组最终认定了你"知情未报"，虽然不追究法律责任，但档案里留下了一条备注。这条备注会在未来某次晋升审查中被翻出来。'; } }
  ]},

{ id:'gray_4', w:0, force:true,
  cond:s=>s.chains.grayEnd && s.yos>=14,
  text:'多年后，你已经担任了更高的职务。一次偶然的机会，你在军人公墓遇到了那位高级军士长的墓碑。',
  fx:{pol:+4,morale:+4,lead:+3} },

/* =========================================================
   剧情链条 · 5（新）
   准尉传承链（W-1~W-3）
   ========================================================= */
{ id:'wo_1', w:0, force:true,
  cond:s=>s.track==='W' && s.grade>=1 && s.yos>=6 && !s.chains.wo_legacy,
  text:'你成为一名准尉后的第一年。一位服役了三十年的老准尉把你叫到他的工位。"我看过你的技术档案，"他说，"但你要知道，准尉和军官不一样——我们是士兵和军官之间的桥。"',
  choices:[
    { label:'虚心接受，从头学起',
      apply:s=>{ s.chains.wo_legacy='humble'; s.mos=clamp(s.mos+5,0,100); s.lead=clamp(s.lead+2,0,100);
        return '接下来两年，你几乎每个周末都泡在他的工位上。他教你读那些手册里没写的细节，比如"哪种故障你绝对不能自己修"。'; } },
    { label:'自信地表示自己已经准备好了',
      apply:s=>{ s.chains.wo_legacy='proud'; s.mos=clamp(s.mos+2,0,100); s.morale=clamp(s.morale+3,0,100); s.pol=clamp(s.pol-2,0,100);
        return '他看了你一眼，说"好"。但接下来的几个月，你每次遇到问题去找他，他都只是淡淡地说"你自己想想"。你开始明白，他其实是在教你另一件事。'; } }
  ]},

{ id:'wo_2', w:0, force:true,
  cond:s=>s.chains.wo_legacy && !s.chains.woStage2,
  text:'三年后，你已经是 W-2。一场大规模装备事故爆发，整个营的通信系统瘫痪。老准尉在事故现场受了重伤。你是现场技术能力最强的准尉。',
  choices:[
    { label:'冒险用非常规方法抢修',
      apply:s=>{ s.chains.woStage2='risky'; s.mos=clamp(s.mos+6,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale-3,0,100);
        return '你违反了两条技术规程，在四个小时内恢复了系统。事后军械处的报告上写"技术出色，但程序上需要检讨"。'; } },
    { label:'按规程操作，等待备件',
      apply:s=>{ s.chains.woStage2='procedure'; s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol+4,0,100); 
        return '你按规定流程处理，系统在八小时后恢复。老准尉后来醒过来，听说了你的选择，说了一句"你做得对"。'; } },
    { label:'折中：先按规程，同时准备备选方案',
      apply:s=>{ s.chains.woStage2='balanced'; s.mos=clamp(s.mos+5,0,100); s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你用规定流程的同时，提前准备好了备选方案。当备件迟到时，你立刻启用备选方案，两小时内恢复了系统。军械处把这件事写进了案例集。'; } }
  ]},

{ id:'wo_3', w:0, force:true,
  cond:s=>s.chains.woStage2 && !s.chains.woEnd,
  text:'老准尉退役了。退役仪式上，他把一枚磨损的准尉徽章交给你。"这是我这三十年最看重的东西，"他说，"现在它是你的了。"',
  choices:[
    { label:'郑重收下，承诺传承',
      apply:s=>{ s.chains.woEnd='accepted'; addTag('wo_master'); s.mos=clamp(s.mos+5,0,100); s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+8,0,100);
        return '你把那枚徽章挂在工位上。接下来的十年里，你带出了十七名技术骨干，其中三人后来也成为了准尉。'; } },
    { label:'收下，但建议把徽章留给部队',
      apply:s=>{ s.chains.woEnd='shared'; addTag('wo_master'); s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+5,0,100);
        return '你把徽章送进了部队的荣誉室，并附上说明。后来每年新准尉入职时，都会看到那枚徽章和它的故事。'; } }
  ]},

{ id:'wo_4', w:0, force:true,
  cond:s=>s.chains.woEnd && s.grade>=4,
  text:'你已经是一名 W-4 准尉。一名年轻的技术兵找到你，说他遇到了一个"手册里查不到"的故障。',
  fx:{mos:+5,lead:+5,morale:+5} },

/* =========================================================
   剧情链条 · 6（新）
   特种兵之殇链（SOF）
   ========================================================= */
{ id:'sof_1', w:0, force:true,
  cond:s=>s.flags.sof && s.yos>=8 && !s.chains.sof_loss,
  text:'一次境外任务，你所在的小队遭遇伏击。你的观察手——一个二十三岁的中士——为了掩护你而中弹。他倒下的时候，你甚至没来得及喊他的名字。',
  choices:[
    { label:'完成任务后，亲自把他的遗物送回家',
      apply:s=>{ s.chains.sof_loss='personal'; s.morale=clamp(s.morale-15,0,100); s.lead=clamp(s.lead+5,0,100); s.net=clamp(s.net+3,0,100);
        return '你飞了十二个小时去他的家乡，见到了他的母亲和妹妹。你把他的军牌和一枚紫心勋章放在桌上，说不出任何话。他母亲抱着你哭了很久。'; } },
    { label:'完成任务后，按流程上报',
      apply:s=>{ s.chains.sof_loss='procedure'; s.morale=clamp(s.morale-12,0,100); s.pol=clamp(s.pol+4,0,100);
        return '你按流程提交了报告，把抚恤金和遗物交给了相关部门处理。你告诉自己，这更专业。但接下来的三个月，你几乎每晚都会梦到他倒下的那一秒。'; } },
    { label:'就地处理完任务，回到部队再处理遗物',
      apply:s=>{ s.chains.sof_loss='delayed'; s.morale=clamp(s.morale-10,0,100); s.mos=clamp(s.mos+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你先带队完成了任务，然后才处理他的遗物。这种冷静让指挥官满意。但你在回程飞机上一句话没说。'; } }
  ]},

{ id:'sof_2', w:0, force:true,
  cond:s=>s.chains.sof_loss && !s.chains.sofStage2,
  text:'六个月后，你被安排去看心理医生。这不是你自己的要求，是部队的规定——所有经历过战友阵亡的特种兵都要接受评估。',
  choices:[
    { label:'坦诚地向心理医生讲述一切',
      apply:s=>{ s.chains.sofStage2='honest'; s.morale=clamp(s.morale+8,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你花了两个小时讲述了整个任务的全过程，包括那些你一直没说出口的细节。心理医生说："你能说出来，就是好的开始。"'; } },
    { label:'只谈任务，不谈感受',
      apply:s=>{ s.chains.sofStage2='formal'; s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale-4,0,100);
        return '你按流程完成了评估，没有多说一个字。心理医生在报告上写"情绪稳定"。你走出诊室的时候，觉得比进去时更累。'; } },
    { label:'主动要求调岗，暂时离开一线',
      apply:s=>{ s.chains.sofStage2='transfer'; s.morale=clamp(s.morale+4,0,100); s.pol=clamp(s.pol+4,0,100); s.mos=clamp(s.mos+3,0,100);
        return '你被调到后方担任教官。三个月后，你主动申请返回一线。指挥官说："你能回来，说明你挺住了。"'; } }
  ]},

{ id:'sof_3', w:0, force:true,
  cond:s=>s.chains.sofStage2 && !s.chains.sofEnd,
  text:'又过了一年。你被邀请参加一个特别仪式——他的名字将被刻上一面墙，那面墙上全是历次行动中牺牲的特种兵。',
  choices:[
    { label:'亲自参加仪式，公开讲话',
      apply:s=>{ s.chains.sofEnd='speech'; addTag('sof_scar'); s.morale=clamp(s.morale-4,0,100); s.lead=clamp(s.lead+6,0,100); s.net=clamp(s.net+5,0,100);
        return '你在仪式上讲了五分钟。最后你说："我们这行的人从来不说 值得 这个词，因为我们知道，没有任何东西值得一个二十三岁的生命。" 台下所有人都低下了头。'; } },
    { label:'参加仪式，但保持沉默',
      apply:s=>{ s.chains.sofEnd='silent'; addTag('sof_scar'); s.morale=clamp(s.morale-6,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你站在人群里，看着他的名字被刻上墙。仪式结束后，你在墙前站了很久，直到所有人都走光。'; } },
    { label:'申请暂不参加，托人代献花圈',
      apply:s=>{ s.chains.sofEnd='absent'; addTag('sof_scar'); s.morale=clamp(s.morale-8,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你没有去。三个月后，你独自开车去了那面墙，站在他名字前，终于说出了一句"对不起"。'; } }
  ]},

{ id:'sof_4', w:0, force:true,
  cond:s=>s.chains.sofEnd && s.yos>=14,
  text:'多年后，你已经是老兵。一名新通过选拔的年轻特种兵找到你，说他听说过你的名字。',
  fx:{lead:+6,morale:+6,net:+4} },

/* =========================================================
   剧情链条 · 7（新）
   家庭的天平链（通用）
   ========================================================= */
{ id:'family_1', w:0, force:true,
  cond:s=>s.yos>=6 && !s.chains.family && (s.flags.deployed || s.yos>=8),
  text:'你已经服役第六年。你的配偶在电话里说："我们需要谈谈。" 这不是一个好信号。',
  choices:[

    { label:'邀请对方来部队探望',

  ]},

{ id:'family_2', w:0, force:true,

  choices:[

        return '你放弃了晋升机会，申请了紧急调回。你在孩子出生后第九天赶到医院。TA抱着孩子，看着你说："你来了。"'; } },
    { label:'通过视频看孩子，完成任务后再回',

        return '你在营地用卫星电话看了孩子的第一眼。屏幕很小，信号很差，但你记住了那一刻。三个月后你回到家，孩子已经不认得你了。'; } },
    { label:'托父母和战友照顾，自己继续任务',
      apply:s=>{ s.chains.familyStage2='delegate'; s.morale=clamp(s.morale-12,0,100); s.pol=clamp(s.pol+3,0,100); s.net=clamp(s.net+3,0,100);
        return '你请父母搬去帮忙照顾。任务完成你回到家时，孩子已经会笑了，但TA看着你的眼神里多了一种说不清的东西。'; } }
  ]},

{ id:'family_3', w:0, force:true,
  cond:s=>s.chains.familyStage2 && !s.chains.familyEnd,
  text:'孩子三岁了。你回家时TA指着你说："叔叔。" 你的配偶站在旁边，什么都没说。',
  choices:[
    { label:'申请转岗，减少部署',
      apply:s=>{ s.chains.familyEnd='career_change'; addTag('family_first'); s.morale=clamp(s.morale+10,0,100); s.pol=clamp(s.pol-3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你申请了教官岗位，从此很少再出国部署。你的晋升慢了下来，但每天晚上你都能陪孩子吃饭。多年后孩子说："我爸爸是个军人，但他每天都在家。"'; } },
    { label:'继续现在的路线，用行动弥补',
      apply:s=>{ s.chains.familyEnd='persist'; addTag('career_first'); s.pol=clamp(s.pol+5,0,100); s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale-5,0,100);
        return '你没有转岗，但每次回家都会把所有时间留给孩子和配偶。多年后孩子说："我爸爸是个军人，我很骄傲。" 但你心里知道，你错过了太多。'; } },
    { label:'和配偶认真谈一次，共同决定未来',
      apply:s=>{ s.chains.familyEnd='shared'; s.morale=clamp(s.morale+5,0,100); s.pol=clamp(s.pol+2,0,100); s.net=clamp(s.net+2,0,100);
        return '你们坐在客厅里谈了一整晚。最后决定：你再干五年，然后申请转岗。五年后你真的做到了。TA说："你答应的事，你做到了。"'; } }
  ]},

{ id:'family_4', w:0, force:true,
  cond:s=>s.chains.familyEnd && s.yos>=18,
  text:'你退役了。走出军营大门那天，家人开着车来接你。孩子已经上中学了。',
  fx:{morale:+12,lead:+4,pol:+3} },

/* =========================================================
   剧情链条 · 8（新）
   远方的人链（部署后触发）
   ========================================================= */
{ id:'local_1', w:0, force:true,
  cond:s=>s.flags.deployed && s.yos>=4 && !s.chains.local && (s.mosCode==='68W' || s.mosCode==='92Y' || s.mosCode==='35F'),
  text:'部署期间，你在一次巡逻中遇到一户当地人家。一位老人的房子被极端组织烧了，他的孙女在门口哭。部队的规定是"不介入平民事务"。',

    { label:'按规程上报，让相关部门处理',

        return '你按规定上报了这件事。一周后，人道主义组织派人处理了。你从旁看到了结果，觉得这种方式更"专业"。'; } },
    { label:'组织小队私下送一些物资',
      apply:s=>{ s.chains.local='supply'; s.morale=clamp(s.morale+5,0,100); s.net=clamp(s.net+4,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你和几个弟兄凑了一些口粮和毯子，趁夜送了过去。没有人知道这件事——至少你和弟兄们是这么以为的。'; } }
  ]},

{ id:'local_2', w:0, force:true,
  cond:s=>s.chains.local && !s.chains.localStage2,
  text:'两年后，你被调回国内。一天，你收到了一封用英文写的信，笔迹稚嫩，语法错误很多。',
  choices:[
    { label:'认真读完，尝试回信',

        return '信是那个小女孩写的。她说她的爷爷两年前去世了，但临终前一直念叨"那个美国兵"。你回信告诉她："你爷爷是个勇敢的人。"'; } },
    { label:'把信归档，没有回',
