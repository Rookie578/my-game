        return '你把信放进档案柜。你告诉自己，那只是工作的一部分。但每次整理文件看到它，你都会停一下。'; } },
    { label:'联系人道组织，了解那家人的近况',
      apply:s=>{ s.chains.localStage2='contact'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+5,0,100);
        return '你通过人道组织打听到了消息：那家人已经搬到邻国，孩子上了学。你把孩子的来信扫描了一份发给他们，附了一笔捐款。'; } }
  ]},

{ id:'local_3', w:0, force:true,
  cond:s=>s.chains.localStage2 && !s.chains.localEnd,
  text:'又过了几年，你在一次国际军事会议上遇到了当年那个小女孩——她已经长大了，成为了一名翻译和人权工作者。',
  choices:[
    { label:'主动上前打招呼',

        return '她一眼认出了你。她说："你当年做的事情，改变了我们一家人的命运。" 那一刻你意识到，有时候一个微小的选择，能改变一个人的一生。'; } },
    { label:'保持距离，公事公办',
      apply:s=>{ s.chains.localEnd='distant'; s.pol=clamp(s.pol+4,0,100);
        return '你在会议桌上点头致意，没有多说。散会时她走过来，递给你一张纸条，上面写着一句话："谢谢你那年没有转身走开。"'; } }
  ]},

{ id:'local_4', w:0, force:true,
  cond:s=>s.chains.localEnd && s.yos>=15,
  text:'你退役后，在一所大学做了一次演讲。台下有个学生举手问你："军人能改变战争之外的事情吗？"',
  fx:{pol:+5,morale:+8,lead:+4} }

,

/* =========================================================
   剧情链条 · 9（新）
   政治站队链（O-4+）
   ========================================================= */
{ id:'politics_1', w:0, force:true,
  cond:s=>s.track==='O' && s.grade>=4 && s.yos>=14 && !s.chains.politics,
  text:'旅部里两位上校正在竞争下一任旅长——一位是战功赫赫的作战派，一位是长袖善舞的参谋派。两个人分别找你谈话，都想让你在关键时刻"站对边"。',
  choices:[
    { label:'站作战派，跟着能打仗的人走',
      apply:s=>{ s.chains.politics='warrior'; s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol-3,0,100); s.morale=clamp(s.morale+2,0,100);
        return '作战派的上校拍了拍你的肩膀："跟着我，不会让你吃亏。" 但你也知道，参谋派的人从此记住了你的名字。'; } },
    { label:'站参谋派，跟着能运作的人走',
      apply:s=>{ s.chains.politics='staff'; s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+4,0,100); s.lead=clamp(s.lead-1,0,100);
        return '参谋派的上校请你喝了杯茶，聊了两个小时旅里的"人事格局"。你学到了很多，但也知道你在战斗部队里的名声会受到一些影响。'; } },
    { label:'两边都不站，只谈专业',
      apply:s=>{ s.chains.politics='neutral'; s.pol=clamp(s.pol+2,0,100); s.lead=clamp(s.lead+3,0,100); s.net=clamp(s.net+2,0,100);
        return '你在两次谈话里都只谈训练和战备。两位上校都不太满意，但都尊重你的态度。你成了旅里少有的"不属于任何派系"的人。'; } }
  ]},

{ id:'politics_2', w:0, force:true,
  cond:s=>s.chains.politics && !s.chains.politicsStage2,
  text:'一年后，旅长人选公布。你当初选择的那一方——无论哪一方——现在都在旅里掌权。新旅长开始调整人事布局。',
  choices:[
    { label:'主动向新旅长表忠心',
      apply:s=>{ s.chains.politicsStage2='loyal';
        if(s.chains.politics==='warrior'){ s.lead=clamp(s.lead+5,0,100); s.pol=clamp(s.pol+3,0,100); 
          return '新旅长把你调到了作战科，从此你开始接触旅一级的作战规划。'; }
        if(s.chains.politics==='staff'){ s.pol=clamp(s.pol+6,0,100); s.net=clamp(s.net+4,0,100); 
          return '新旅长把你安排进了人事处，你开始掌握旅里晋升的第一手信息。'; }
        s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你以"中立派"身份被新旅长留用。他私下说："你这种人，我需要。"'; } },
    { label:'保持低调，继续做自己的事',
      apply:s=>{ s.chains.politicsStage2='quiet'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+2,0,100);
        return '你没有主动表忠心，也没有刻意疏远。新旅长起初对你有些冷，但半年后有一次实战演习让你重新证明了自己。'; } },
    { label:'申请调离原单位，避开风头',
      apply:s=>{ s.chains.politicsStage2='transfer'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-3,0,100); s.net=clamp(s.net-2,0,100);
        return '你申请调去了另一个旅。走之前新旅长对你说："你是聪明人，但聪明人有时候会错过机会。"'; } }
  ]},

{ id:'politics_3', w:0, force:true,
  cond:s=>s.chains.politicsStage2 && !s.chains.politicsEnd,
  text:'又过了两年。当年那位没能上位的一方，如今重新崛起，调到更高的职位。你的档案再次被翻出来。',
  choices:[
    { label:'主动联系对方，重建关系',
      apply:s=>{ s.chains.politicsEnd='rebuild'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+5,0,100);
        return '你主动给对方写了一封信，坦诚当年自己的选择。对方回信只有一句："我理解，但我不会忘记。" 但你知道，这封信本身就是一种和解。'; } },
    { label:'保持距离，站定原来的队',
      apply:s=>{ s.chains.politicsEnd='stand';
        if(s.chains.politics==='warrior'){ s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+3,0,100); 
          return '你没有动摇。新晋的高层对你有些不满，但你的作战部队立场从来没有让人怀疑过。'; }
        if(s.chains.politics==='staff'){ s.pol=clamp(s.pol+6,0,100); 
          return '你继续在你的人事岗位上服务，你的政治资本一点一点累积。'; }
        s.pol=clamp(s.pol+3,0,100);
        return '你继续保持中立，两边都不讨好，也两边都不欠。'; } },
    { label:'主动申请去更高级别的军校深造',
      apply:s=>{ s.chains.politicsEnd='school'; s.mos=clamp(s.mos+4,0,100); s.pol=clamp(s.pol+4,0,100); s.net=clamp(s.net+3,0,100);
        return '你用深造的名义离开了这个是非之地。两年后你带着新的学历和人脉回来，旅里已经换了一任旅长。'; } }
  ]},

{ id:'politics_4', w:0, force:true,
  cond:s=>s.chains.politicsEnd && s.yos>=20,
  text:'多年后你回望这段经历，发现自己已经成为了别人眼中的"老资格"。有年轻军官找你聊职业规划，问你怎么在政治的漩涡里生存。',
  fx:{pol:+6,lead:+4,net:+3,morale:+4} },

  text:'一次实弹训练中发生了严重的走火事故。一名十九岁的士兵当场死亡，另有两名重伤。你是现场最高负责人。',

{ id:'casualty_2', w:0, force:true,

    { label:'通过律师陈述，保持专业距离',

        return '你的律师替你完成了所有陈述。这种方式保护了你的法律权益，但听证会结束后家属冷冷地看了你一眼。'; } },

{ id:'casualty_4', w:0, force:true,
  cond:s=>s.chains.casualtyEnd && s.yos>=16,
  text:'多年后，死者父母给你寄来了一封信。他们说他们原谅你了，并邀请你去参加他们孙子的洗礼。',
  fx:{morale:+12,lead:+4,pol:+3,net:+3} },

/* =========================================================
   剧情链条 · 11（新）
   军校深造链（E-5+ / O-2+）
   ========================================================= */
{ id:'school_1', w:0, force:true,
  cond:s=>(s.track==='E'&&s.grade>=5)||(s.track==='O'&&s.grade>=2) && s.yos>=5 && !s.chains.school,
  text:'你被选中去军校/进修学校深造。这是晋升的重要跳板，但同期学员里有一个格外难缠的对手——他出身军人世家，认识所有教官。',
  choices:[
    { label:'低调做事，用成绩说话',
      apply:s=>{ s.chains.school='quiet'; s.mos=clamp(s.mos+4,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你埋头学习，从不参与同学之间的小圈子。对手起初嘲笑你"不合群"，但每次考核你的名字都在他前面。'; } },
    { label:'主动和对手交朋友',
      apply:s=>{ s.chains.school='befriend'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你主动找对手喝了杯咖啡，聊了各自的来历。他后来成了你职业上的盟友——虽然你们至今没有成为真正的朋友。'; } },
    { label:'正面竞争，公开挑战他',
      apply:s=>{ s.chains.school='compete'; s.lead=clamp(s.lead+4,0,100); s.pt=clamp(s.pt+3,0,100); s.net=clamp(s.net-2,0,100);
        return '你在开学第一周就在课堂上公开质疑了他的一个战术方案。教官没有表态，但全班都知道你和他从此不再是"同学"。'; } }
  ]},

{ id:'school_2', w:0, force:true,
  cond:s=>s.chains.school && !s.chains.schoolStage2,
  text:'毕业前的关键考核：一次为期五天的野外战术演习。你和对手被分到了对立的两支小队。',
  choices:[
    { label:'用非常规战术，出奇制胜',
      apply:s=>{ s.chains.schoolStage2='unconventional'; s.lead=clamp(s.lead+5,0,100); s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你在演习第三天做了一次教科书里没有的夜间穿插，直接把对手的指挥部端了。教官在总结会上说："这条教科书要改。"'; } },
    { label:'按教科书打法，稳扎稳打',
      apply:s=>{ s.chains.schoolStage2='textbook'; s.mos=clamp(s.mos+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你按最稳妥的方案推进，最后以微弱优势取胜。教官说："你赢得不够漂亮，但你赢得很专业。"'; } },
    { label:'在演习中主动保护对手小队的一个伤员',
      apply:s=>{ s.chains.schoolStage2='chivalry'; s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale+5,0,100); s.net=clamp(s.net+5,0,100);
        return '演习中出现真实伤员时，你暂停了进攻，派人协助救援。对手最后输了，但他主动过来跟你握手。教官说："你今天展示的，比赢一场演习更重要。"'; } }
  ]},

{ id:'school_3', w:0, force:true,
  cond:s=>s.chains.schoolStage2 && !s.chains.schoolEnd,
  text:'毕业分配。学校给了你三个选择：回原单位、去一线作战部队、去总部机关。',
  choices:[
    { label:'回原单位，继续跟着老领导',
      apply:s=>{ s.chains.schoolEnd='return'; s.net=clamp(s.net+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你回到了原来的部队。老领导说："我没看错你。" 你的晋升路径平稳，但也少了一些跳跃。'; } },
    { label:'去一线作战部队，从零开始',
      apply:s=>{ s.chains.schoolEnd='frontline'; s.lead=clamp(s.lead+5,0,100); s.pt=clamp(s.pt+3,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你去了一支刚组建的作战部队。这里没有人认识你，所有人都从零开始。你用了两年时间重新证明了自己。'; } },
    { label:'去总部机关，走政治路线',
      apply:s=>{ s.chains.schoolEnd='staff'; s.pol=clamp(s.pol+6,0,100); s.net=clamp(s.net+5,0,100);
        return '你被分配到了总部的一个关键处室。你开始接触真正的军事政治——那些不在教科书里的东西。'; } }
  ]},

{ id:'school_4', w:0, force:true,
  cond:s=>s.chains.schoolEnd && s.yos>=15,
  text:'多年后，你受邀回母校演讲。台下坐着当年那个难缠的对手——他现在是你的学生。',
  fx:{pol:+5,lead:+5,mos:+3,morale:+6} },

/* =========================================================
   剧情链条 · 12（新）
   战后创伤链（服役 10 年+）
   ========================================================= */
{ id:'ptsd_1', w:0, force:true,
  cond:s=>s.yos>=10 && (s.flags.deployed || s.flags.sof) && !s.chains.ptsd,
  text:'你开始做噩梦。每周两三次，醒来时满头大汗。梦里总是同样的场景——那些你没能救回来的人。你开始害怕睡觉。',
  choices:[
    { label:'向军医报告，申请心理评估',
      apply:s=>{ s.chains.ptsd='seek'; s.morale=clamp(s.morale+5,0,100); s.pol=clamp(s.pol-3,0,100);
        return '军医给你做了初步评估，建议你定期接受心理咨询。你知道这件事会进档案，但你也知道，不说出来你撑不了多久。'; } },
    { label:'自己扛着，不告诉任何人',
      apply:s=>{ s.chains.ptsd='hide'; s.morale=clamp(s.morale-8,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你告诉自己"军人不该有这种问题"。你开始用酒精和更多的工作来麻痹自己。表面上，你看起来比以前更"坚强"。'; } },
    { label:'找一个信任的老兵聊一聊',
      apply:s=>{ s.chains.ptsd='buddy'; s.morale=clamp(s.morale+3,0,100); s.net=clamp(s.net+3,0,100);
        return '你找到了一个同样经历过那些事的老兵，两个人在军营外的小酒馆里聊了一整晚。他说的每一句话你都懂，因为你也经历过。'; } }
  ]},

{ id:'ptsd_2', w:0, force:true,
  cond:s=>s.chains.ptsd && !s.chains.ptsdStage2,
  text:'一次日常训练中，你突然失控了。一个新兵在你的怒吼下崩溃大哭，周围的士兵都用异样的眼神看着你。',
  choices:[
    { label:'当场向新兵道歉，向全排承认自己的问题',
      apply:s=>{ s.chains.ptsdStage2='admit'; s.morale=clamp(s.morale+8,0,100); s.lead=clamp(s.lead+4,0,100); s.net=clamp(s.net+3,0,100);
        return '你在全排面前承认自己"最近状态不好"，然后正式申请了心理治疗。新兵后来成为你最信任的部下之一。'; } },
    { label:'继续装作什么都没发生',
      apply:s=>{ s.chains.ptsdStage2='deny'; s.morale=clamp(s.morale-10,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你把这件事压了下去，用"训练压力大"作为借口。表面上没人再提，但你知道，这只是开始。'; } },
    { label:'主动申请转岗，暂时离开一线',
      apply:s=>{ s.chains.ptsdStage2='transfer'; s.morale=clamp(s.morale+5,0,100); s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你申请调去了训练中心，从一线退下来。这个选择让你松了一口气，但也让你开始怀疑自己"是不是已经不行了"。'; } }
  ]},

{ id:'ptsd_3', w:0, force:true,
  cond:s=>s.chains.ptsdStage2 && !s.chains.ptsdEnd,
  text:'两年过去了。你的状态有所好转，但那些记忆永远不会消失。一次部队组织的纪念活动上，你被邀请分享自己的经历。',
  choices:[
    { label:'公开分享自己的PTSD历程',
      apply:s=>{ s.chains.ptsdEnd='share'; s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+8,0,100); s.net=clamp(s.net+5,0,100);
        return '你站在全旅面前，讲了整整四十分钟。讲完之后，有二十多个士兵私下找你，说自己也有类似的困扰。你成了部队里第一个公开谈论这个话题的人。'; } },
    { label:'分享但不提自己的经历',
      apply:s=>{ s.chains.ptsdEnd='partial'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你以"心理韧性"为主题做了一次分享，但没有透露自己的故事。这样既帮到了别人，也没有让自己暴露太多。'; } },
    { label:'婉拒分享，让专业心理医生来讲',
      apply:s=>{ s.chains.ptsdEnd='decline'; s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+2,0,100);
        return '你推荐了部队的心理医生来做这场分享。你说"专业的事，应该让专业的人做"。'; } }
  ]},

{ id:'ptsd_4', w:0, force:true,
  cond:s=>s.chains.ptsdEnd && s.yos>=18,
  text:'多年后，你已经学会了和那些记忆共处。一次退役军人聚会上，一位年轻的老兵找到你，说他"快撑不下去了"。',
  fx:{lead:+6,morale:+8,net:+5,pol:+3} },

/* =========================================================
   剧情链条 · 13（新）
   老兵转型链（退役前 3 年）
   ========================================================= */
{ id:'transition_1', w:0, force:true,
  cond:s=>s.yos>=15 && !s.chains.transition && s.grade>=5,
  text:'你开始考虑退役后的生活。军队不会永远是你的家。你收到了一家国防承包商和一所大学的邀请，还有一个选项是继续留队到最高服役年限。',
  choices:[
    { label:'接受国防承包商的offer',
      apply:s=>{ s.chains.transition='contractor'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+3,0,100);
        return '承包商给的薪水是军队的三倍，但你也知道，从此你要为利润而不是为使命工作。'; } },
    { label:'接受大学教职，去教书',
      apply:s=>{ s.chains.transition='academic'; s.mos=clamp(s.mos+4,0,100); s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+6,0,100);
        return '大学请你去做军事科学客座教授。你想了想，觉得这份工作能让你把二十年的经验传给下一代。'; } },
    { label:'留在部队，继续干到最高年限',
      apply:s=>{ s.chains.transition='stay'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+2,0,100);
        return '你把那两份offer收进抽屉，对领导说"我还想再干几年"。领导拍了拍你的肩，说"军队需要你这样的人"。'; } }
  ]},

{ id:'transition_2', w:0, force:true,
  cond:s=>s.chains.transition && !s.chains.transitionStage2,
  text:'一年后，你参加了一个退伍军人职业转型研讨会。坐在你旁边的是一位刚退役三年的前军士长，他现在是一家物流公司的区域经理。',
  choices:[
    { label:'深入请教他的转型经验',
      apply:s=>{ s.chains.transitionStage2='learn'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他给你讲了很多书本上没有的东西——面试时怎么讲军队经历、怎么和年轻同事相处、怎么处理"突然没人听你命令"的落差。'; } },
    { label:'只是礼貌地听，心里有自己打算',
      apply:s=>{ s.chains.transitionStage2='polite'; s.pol=clamp(s.pol+2,0,100);
        return '你礼貌地听完，心里其实已经做了决定。有些路，别人走过不代表你也要走。'; } },
    { label:'主动分享自己的困惑',
      apply:s=>{ s.chains.transitionStage2='share'; s.morale=clamp(s.morale+4,0,100); s.net=clamp(s.net+4,0,100);
        return '你坦白说自己最怕的是"失去身份"——二十年的军人标签，脱下军装之后自己是谁？他笑了笑说："这个问题，每个老兵都要问自己一遍。"'; } }
  ]},

{ id:'transition_3', w:0, force:true,
  cond:s=>s.chains.transitionStage2 && !s.chains.transitionEnd,
  text:'退役仪式那天。你穿上礼服，戴上所有勋章。全连列队，你的名字被念出来，军旗在你面前缓缓落下。',
  choices:[
    { label:'在退役演讲里感谢每一个带过的兵',
      apply:s=>{ s.chains.transitionEnd='grateful'; s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+10,0,100); s.net=clamp(s.net+4,0,100);
        return '你讲了二十分钟，念了至少三十个人的名字。台下有人哭了，你也差点没绷住。'; } },
    { label:'简短致谢，把时间留给仪式本身',
      apply:s=>{ s.chains.transitionEnd='simple'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+6,0,100);
        return '你只说了三分钟，但每一句都很有分量。军旗落下的时候，你敬了最后一个军礼。'; } },
    { label:'单独和几个老弟兄喝一顿酒',
      apply:s=>{ s.chains.transitionEnd='brothers'; s.net=clamp(s.net+5,0,100); s.morale=clamp(s.morale+8,0,100);
        return '仪式结束后，你和几个从入伍就认识的老弟兄找了个小酒馆，从下午喝到深夜，聊的都是年轻时候的事。'; } }
  ]},

{ id:'transition_4', w:0, force:true,
  cond:s=>s.chains.transitionEnd && s.over,
  text:'退役后的第一年。',
  fx:{morale:+5,pol:+4,net:+3} },

/* =========================================================
   剧情链条 · 14（新）
   军事法庭链（任何阶段）
   ========================================================= */
{ id:'court_1', w:0, force:true,
  cond:s=>s.yos>=6 && !s.chains.court && Math.random()<0.15,
  text:'你被指控"在任务中违反交战规则"。指控来源不明，可能是真的，也可能是有人要搞你。军事法庭已经立案。',
  choices:[
    { label:'聘请最优秀的军事律师',
      apply:s=>{ s.chains.court='lawyer'; s.pol=clamp(s.pol+2,0,100); s.net=clamp(s.net+3,0,100); s.morale=clamp(s.morale-8,0,100);
        return '你的律师是一个打过上百场军事法庭官司的老兵。他看了案卷之后说："这个案子有蹊跷，指控你的人肯定熟悉程序。"'; } },
    { label:'相信部队会还你清白，自己辩护',
      apply:s=>{ s.chains.court='self'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale-5,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你决定自己辩护。你花了三个月研究军事司法程序，把案件材料背得滚瓜烂熟。'; } },
    { label:'主动要求测谎，公开自证',
      apply:s=>{ s.chains.court='polygraph'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale-6,0,100); s.net=clamp(s.net+2,0,100);
        return '你主动申请了测谎，结果通过了。律师说"这是把双刃剑——测谎在军事法庭上不能作为证据，但公众舆论会站在你这边"。'; } }
  ]},

{ id:'court_2', w:0, force:true,
  cond:s=>s.chains.court && !s.chains.courtStage2,
  text:'庭审开始。检方拿出了一段模糊的战场录像，试图证明你当时下达了"过度使用武力"的命令。',
  choices:[
    { label:'当庭指出录像的时间和地点与案件不符',
      apply:s=>{ s.chains.courtStage2='evidence'; s.mos=clamp(s.mos+4,0,100); s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你在法庭上演示了录像中的地形与你当时所在位置的差异。检方的关键证据当庭失效。'; } },
    { label:'传唤当时的战友作证',
      apply:s=>{ s.chains.courtStage2='witness'; s.net=clamp(s.net+4,0,100); s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你的老班长、你的副手、你的卫生员——三个战友在法庭上为你作证。他们的证词相互印证，检方的指控开始动摇。'; } },
    { label:'保持沉默，让律师全权处理',
      apply:s=>{ s.chains.courtStage2='silent'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-4,0,100);
        return '你一句话没说，把全部交给律师。庭审结束后律师说："你今天的沉默是对的，但也是错的。"'; } }
  ]},

{ id:'court_3', w:0, force:true,
  cond:s=>s.chains.courtStage2 && !s.chains.courtEnd,
  text:'判决日。法庭认定你"指控不成立"，但你也被指出"程序上存在瑕疵"。这个结果让双方都不满意。',
  choices:[
    { label:'接受判决，低调回到岗位',
      apply:s=>{ s.chains.courtEnd='accept'; s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你回到部队，什么都没说。接下来的几个月，你用行动证明了自己，没有人再提这件事。'; } },
    { label:'向上级申诉，要求彻底恢复名誉',
      apply:s=>{ s.chains.courtEnd='appeal'; s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+3,0,100); s.morale=clamp(s.morale-3,0,100);
        return '你花了两年时间申诉。最终，你的档案被彻底澄清。但这两年你错过了两次晋升机会。'; } },
    { label:'主动申请调离，离开这个是非之地',
      apply:s=>{ s.chains.courtEnd='transfer'; s.morale=clamp(s.morale+5,0,100); s.net=clamp(s.net-2,0,100);
        return '你申请调去另一个基地。走之前，你把所有案卷交给了一个信任的老兵保管。'; } }
  ]},

{ id:'court_4', w:0, force:true,
  cond:s=>s.chains.courtEnd && s.yos>=14,
  text:'多年后，你在一个偶然的场合知道了当年指控你的是谁——一个被你否决过晋升的旧部。',
  fx:{pol:+5,lead:+4,morale:+3} },

/* =========================================================
   交织事件 · 1
   战友 × 恩师
   ========================================================= */
{ id:'cross_buddy_mentor', w:0, force:true,
  cond:s=>s.chains.buddy && s.chains.mentor && !s.chains.crossBM,
  text:'一级军士长找你聊了一次。他说他听说过你照顾那个负伤战友的事。"这个军队需要你这样的人，"他说，"但我也要告诉你——带兵不只是热血。你需要学的是在热血和冷静之间找到平衡。"',
  choices:[
    { label:'接受他的指导，重新学习"冷静"',
      apply:s=>{ s.chains.crossBM='accept'; s.lead=clamp(s.lead+5,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你在他身边又学了两年。你终于明白，他说的"冷静"不是冷漠，而是知道什么时候该行动、什么时候该等待。'; } },
    { label:'坚持自己的方式，热血没错',
      apply:s=>{ s.chains.crossBM='persist'; s.lead=clamp(s.lead+2,0,100); s.morale=clamp(s.morale+4,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你说"我做不到对士兵冷漠"。他没有反驳，只是说"那你会走得更辛苦"。'; } }
  ]},

/* =========================================================
   交织事件 · 2
   灰色地带 × 军官
   ========================================================= */
{ id:'cross_gray_officer', w:0, force:true,
  cond:s=>s.chains.gray && s.chains.officer_trial && !s.chains.crossGO,
  text:'你正在处理一名士兵的违纪问题时，突然想起了自己当年在灰色账目事件里做的选择。那个选择塑造了今天的你——你会不会用同样的标准对待这名士兵？',
  choices:[
    { label:'用当年自己坚持的原则来处理',
      apply:s=>{ s.chains.crossGO='consistent'; s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你对士兵说："我当年做过一个决定，让我到今天都不后悔。今天我要对你做同样的决定。" 士兵看着你的眼睛，第一次没有低头。'; } },
    { label:'用更宽容的方式处理，因为理解',
      apply:s=>{ s.chains.crossGO='lenient'; s.net=clamp(s.net+4,0,100); s.morale=clamp(s.morale+2,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你想起了自己当年"沉默"时的心情，于是给了士兵一次机会。他感激地点头，但你也知道，这不是最后一次。'; } }
  ]},

/* =========================================================
   交织事件 · 3
   家庭 × SOF
   ========================================================= */
{ id:'cross_family_sof', w:0, force:true,
  cond:s=>s.flags.sof && s.chains.familyStage2 && !s.chains.crossFS,
  text:'你刚完成一次高风险任务，回到家。孩子扑上来抱着你的腿，配偶站在门口，脸上没有笑容。"我们需要谈谈，"TA说，"这次不一样了。"',
  choices:[
    { label:'申请调离一线，减少部署',
      apply:s=>{ s.chains.crossFS='adjust'; s.morale=clamp(s.morale+8,0,100); s.pol=clamp(s.pol-3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你第一次主动向单位提出减少部署。指挥官看着你说："你是我最好的兵之一，但我理解。" 你从一线退到了训练部门。'; } },
    { label:'承诺这是最后一次，然后继续',
      apply:s=>{ s.chains.crossFS='promise'; s.morale=clamp(s.morale-6,0,100); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你说了"最后一次"，但你自己也知道，这句话你已经说过好几次了。这次任务之后，你申请了一次长假。'; } },
    { label:'带TA参加一次部队的家庭日活动',
      apply:s=>{ s.chains.crossFS='share'; s.morale=clamp(s.morale+5,0,100); s.net=clamp(s.net+4,0,100); s.lead=clamp(s.lead+2,0,100);
        return 'TA第一次看到你穿军装、看到你的战友、看到你在训练场上的样子。活动结束后TA说："我明白了，但我还是不放心。"'; } }
  ]},

/* =========================================================
   交织事件 · 4
   准尉 × 军官
   ========================================================= */
{ id:'cross_wo_officer', w:0, force:true,
  cond:s=>s.chains.woEnd && s.track==='O' && !s.chains.crossWO,
  text:'你从准尉转成了军官——这是军队里少见的路。第一次以军官身份开会时，一位资深少校当众说："准尉出身的军官，终究少了一些格局。"',
  choices:[
    { label:'用专业能力回应他的质疑',
      apply:s=>{ s.chains.crossWO='professional'; s.mos=clamp(s.mos+5,0,100); s.lead=clamp(s.lead+3,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你在接下来的三个月里用三次精准的技术判断证明了自己。那位少校后来在一次会议上当众向你道歉。'; } },
    { label:'主动向资深军官请教，补足短板',
      apply:s=>{ s.chains.crossWO='learn'; s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+5,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你主动找那位少校喝了杯咖啡，说"我需要学的东西很多，请你多指教"。他愣了一下，然后笑了："你比我想的有意思。"'; } },
    { label:'联合其他准尉出身的军官，形成同盟',
      apply:s=>{ s.chains.crossWO='alliance'; s.net=clamp(s.net+6,0,100); s.pol=clamp(s.pol+5,0,100); s.morale=clamp(s.morale+4,0,100);
        return '你找到了另外三位准尉出身的军官，定期交流彼此的经验。你们成了一个非正式的小圈子——有人叫你们"准尉帮"。'; } }
  ]}

,

/* =========================================================
   隐藏结局
   ========================================================= */
{ id:'hidden_buddy_end', w:0, force:true,
  cond:s=>s.chains.buddyEnd==='responded' && hasTag('battle_bond') && s.lead>=85 && s.net>=75 && !s.chains.hiddenBuddy,
  text:'多年后的一天，你收到了一封信。信上的地址是战友老家的那座小城。信里夹着一张褪色的照片——照片上是年轻的你们，穿着作训服，站在一辆坦克前面笑。照片背面写着一行字："我们那时候太年轻了。但我很高兴，那时我们在一起。"',
  fx:{morale:+15,lead:+5,net:+5,pol:+3}, flag:'hidden_buddy_unlocked',
  choices:[
    { label:'珍藏这张照片',
      apply:s=>{ s.chains.hiddenBuddy='kept'; return '你把照片放进上衣口袋，贴着胸口的位置。这张照片你带了一辈子。'; } },
    { label:'把照片捐给部队的军史馆',
      apply:s=>{ s.chains.hiddenBuddy='museum'; s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+5,0,100); return '你把照片捐给了部队的军史馆。多年后，每一个新兵入伍都会看到这张照片和它背后的故事。'; } }
  ]},

{ id:'hidden_mentor_end', w:0, force:true,
  cond:s=>s.chains.mentorEnd && hasTag('mentor_legacy') && s.lead>=88 && s.grade>=7 && !s.chains.hiddenMentor,
  text:'你被任命为新的连队一级军士长。授衔仪式上，你的名字被念出来，全连起立。你站在台上，忽然想起了当年那个在办公室里递给你咖啡的老军士长。你走上讲台，第一句话是："我有一位老师，他教会了我怎么带兵。"',
  fx:{lead:+8,morale:+12,net:+6,pol:+4}, flag:'hidden_mentor_unlocked',
  choices:[
    { label:'把老军士长的笔记本正式捐给连队',
      apply:s=>{ s.chains.hiddenMentor='donate'; s.net=clamp(s.net+5,0,100); s.lead=clamp(s.lead+3,0,100); return '你把那本笔记本正式捐给了连队，作为新兵入连的第一课。那本笔记至今还在连队荣誉室里。'; } },
    { label:'在第一次全连大会上念出笔记本里的一段话',
      apply:s=>{ s.chains.hiddenMentor='recite'; s.morale=clamp(s.morale+8,0,100); s.lead=clamp(s.lead+4,0,100); return '你念了那句"带兵先带心，命令管一时，人心管一世"。台下很安静，然后一位老士官带头鼓起了掌。'; } }
  ]},

{ id:'hidden_family_end', w:0, force:true,
  cond:s=>s.chains.familyEnd==='career_change' && hasTag('family_first') && s.morale>=70 && s.over,
  text:'你退役那天，孩子已经上大学了。TA在毕业典礼上作为学生代表发言，最后说："我爸爸是个军人，但他从没错过我成长里的任何一件事。我想，这就是他对家庭最深的忠诚。"',
  flag:'hidden_family_unlocked',
  choices:[
    { label:'走下台去抱住孩子',
      apply:s=>{ s.chains.hiddenFamily='hug'; s.morale=clamp(s.morale+15,0,100); return '你在全场人面前走过去抱住了孩子。这么多年，这是你第一次在孩子面前哭。'; } },
    { label:'坐在台下，默默擦眼泪',
      apply:s=>{ s.chains.hiddenFamily='tears'; s.morale=clamp(s.morale+12,0,100); return '你坐在台下，看着孩子，想起了所有那些你没在的日子——但今天，你在。'; } }
  ]},

{ id:'hidden_local_end', w:0, force:true,
  cond:s=>s.chains.localEnd==='reunion' && hasTag('local_friend') && s.pol>=80 && s.net>=75 && !s.chains.hiddenLocal,
  text:'多年后，一封来自海外的官方邀请函送到了你手上。那位当年的小女孩如今已经是所在国的人权事务官员。她在信里说："我想请你在我们国家的人权论坛上发言——不是作为一个军人，而是作为一个曾经改变了我的命运的人。"',
  fx:{pol:+8,net:+8,morale:+10}, flag:'hidden_local_unlocked',
  choices:[
    { label:'接受邀请，去发言',
      apply:s=>{ s.chains.hiddenLocal='accept'; s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+5,0,100); s.morale=clamp(s.morale+8,0,100); return '你在论坛上讲了那个下午你做出的选择。台下有人哭了。一个记者后来写道："战争会结束，但一个士兵的善意会活得更久。"'; } },
    { label:'婉拒邀请，但写一封长信',
      apply:s=>{ s.chains.hiddenLocal='letter'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+6,0,100); return '你婉拒了论坛发言，但写了一封很长的信。信里说："有些记忆不需要公开，只需要有人记得。" 她把信收藏了起来。'; } }
  ]},

{ id:'cons_gray_oldcrew', w:6, cat:'consequence',

  text:'被你举报的那位高级军士长的旧部开始找你麻烦。你的装备在例行检查时"恰好"出现故障，一份匿名举报材料出现在监察长办公室的信箱里。',

{ id:'cons_gray_clean_reputation', w:7, cat:'consequence',

{ id:'cons_gray_whitewash', w:6, cat:'consequence',

{ id:'cons_sof_new_ask', w:6, cat:'consequence',
  cond:s=>s.chains.sofEnd && s.grade>=6 && !s.flags.sof_new_asked,
  text:'一名刚从选拔营出来的新队员找到你。他说："长官，我想知道……你最好的队友是怎么死的？" 你看着他的眼睛，忽然不知道该怎么回答。',

        return '你讲了四十分钟。讲完后他说："我明白了，长官。" 他没有再问什么，但你知道，他会记住这个故事一辈子。'; } },
    { label:'说"等你活到我这把年纪再问"',

        return '新队员愣了一下，然后敬礼走了。你看着他走远的背影，忽然觉得自己已经老了。'; } },
    { label:'转移话题，去喝一杯',

{ id:'cons_ptsd_helped', w:6, cat:'consequence',

{ id:'cons_transition_academic', w:6, cat:'consequence',

{ id:'cons_transition_stay', w:6, cat:'consequence',

{ id:'cons_family_grown_child', w:6, cat:'consequence',

        return '你礼貌但坚定地拒绝了。少校气得脸都红了，但几个月后他的方案果然出了问题。从那以后，他每次见你都绕路走。'; } },
    { label:'执行，但书面保留意见',
      apply:s=>{ s.pol=clamp(s.pol+5,0,100); s.mos=clamp(s.mos+3,0,100);
        return '你按命令执行，但同时提交了一份书面技术意见。这份文件后来在追责时救了整个技术团队。'; } },
    { label:'找上级准尉协调',
      apply:s=>{ s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100); s.mos=clamp(s.mos+2,0,100);
        return '一位 W-4 出面和少校谈了一次。方案被修改，少校也没丢面子。这就是准尉序列的运作方式——不在明面上，但很重要。'; } }
  ]},

{ id:'ws_wartime_call', w:10, cat:'world',

  fx:{pt:3,mos:2,morale:-3,lead:2} },

{ id:'ws_wartime_hero', w:8, cat:'world',

{ id:'ws_peace_downsize', w:10, cat:'world',

{ id:'ws_reform_exam', w:9, cat:'world',

  fx:{mos:5,pt:2,morale:-3,pol:3} },

{ id:'ws_election_scrutiny', w:8, cat:'world',

  fx:{pol:5,morale:-3,net:3} },

{ id:'ws_scandal_ig', w:9, cat:'world',
  cond:s=>getCurrentWorldState().id==='scandal',
  text:'军中丑闻持续发酵。监察长办公室向所有单位派驻了调查组，士兵被一个个叫去谈话。整个营区的空气都变紧了。',
  fx:{pol:-3,morale:-6,net:-3} },

{ id:'ws_budget_short', w:9, cat:'world',
  cond:s=>getCurrentWorldState().id==='budget_cut',
  text:'预算削减直接影响训练。弹药配额减半，车辆油料限量，连实弹射击都要提前两周申请。士兵们开始抱怨"连当兵都当不痛快"。',
  fx:{pt:-3,mos:-2,morale:-5,lead:2} },

/* =========================================================
   NPC 背景故事
   ========================================================= */
{ id:'npc_bg_harrison', w:0, force:true,
  cond:s=>s.npcs.superior.value>=60 && !s.chains.npcBgHarrison,
  text:'一次酒局，哈里森喝多了。他盯着杯子里的酒看了很久，忽然说："二十年前，我带过一个兵。他叫米切尔，十九岁。一次障碍训练，他从墙上摔下来，脖子先着地。我抱着他，他喊了一声中士，然后就没了。" 他抬起头看着你，眼睛有点红。',
  choices:[
    { label:'认真听他说完，不打断',
      apply:s=>{ s.chains.npcBgHarrison='heard'; s.npcs.superior.value=clamp(s.npcs.superior.value+10,0,100); s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale-2,0,100);
        return '他说完之后，拍了拍你的肩："你是这么多年来，第一个听我说完的。" 他没再说别的。'; } },
    { label:'表示理解，但不追问',
      apply:s=>{ s.chains.npcBgHarrison='understood'; s.npcs.superior.value=clamp(s.npcs.superior.value+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你点了点头，给他倒了杯水。他接过水，笑了一下："你懂事。"'; } },
    { label:'岔开话题，让他别想那么多',
      apply:s=>{ s.chains.npcBgHarrison='avoided'; s.npcs.superior.value=clamp(s.npcs.superior.value-5,0,100); s.morale=clamp(s.morale-1,0,100);
        return '你说了句"都过去了"。他的眼神一下子暗了下去，端起酒杯自己喝了。'; } }
  ]},

{ id:'npc_bg_rivera', w:0, force:true,
  cond:s=>s.npcs.peer.value>=60 && !s.chains.npcBgRivera,
  text:'你路过里维拉的办公室，看到他一个人在加班。桌上摆着一张旧照片——一个中年男人站在州议会大厦前，笑容克制。他听到脚步声，抬头看见你，没来得及把照片收起来。',
  choices:[
    { label:'问一句"照片里的人是谁"',
      apply:s=>{ s.chains.npcBgRivera='asked'; s.npcs.peer.value=clamp(s.npcs.peer.value+10,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他沉默了一会儿，说："我父亲。他进过监狱。" 然后他讲了整整半个小时。这是他第一次跟人说这些。'; } },
    { label:'不谈私事，谈工作',
      apply:s=>{ s.chains.npcBgRivera='work'; s.npcs.peer.value=clamp(s.npcs.peer.value+5,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你说了句"加班呢，辛苦了"，然后谈了工作。他收好照片，眼神里有一丝感谢——你给了他台阶。'; } },
    { label:'评论一句"政治家庭不好混"',
      apply:s=>{ s.chains.npcBgRivera='wounded'; s.npcs.peer.value=clamp(s.npcs.peer.value-8,0,100); s.morale=clamp(s.morale-1,0,100);
        return '他的脸色变了一瞬，然后把照片收进抽屉，说"是啊，不好混"。从那以后，他再也没有在你面前提过家里的事。'; } }
  ]},

{ id:'npc_bg_cole', w:0, force:true,
  cond:s=>s.npcs.subordinate.value>=60 && !s.chains.npcBgCole,
  text:'一次训练结束后，你看到科尔一个人坐在操场边，手里捏着一封信。他听到脚步声，抬头看到你，勉强笑了一下。',
  choices:[
    { label:'坐到他旁边，什么都不问',
      apply:s=>{ s.chains.npcBgCole='sat'; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+10,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你们并排坐了很久。最后他把信递给你。信上写的是一份阵亡通知的复印件——他哥哥，2015 年，中东。他没说话，你也没说。'; } },
    { label:'问一句"家里还好吗"',
      apply:s=>{ s.chains.npcBgCole='asked'; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+8,0,100); s.lead=clamp(s.lead+2,0,100);
        return '他说"没事"，但你知道他在说谎。你把口袋里的烟递给他，他摇了摇头，说了句"谢谢长官"。'; } },
    { label:'喊他回去继续训练',
      apply:s=>{ s.chains.npcBgCole='dismissed'; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-10,0,100); s.morale=clamp(s.morale-2,0,100);
        return '他站起来，敬了个礼，跟着你走了。但他把那封信折起来放进上衣口袋时，你看到他手在抖。'; } }
  ]},

/* =========================================================
   NPC 关系张力
   ========================================================= */
{ id:'npc_tension_hv', w:0, force:true,
  cond:s=>s.npcs.superior.value>=60 && s.npcs.peer.value>=60 && s.chains.npcBgHarrison && s.chains.npcBgRivera && !s.chains.tensionHV,
  text:'一次旅部会议上，哈里森和里维拉当众交锋。哈里森说了一句"有些人靠什么上去的，他自己清楚"，里维拉回了一句"有些人一辈子活在过去，也配谈带兵"。会议室安静得能听见空调声。会后两人分别找你。',
  choices:[
    { label:'站哈里森',
      apply:s=>{ s.chains.tensionHV='harrison'; s.npcs.superior.value=clamp(s.npcs.superior.value+15,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value-10,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你私下对里维拉说："你刚才那句话过分了。" 他冷冷看了你一眼。哈里森知道后，拍着你的肩说"我就知道你是个明白人"。'; } },
    { label:'站里维拉',
      apply:s=>{ s.chains.tensionHV='rivera'; s.npcs.peer.value=clamp(s.npcs.peer.value+15,0,100); s.npcs.superior.value=clamp(s.npcs.superior.value-10,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你私下对哈里森说："在会上那样说不太合适。" 他没说话，只是点了点头。里维拉知道后，请你喝了杯咖啡。'; } },
    { label:'不站队，说"我只看工作"',
      apply:s=>{ s.chains.tensionHV='neutral'; s.npcs.superior.value=clamp(s.npcs.superior.value-3,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value-3,0,100); s.pol=clamp(s.pol+4,0,100);
        return '你对两人都说了同一句话："我不管你们之间的事，我只看谁能把活干好。" 两人都不满意，但都记住了你这句话。'; } }
  ]},

{ id:'npc_tension_rc', w:0, force:true,
  cond:s=>s.npcs.peer.value>=60 && s.npcs.subordinate.value>=60 && s.chains.npcBgRivera && s.chains.npcBgCole && !s.chains.tensionRC,
  text:'科尔的报告被里维拉用某种方式"绕过"了——本该递到上级的东西，被压在了里维拉的抽屉里。科尔私下找到你："长官，我不明白，为什么有些事不能明着来。"',
  choices:[
    { label:'替科尔把报告重新递上去',
      apply:s=>{ s.chains.tensionRC='cole'; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+15,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value-8,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你把报告直接交给了哈里森。里维拉知道后，找到你说了一句"你这个人，真有意思"。他笑着说，但眼睛没笑。'; } },
    { label:'劝科尔"看开点，这是系统"',
      apply:s=>{ s.chains.tensionRC='rivera'; s.npcs.peer.value=clamp(s.npcs.peer.value+10,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-12,0,100); s.pol=clamp(s.pol+4,0,100);
        return '科尔沉默了很久，最后说："我明白了，长官。" 但从那以后，他交给你的报告，再也没有夹过任何"多余的想法"。'; } },
    { label:'私下找里维拉谈，让他放过科尔',
      apply:s=>{ s.chains.tensionRC='mediator'; s.npcs.peer.value=clamp(s.npcs.peer.value+5,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+5,0,100); s.net=clamp(s.net+3,0,100);
        return '里维拉听完你的话，笑了一下："你替那个小天真出头？" 但他最终把报告递了上去。科尔不知道这件事，但他能感觉到里维拉对他态度好了一些。'; } }
  ]},

{ id:'npc_tension_hc', w:0, force:true,
  cond:s=>s.npcs.superior.value>=60 && s.npcs.subordinate.value>=60 && s.chains.npcBgHarrison && s.chains.npcBgCole && !s.chains.tensionHC,
  text:'一次演习中，哈里森当众表扬了科尔，语气却像在说"我儿子终于长大了"。科尔事后私下找到你："长官，我宁愿他骂我，也不愿他把我当成别人的替身。"',
  choices:[
    { label:'劝科尔"他是为你好"',
      apply:s=>{ s.chains.tensionHC='harrison'; s.npcs.superior.value=clamp(s.npcs.superior.value+5,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-8,0,100);
        return '科尔点了点头，说了句"我知道"。但他没再说什么。你看到他的眼神里，有什么东西暗了下去。'; } },
    { label:'告诉哈里森"科尔需要的是尊重，不是照顾"',
      apply:s=>{ s.chains.tensionHC='cole'; s.npcs.superior.value=clamp(s.npcs.superior.value-8,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+15,0,100); s.lead=clamp(s.lead+4,0,100);
        return '哈里森听完，沉默了很久，最后说："你说得对。" 第二天他把科尔叫到办公室谈了很久。科尔出来的时候，眼睛是红的。'; } },
    { label:'什么都不做，让他们自己解决',
      apply:s=>{ s.chains.tensionHC='passive'; s.npcs.superior.value=clamp(s.npcs.superior.value+3,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+3,0,100);
        return '你选择了不介入。他们之间的事，最终还是要他们自己解决。半年后，两人的关系确实好了一些——用他们自己的方式。'; } }
  ]},

/* =========================================================
   NPC 三角总事件
   ========================================================= */
{ id:'npc_triangle', w:0, force:true,
  cond:s=>s.chains.tensionHV && s.chains.tensionRC && s.chains.tensionHC && !s.chains.triangle,
  text:'一次偶然的机会，你和哈里森、里维拉、科尔坐在了同一家酒馆里。酒过三巡，气氛有些微妙。哈里森说了句关于"责任"的话，里维拉接了一句"这年头光有责任不够"，科尔沉默了。',
  choices:[
    { label:'让哈里森和里维拉把话说完',
      apply:s=>{ s.chains.triangle='let_talk'; s.npcs.superior.value=clamp(s.npcs.superior.value+5,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value+5,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-3,0,100);
        return '两人争了半个多小时，最后谁也没说服谁。但你什么都没说，三人对你的"不掺和"都有几分赞许。'; } },
    { label:'打断他们，讲一个自己的故事',
      apply:s=>{ s.chains.triangle='own_story'; s.npcs.superior.value=clamp(s.npcs.superior.value+5,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value+5,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+5,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale+5,0,100);
        return '你讲了一个自己刚入伍时的故事——讲得不好，但很真实。讲完之后，三个人都笑了。那一刻，酒馆里只有四个军人，没有上下级，没有政治。'; } },
    { label:'借故离开，让他们自己处理',
      apply:s=>{ s.chains.triangle='left'; s.npcs.superior.value=clamp(s.npcs.superior.value-5,0,100); s.npcs.peer.value=clamp(s.npcs.peer.value-5,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-5,0,100);
        return '你说"我先走了"，起身离开。走出酒馆的时候，你回头看了一眼——三个人还在那里，但已经不再说话。'; } }
  ]},

/* =========================================================
   NPC 专属事件 · 哈里森
   ========================================================= */
{ id:'npc_h_1', w:7, cat:'npc',
  cond:s=>s.npcs.superior.value>=70 && s.yos>=4 && !s.flags.npc_h1_done,
  text:'哈里森私下找你："如果上级下达了一道你认为不合理的命令，你会怎么做？"',
  choices:[
    { label:'"执行，但书面保留意见"',
      apply:s=>{ s.flags.npc_h1_done=true; s.npcs.superior.value=clamp(s.npcs.superior.value+6,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他点了点头："你比我想的成熟。"'; } },
    { label:'"先执行，事后找机会反映"',
      apply:s=>{ s.flags.npc_h1_done=true; s.npcs.superior.value=clamp(s.npcs.superior.value+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '他说："这是大多数人的做法。" 语气里有一丝失望。'; } },
    { label:'"我会当面提出质疑"',
      apply:s=>{ s.flags.npc_h1_done=true; s.npcs.superior.value=clamp(s.npcs.superior.value+8,0,100); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol-2,0,100);
        return '他盯着你看了三秒，然后笑了："有种。" 这是你第一次见他笑。'; } }
  ]},

{ id:'npc_h_2', w:6, cat:'npc',
  cond:s=>s.npcs.superior.value>=80 && s.yos>=8,
  text:'一次会议上，哈里森当众批评了你的方案。会后他私下找到你："刚才那些话是会上说的，别往心里去。"',
  fx:{lead:3,pol:2,net:2} },

{ id:'npc_h_3', w:6, cat:'npc',
  cond:s=>s.npcs.superior.value>=85 && s.yos>=10 && !s.flags.npc_h3_done,
  text:'哈里森把你叫到办公室，从抽屉里拿出一枚旧徽章。"这是米切尔那年的，"他说，"我没能给他戴上。现在给你。"',
  choices:[
    { label:'郑重收下',
      apply:s=>{ s.flags.npc_h3_done=true; s.npcs.superior.value=clamp(s.npcs.superior.value+8,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale+6,0,100);
        addMedal('米切尔纪念徽章');
        return '你把徽章别在内袋里，贴着胸口。从那以后，你再没摘下来过。'; } },
    { label:'收下，但建议捐给部队',
      apply:s=>{ s.flags.npc_h3_done=true; s.npcs.superior.value=clamp(s.npcs.superior.value+5,0,100); s.net=clamp(s.net+4,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他沉默了一会儿，说"你比我想的明白"。那枚徽章后来进了连队的荣誉室。'; } }
  ]},

{ id:'npc_h_4', w:5, cat:'npc',
  cond:s=>s.npcs.superior.value>=90 && s.grade>=7,
  text:'哈里森退休前最后一次找你喝酒。他说："我看人很准。你是我带过的兵里，最像我年轻时候的一个。"',
  fx:{lead:5,morale:8,net:3} },

/* =========================================================
   NPC 专属事件 · 里维拉
   ========================================================= */
{ id:'npc_r_1', w:7, cat:'npc',
  cond:s=>s.npcs.peer.value>=70 && s.yos>=4 && !s.flags.npc_r1_done,
  text:'里维拉私下找你："我们联手吧。你上一级，我也上一级。这年头，一个人走不容易。"',
  choices:[
    { label:'接受合作',
      apply:s=>{ s.flags.npc_r1_done=true; s.npcs.peer.value=clamp(s.npcs.peer.value+8,0,100); s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '从那天起，你们开始互通信息、互相推荐。两年后，你们果然同时上了一个台阶。'; } },
    { label:'婉拒，但保持友好',
      apply:s=>{ s.flags.npc_r1_done=true; s.npcs.peer.value=clamp(s.npcs.peer.value+3,0,100); s.pol=clamp(s.pol+2,0,100);
        return '他笑了笑，说"理解"。但从那以后，他再也没有在你面前提过"合作"这两个字。'; } },
    { label:'直接拒绝，讨厌这套',
      apply:s=>{ s.flags.npc_r1_done=true; s.npcs.peer.value=clamp(s.npcs.peer.value-8,0,100); s.lead=clamp(s.lead+2,0,100);
        return '他愣了一下，然后说"你真是哈里森教出来的"。从那以后，你们之间多了一层看不见的墙。'; } }
  ]},

{ id:'npc_r_2', w:6, cat:'npc',
  cond:s=>s.npcs.peer.value>=75 && s.yos>=8,
  text:'里维拉在一次私下场合告诉你一个内部消息："下一批晋升名单里，本来有你的名字，但有人把它划掉了。"',
  fx:{pol:5,net:3,morale:-3} },

{ id:'npc_r_3', w:6, cat:'npc',
  cond:s=>s.npcs.peer.value<=25 && s.yos>=5 && !s.flags.npc_r3_done,
  text:'你听说里维拉在晋升委员会上说了你一句"不够成熟"。你没有直接证据，但所有人都知道这话是从哪来的。',
  choices:[
    { label:'当面质问他',
      apply:s=>{ s.flags.npc_r3_done=true; s.npcs.peer.value=clamp(s.npcs.peer.value-5,0,100); s.lead=clamp(s.lead+3,0,100); s.pol=clamp(s.pol-2,0,100);
        return '他笑着否认，但你们都知道这是怎么回事。从那以后，你们之间的每一次对话都多了一层试探。'; } },
    { label:'装作不知道，暗中积累实力',
      apply:s=>{ s.flags.npc_r3_done=true; s.pol=clamp(s.pol+5,0,100); s.net=clamp(s.net+3,0,100);
        return '你没有揭穿他，而是开始更谨慎地经营自己的关系网。多年后，当你有机会时，你什么都没做——因为那时候你已经不需要了。'; } },
    { label:'把这当作动力',
      apply:s=>{ s.flags.npc_r3_done=true; s.morale=clamp(s.morale+5,0,100); s.lead=clamp(s.lead+4,0,100);
        return '你告诉自己"与其抱怨，不如证明"。接下来的两年，你在业务上做到了全旅第一。'; } }
  ]},

{ id:'npc_r_4', w:5, cat:'npc',
  cond:s=>s.npcs.peer.value>=85 && s.yos>=12,
  text:'里维拉在晋升为少校的那天，请你喝了顿酒。他说："这个圈子里，真心不容易。你算一个。"',
  fx:{pol:5,net:5,morale:5} },

/* =========================================================
   NPC 专属事件 · 科尔
   ========================================================= */
{ id:'npc_c_1', w:7, cat:'npc',
  cond:s=>s.npcs.subordinate.value>=60 && s.yos>=3,
  text:'一名士兵的母亲重病，请假申请被上级驳回。科尔找到你："长官，能不能想个办法？"',
  choices:[
    { label:'替他找上级沟通，争取特批',
      apply:s=>{ s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+10,0,100); s.lead=clamp(s.lead+3,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你找了哈里森，费了不少口舌。最终批下来了。科尔后来对你说："兄弟们知道了，他们都愿意跟您。"'; } },
    { label:'按规矩来，不能破例',
      apply:s=>{ s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-8,0,100); s.pol=clamp(s.pol+3,0,100);
        return '科尔点了点头，什么都没说。但你知道，这件事在他心里留下了印子。'; } },
    { label:'让科尔自己陪士兵去找上级',
      apply:s=>{ s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+6,0,100); s.lead=clamp(s.lead+2,0,100); s.net=clamp(s.net+2,0,100);
        return '科尔带着士兵去了上级那里，一番陈述后打动了他。科尔回来说："长官，您让我自己去做，比我听您的命令更有意义。"'; } }
  ]},

{ id:'npc_c_2', w:6, cat:'npc',
  cond:s=>s.npcs.subordinate.value>=70 && s.yos>=6 && !s.flags.npc_c2_done,
  text:'科尔发现上级有一处小违规——不严重，但违规就是违规。他私下问你："长官，要不要上报？"',
  choices:[
    { label:'"报，该怎么做怎么做"',
      apply:s=>{ s.flags.npc_c2_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+8,0,100); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol-3,0,100);
        return '你陪着他一起写了报告。上报后你和他都被上级批评"不懂变通"，但科尔说："谢谢长官，我知道以后该怎么做了。"'; } },
    { label:'"看情况，不是所有事都要上报"',
      apply:s=>{ s.flags.npc_c2_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-6,0,100); s.pol=clamp(s.pol+4,0,100);
        return '科尔看了你一会儿，最后说"好"。你知道他失望了——他在你身上看到了"系统"的影子。'; } },
    { label:'"你自己判断，我支持你的决定"',
      apply:s=>{ s.flags.npc_c2_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+5,0,100); s.lead=clamp(s.lead+3,0,100);
        return '科尔想了三天，最后选择上报。他说："长官，是我决定的，我不后悔。" 你点了点头——你知道他长大了。'; } }
  ]},

{ id:'npc_c_3', w:6, cat:'npc',
  cond:s=>s.npcs.subordinate.value>=80 && s.yos>=8 && !s.flags.npc_c3_done,
  text:'科尔来找你，神色复杂："长官，另一支部队想挖我。给我更好的位置。我想听听您的意见。"',
  choices:[
    { label:'"你应该去，那是个好机会"',
      apply:s=>{ s.flags.npc_c3_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+10,0,100); s.net=clamp(s.net+3,0,100); s.morale=clamp(s.morale-3,0,100);
        return '他走了。后来每次你升职，他都会给你发一条消息。你们再没见过面，但你知道，他一直是你的兵。'; } },
    { label:'"留下，我需要你"',
      apply:s=>{ s.flags.npc_c3_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+12,0,100); s.lead=clamp(s.lead+3,0,100); s.net=clamp(s.net+4,0,100);
        return '他留下了。从那天起，他再也没有提过"离开"。他后来成了你最信任的军士长。'; } },
    { label:'"这个决定要你自己做，我不能替你想"',
      apply:s=>{ s.flags.npc_c3_done=true; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+6,0,100); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol+2,0,100);
        return '他想了一个星期，最后决定留下。他说："长官，我明白了——有些东西比位置更重要。"'; } }
  ]},

{ id:'npc_c_4', w:5, cat:'npc',
  cond:s=>s.npcs.subordinate.value>=90 && s.yos>=12,
  text:'科尔晋升为军士长的那天，请你喝酒。他说："长官，我哥当年带的兵，现在还有两个在部队。他们说，我哥如果活着，一定希望我成为您这样的人。"',
  fx:{lead:6,morale:10,net:4,pol:3} },

/* =========================================================
   NPC 专属事件 · 陈纳德
   ========================================================= */
{ id:'npc_t_1', w:0, force:true,
  cond:s=>s.npcs.technician.value>=60 && !s.chains.npcBgChenard,
  text:'一次夜间值班，你路过技术间，看到陈纳德一个人坐在工作台前，手里捏着一张泛黄的照片。他听到脚步声，抬头看了你一眼，没有收起照片。照片上是一个穿旧式军装的亚洲男人，站在一台老式无线电台旁边。',
  choices:[
    { label:'问一句"照片里的人是谁"',
      apply:s=>{ s.chains.npcBgChenard='asked'; s.npcs.technician.value=clamp(s.npcs.technician.value+10,0,100); s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol+2,0,100);
        return '他沉默了很久，说："我父亲。南越军队的通信兵。1975 年，西贡陷落前一周，他把这台电台拆了，装进一个木箱，带着全家上了美军的撤离船。" 他顿了一下："那台电台，现在还在这间屋里。"'; } },
    { label:'不问私事，谈谈工作',
      apply:s=>{ s.chains.npcBgChenard='work'; s.npcs.technician.value=clamp(s.npcs.technician.value+5,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你说了句"还在忙呢"，然后开始聊起最近的装备维护计划。他收起照片，点了点头——他欣赏你"不多嘴"的风格。'; } },
    { label:'说一句"您父亲一定为您骄傲"',
      apply:s=>{ s.chains.npcBgChenard='warm'; s.npcs.technician.value=clamp(s.npcs.technician.value+7,0,100); s.morale=clamp(s.morale+3,0,100);
        return '他看了你一眼，眼神里有什么东西闪了一下。他什么都没说，但你能感觉到，从那天起，他看你的方式和看别人不一样了。'; } }
  ]},

{ id:'npc_t_2', w:0, force:true,
  cond:s=>s.npcs.technician.value>=70 && !s.chains.npcTechProject && ['25B','35F','12B'].includes(s.mosCode),
  text:'陈纳德把你叫到一间不对外开放的实验室。桌上摆着一套你从未见过的新装备。"总部让我测试这个，"他说，"但我需要一个真正懂技术的助手。你愿不愿意？"',
  choices:[
    { label:'接受，全力投入',
      apply:s=>{ s.chains.npcTechProject='accepted'; s.npcs.technician.value=clamp(s.npcs.technician.value+8,0,100); s.mos=clamp(s.mos+5,0,100); s.morale=clamp(s.morale-3,0,100);
        return '接下来的三个月，你几乎每晚都在实验室里度过。这套系统的细节比你想象的复杂，但你也第一次感觉到——技术也可以是一种战斗。'; } },
    { label:'接受，但只参与部分工作',
      apply:s=>{ s.chains.npcTechProject='partial'; s.npcs.technician.value=clamp(s.npcs.technician.value+4,0,100); s.mos=clamp(s.mos+3,0,100);
        return '你参与了测试，但没有投入全部精力。陈纳德没说什么，但你感觉到他有点失望。'; } },
    { label:'婉拒，"我对自己的岗位更熟悉"',
      apply:s=>{ s.chains.npcTechProject='declined'; s.npcs.technician.value=clamp(s.npcs.technician.value-5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '他点了点头，没有挽留。但从那以后，他再也没有找你参与过任何特殊项目。'; } }
  ]},

{ id:'npc_t_3', w:0, force:true,
  cond:s=>s.npcs.technician.value>=75 && s.track==='E' && s.mos>=70 && !s.chains.wo_attempted && !s.chains.npcWOPush,
  text:'陈纳德把你叫到办公室。"我看了你的技术档案，"他说，"你应该走准尉路线。不是所有人都能走，但你能。"',
  choices:[
    { label:'接受他的建议，申请准尉',
      apply:s=>{ s.chains.npcWOPush='accepted'; s.npcs.technician.value=clamp(s.npcs.technician.value+8,0,100); s.pol=clamp(s.pol+3,0,100); s.morale=clamp(s.morale+4,0,100);
        s.flags.wo_recommended = true;
        return '他点了点头，从抽屉里拿出一份推荐表格："我签个字，你去准备材料。" 他签完字之后加了一句："别让我丢脸。"'; } },
    { label:'婉拒，"我更想留在士官序列"',
      apply:s=>{ s.chains.npcWOPush='declined'; s.npcs.technician.value=clamp(s.npcs.technician.value-5,0,100);
        return '他看了你一眼，说："那是你的选择。" 语气里没有责怪，但你听得出来他有点失望。'; } }
  ]},

{ id:'npc_t_4', w:0, force:true,
  cond:s=>s.npcs.technician.value>=90 && s.yos>=15 && !s.chains.npcChenardFarewell,
  text:'陈纳德退役仪式。他服役满 30 年，是整个旅最后一位 W-5。仪式结束后，他把你叫到一边，从胸前取下一枚磨损的准尉徽章。"这是我父亲留下的，"他说，"我戴了 30 年。现在它是你的。"',
  choices:[
    { label:'郑重收下，承诺继续传承',
      apply:s=>{ s.chains.npcChenardFarewell='accepted'; s.npcs.technician.value=clamp(s.npcs.technician.value+5,0,100); s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+8,0,100);
        addMedal('陈纳德准尉徽章');
        return '你把那枚徽章挂在工位上。多年后，你带出的每个技术兵都会被带到它面前，听一遍那个越南移民家庭的故事。'; } },
    { label:'收下，但请求把它留在技术间',
      apply:s=>{ s.chains.npcChenardFarewell='shared'; s.npcs.technician.value=clamp(s.npcs.technician.value+5,0,100); s.net=clamp(s.net+5,0,100); s.pol=clamp(s.pol+4,0,100);
        addMedal('陈纳德准尉徽章');
        return '他把徽章留在了技术间的荣誉框里。从此，每个新来的技术兵都会看到它——这比交给你一个人更有意义。'; } }
  ]},

/* =========================================================
   派系专属事件
   ========================================================= */
/* ----- 铁血派 ----- */
{ id:'fac_warrior_1', w:0, force:true,
  cond:s=>s.factions.warrior>=50 && !s.chains.facW1,
  text:'哈里森把你叫到办公室。"明天有位老将军来视察，"他说，"他参加过海湾战争。我带你去见他。"',
  choices:[
    { label:'恭敬地请教老将军',
      apply:s=>{ s.chains.facW1='respectful'; addFaction('warrior', 5); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol+3,0,100); s.net=clamp(s.net+3,0,100);
        return '老将军跟你聊了半小时，讲了他 1991 年在沙漠里的经历。临走时他说："年轻人，军队的根在你身上。"'; } },
    { label:'带着自己的战术方案去汇报',
      apply:s=>{ s.chains.facW1='ambitious'; addFaction('warrior', 8); addFaction('pragmatist', -2); s.lead=clamp(s.lead+5,0,100); s.mos=clamp(s.mos+3,0,100);
        return '老将军认真地听完你的汇报，说"这个方案有想法"。哈里森事后拍着你的肩说"你抢了我的风头"——但他是笑着说的。'; } }
  ]},

{ id:'fac_warrior_2', w:0, force:true,
  cond:s=>s.factions.warrior>=70 && !s.chains.facW2,
  text:'一次跨军种会议上，一位海军军官质疑陆军的战斗标准。哈里森看了你一眼——他希望你替陆军说话。',
  choices:[
    { label:'强硬回应，维护陆军荣誉',
      apply:s=>{ s.chains.facW2='hard'; addFaction('warrior', 8); addFaction('pragmatist', -4); s.lead=clamp(s.lead+5,0,100); s.net=clamp(s.net-2,0,100);
        return '你引用了三次实战案例，把对方的论点逐一驳回。哈里森会后对你说："这一仗打得漂亮。"'; } },
    { label:'用数据回应，不带情绪',
      apply:s=>{ s.chains.facW2='data'; addFaction('warrior', 4); addFaction('intellect', 3); s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol+4,0,100);
        return '你拿出了过去三年的联合演习数据。对方沉默了。哈里森虽然没说什么，但你知道他更喜欢"硬碰硬"。'; } },
    { label:'保持低调，不参与争论',
      apply:s=>{ s.chains.facW2='quiet'; addFaction('warrior', -3); s.pol=clamp(s.pol+3,0,100);
        return '你没有开口。哈里森没有说什么，但从那以后，他再也没有在重要场合带你出席。'; } }
  ]},

/* ----- 智谋派 ----- */
{ id:'fac_intellect_1', w:0, force:true,
  cond:s=>s.factions.intellect>=50 && !s.chains.facI1,
  text:'陈纳德找你，说总部要举办一次全军技术演示，他推荐了你。"但你要想清楚，"他说，"这不是给战士看的，是给技术委员会看的。方式不同。"',
  choices:[
    { label:'准备一份精密的技术方案',
      apply:s=>{ s.chains.facI1='technical'; addFaction('intellect', 6); s.mos=clamp(s.mos+5,0,100);
        return '你花了三个月准备方案。演示当天，技术委员会的将军们问了你 20 个问题，你一一回答。会后有一位少将私下找你——他记住了你的名字。'; } },
    { label:'准备一份通俗易懂的汇报',
      apply:s=>{ s.chains.facI1='accessible'; addFaction('intellect', 3); addFaction('idealist', 3); s.pol=clamp(s.pol+3,0,100);
        return '你把复杂的技术原理讲成了连队士兵都能听懂的故事。技术委员会评价"通俗易懂"，但陈纳德觉得你"降低了深度"。'; } }
  ]},

{ id:'fac_intellect_2', w:0, force:true,
  cond:s=>s.factions.intellect>=70 && !s.chains.facI2,
  text:'一次大规模演习中，指挥系统突然瘫痪。旅长在现场发火，技术员们束手无策。你是现场技术能力最强的人。',
  choices:[
    { label:'用非常规方法抢修，承担风险',
      apply:s=>{ s.chains.facI2='risky'; addFaction('intellect', 8); addFaction('warrior', -3); s.mos=clamp(s.mos+6,0,100); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你违反了两条技术规程，在四小时内恢复了系统。旅长表扬了你，但也有人在背后说"这个兵太野"。'; } },
    { label:'按规程操作，等备件到位',
      apply:s=>{ s.chains.facI2='procedure'; addFaction('intellect', 4); addFaction('pragmatist', 5); s.pol=clamp(s.pol+5,0,100);
        return '你按规定流程处理，系统在八小时后恢复。旅长有些不满，但陈纳德事后对你说："你做得对。"'; } },
    { label:'折中：先按规程，同时准备备选方案',
      apply:s=>{ s.chains.facI2='balanced'; addFaction('intellect', 6); addFaction('pragmatist', 3); s.mos=clamp(s.mos+5,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你用规定流程的同时提前准备好了备选方案。备件迟到时你立刻启用备选方案，两小时内恢复了系统。旅长和陈纳德都满意。'; } }
  ]},

/* ----- 务实派 ----- */
{ id:'fac_pragmatist_1', w:0, force:true,
  cond:s=>s.factions.pragmatist>=50 && !s.chains.facP1,
  text:'里维拉私下找你："下一批晋升名额快下来了。我认识人事处的几个人——我们联手，你上一级，我也上一级。"',
  choices:[
    { label:'接受合作',
      apply:s=>{ s.chains.facP1='cooperate'; addFaction('pragmatist', 8); addFaction('idealist', -4); s.pol=clamp(s.pol+4,0,100); s.net=clamp(s.net+5,0,100); s.yearPromoBonus=(s.yearPromoBonus||0)+0.05;
        return '你们互通信息，互相推荐。半年后，你们果然同时上了一个台阶。但从那以后，你欠了里维拉一个人情。'; } },
    { label:'婉拒，但保持友好',
      apply:s=>{ s.chains.facP1='polite'; addFaction('pragmatist', 2); s.pol=clamp(s.pol+3,0,100);
        return '他笑了笑说"理解"。但他记住了你这次"不给面子"。'; } },
    { label:'直接拒绝，讨厌这套',
      apply:s=>{ s.chains.facP1='reject'; addFaction('pragmatist', -6); addFaction('idealist', 4); addFaction('warrior', 3); s.lead=clamp(s.lead+3,0,100);
        return '他愣了一下，说"你真是哈里森教出来的"。从那以后，你们之间多了一层看不见的墙。'; } }
  ]},

{ id:'fac_pragmatist_2', w:0, force:true,
  cond:s=>s.factions.pragmatist>=70 && !s.chains.facP2,
  text:'一次预算争夺会议。你的单位和另一个单位在争同一笔训练经费。会议主持人希望"自己人"替自己说话。',
  choices:[
    { label:'为自己单位全力争取',
      apply:s=>{ s.chains.facP2='fight'; addFaction('pragmatist', 6); s.pol=clamp(s.pol+4,0,100); s.net=clamp(s.net+3,0,100);
        return '你用数据证明了自己单位的需求更迫切，经费批了下来。兄弟单位的人从此对你有些看法——但你的兵得到了更好的装备。'; } },
    { label:'提议两家平分',
      apply:s=>{ s.chains.facP2='split'; addFaction('pragmatist', 3); addFaction('idealist', 3); s.pol=clamp(s.pol+3,0,100); s.net=clamp(s.net+4,0,100);
        return '两家各拿一半。没人完全满意，但也没人翻脸——这就是务实派的艺术。'; } },
    { label:'把经费让给更需要的那家',
      apply:s=>{ s.chains.facP2='yield'; addFaction('pragmatist', -3); addFaction('idealist', 6); addFaction('warrior', 2); s.lead=clamp(s.lead+4,0,100); s.net=clamp(s.net+4,0,100);
        return '你主动让出了经费。你的兵在接下来半年里装备紧张，但你也因此获得了那位兄弟单位指挥官的长期友谊。'; } }
  ]},

/* ----- 理想派 ----- */
{ id:'fac_idealist_1', w:0, force:true,
  cond:s=>s.factions.idealist>=50 && !s.chains.facId1,
  text:'一名服役 18 年的老军士长被上级以"不适应新技术"为由提前退役。他的兵都知道，真正的原因是他拒绝在某个采购案上签字。',
  choices:[
    { label:'向上级申诉，公开为他争取',
      apply:s=>{ s.chains.facId1='fight'; addFaction('idealist', 8); addFaction('pragmatist', -6); addFaction('warrior', 3); s.lead=clamp(s.lead+5,0,100); s.pol=clamp(s.pol-3,0,100); s.net=clamp(s.net+4,0,100);
        return '你写了一封长信给旅长，详细陈述了这位军士长的贡献和被掩盖的真相。旅长最终同意让他完成服役年限。但从那以后，你在一些人眼里成了"麻烦制造者"。'; } },
    { label:'私下安慰他，但不上报',
      apply:s=>{ s.chains.facId1='comfort'; addFaction('idealist', 3); addFaction('pragmatist', 3); s.morale=clamp(s.morale-4,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你去他家坐了一个晚上，听他讲完了所有的委屈。但你什么也没做。他后来退役了，你偶尔还会想起他。'; } },
    { label:'保持距离，不介入',
      apply:s=>{ s.chains.facId1='distant'; addFaction('idealist', -5); addFaction('pragmatist', 3); s.pol=clamp(s.pol+2,0,100);
        return '你没有参与这件事。多年后你听说那位军士长退役后过得不太好。你告诉自己"这是系统的问题"，但你知道，你也曾经是系统的一部分。'; } }
  ]},

{ id:'fac_idealist_2', w:0, force:true,
  cond:s=>s.factions.idealist>=70 && !s.chains.facId2,
  text:'一项针对军队内部改革的提案正在讨论。改革派希望推动"士兵匿名反馈机制"，但传统派认为这会"动摇指挥权威"。你被邀请参加意见征集。',
  choices:[
    { label:'公开支持改革',
      apply:s=>{ s.chains.facId2='support'; addFaction('idealist', 8); addFaction('warrior', -5); addFaction('pragmatist', -4); addFaction('intellect', 3); s.lead=clamp(s.lead+4,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你在会上陈述了"士兵的声音是军队的免疫系统"这个观点。会议记录里出现了你的名字。改革派记住了你，但传统派也记住了你。'; } },
    { label:'提出折中方案',
      apply:s=>{ s.chains.facId2='compromise'; addFaction('idealist', 4); addFaction('pragmatist', 4); s.pol=clamp(s.pol+5,0,100);
        return '你提议"先试点再推广"——两边都接受了。你成了那个"能坐下来谈的人"。'; } },
    { label:'保持中立，不表态',
      apply:s=>{ s.chains.facId2='neutral'; addFaction('idealist', -3); addFaction('pragmatist', 2); s.pol=clamp(s.pol+3,0,100);
        return '你没有表态。改革通过了，但你不在推动者的名单上。理想派的人私下说"他也只是嘴上说说"。'; } }
  ]},

/* =========================================================
   经济系统 · 大额事件
   ========================================================= */
{ id:'fin_house', w:0, force:true,
  cond:s=>s.yos>=8 && s.finance && s.finance.balance>=20000 && !s.financeFlags.house,
  text:'你手上有了一些积蓄。驻地的房地产市场不错——房价在涨，租金也在涨。中介建议你"现在入手是最佳时机"。',
  choices:[
    { label:'买房（首付 $15,000，月供 $1,200）',
      apply:s=>{ s.financeFlags.house=true; s.finance.hasHouse=true; s.finance.balance-=15000;
        s.morale=clamp(s.morale+6,0,100);
        return '你签下了购房合同。从此每月多了一笔房贷，但你第一次有了"自己的家"的感觉。'; } },
    { label:'继续租房，把钱存着',
      apply:s=>{ s.financeFlags.house=true;
        return '你决定不买房。中介有些失望，但你知道，钱在手上比压在砖头里更灵活。'; } },
    { label:'买一辆好车（$25,000）',
      apply:s=>{ s.financeFlags.house=true; s.finance.hasCar=true; s.finance.balance-=25000;
        s.morale=clamp(s.morale+8,0,100);
        return '你买了一辆属于自己的车。每个月多了一笔车贷，但每天上下班的心情完全不一样了。'; } }
  ]},

{ id:'fin_invest', w:0, force:true,
  cond:s=>s.yos>=6 && s.finance && s.finance.balance>=10000 && !s.financeFlags.invest && s.squad && s.squad.core.length,
  text:'你的一位老战友退役后开了一家安保公司，现在要扩展业务，来找你入股。他给了你一份计划书——三种投资方案，风险和回报不同。',
  choices:[
    { label:'保守投资 $5,000（预期年化 6%）',
      apply:s=>{
        s.financeFlags.invest = true;
        s.financeFlags.investType = 'safe';
        s.finance.balance -= 5000;
        s.financeFlags.investStartYear = s.yos;
        s.financeFlags.investPrincipal = 5000;
        addLog('你投入 $5,000 到保守方案。预期年化 6%。', 'fx');
        return '你选择了稳妥。战友有点失望，但他理解。';
      } },
    { label:'标准投资 $10,000（预期年化 12%）',
      apply:s=>{
        s.financeFlags.invest = true;
        s.financeFlags.investType = 'standard';
        s.finance.balance -= 10000;
        s.financeFlags.investStartYear = s.yos;
        s.financeFlags.investPrincipal = 10000;
        addLog('你投入 $10,000 到标准方案。预期年化 12%。', 'fx');
        return '你选择了中庸。战友说"这个方案最稳"。';
      } },
    { label:'激进投资 $20,000（预期年化 25%）',
      apply:s=>{
        s.financeFlags.invest = true;
        s.financeFlags.investType = 'aggressive';
        s.finance.balance -= 20000;
        s.financeFlags.investStartYear = s.yos;
        s.financeFlags.investPrincipal = 20000;
        addLog('你投入 $20,000 到激进方案。预期年化 25%。', 'fx');
        return '你选择了激进。战友拍着你的肩说"哥们够意思"。';
      } },
    { label:'拒绝，军队里的人不适合做生意',
      apply:s=>{ s.financeFlags.invest = true; s.pol=clamp(s.pol+2,0,100);
        return '你婉拒了。战友有些失望，但你知道，不是每个人都适合赌博。'; } }
  ]},

{ id:'fin_invest_return', w:0, force:true,
  cond:s=>s.financeFlags.invest && s.financeFlags.investType && (s.yos - s.financeFlags.investStartYear >= 3) && !s.financeFlags.investResolved,
  text:'三年过去了。战友再次找你——安保公司到了分红的时候。他带了一份账本。',
  choices:[
    { label:'听他说完，接受结果',
      apply:s=>{
        resolveInvestReturn();
        return '你听着他的数字，没有说话。有些账，三年才能算清楚。';
      } }
  ]},

{ id:'fin_family_ill', w:8, cat:'economy',
  cond:s=>s.yos>=5 && s.finance,
  text:'你接到母亲的电话——父亲病了，需要一笔手术费。家里的积蓄不够。',
  choices:[
    { label:'寄 $8,000 回去',
      apply:s=>{ if(s.finance.balance>=8000){ s.finance.balance-=8000; s.morale=clamp(s.morale+4,0,100); s.pol=clamp(s.pol+3,0,100);
          return '你把钱汇了过去。手术很成功。父亲在电话里说了句"谢谢你，儿子"，你听出了他声音里的哽咽。'; }
        else { s.finance.balance-=8000; s.morale=clamp(s.morale-3,0,100);
          return '你借了钱寄回去。手术做了，但你的财务状况变得更紧张。'; } } },
    { label:'申请紧急休假回家',
      apply:s=>{ s.morale=clamp(s.morale+2,0,100); s.pol=clamp(s.pol+2,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你请了假回家。手术费家里想别的办法解决了，但你在父亲床边守了一周。他说"你回来就够了"。'; } },
    { label:'寄 $3,000，说自己也没多少',
      apply:s=>{ s.finance.balance-=3000; s.morale=clamp(s.morale-2,0,100);
        return '你寄了 $3,000，附了一句"我这边也不宽裕"。母亲说"够了够了"。但你知道，不够。'; } }
  ]},

{ id:'fin_donate', w:0, force:true,
  cond:s=>s.squad && s.squad.memorial && s.squad.memorial.length>=1 && s.finance && !s.financeFlags.donated,
  text:'一位战友的遗孀找到了你。她说她正在为孩子上学的事情发愁，抚恤金不够用。',
  choices:[
    { label:'捐 $5,000',
      apply:s=>{ s.financeFlags.donated=true; s.finance.balance-=5000; s.morale=clamp(s.morale+8,0,100); s.lead=clamp(s.lead+3,0,100); s.net=clamp(s.net+3,0,100);
        return '你把钱交给她。她说"他还是没看错人"。那天晚上你给家里打了个电话，多说了几句话。'; } },
    { label:'捐 $1,000，表示心意',
      apply:s=>{ s.financeFlags.donated=true; s.finance.balance-=1000; s.morale=clamp(s.morale+3,0,100);
        return '你给了 $1,000。她说"谢谢"，但你知道这笔钱解决不了根本问题。'; } },
    { label:'不捐，自己的钱也是血汗钱',
      apply:s=>{ s.financeFlags.donated=true; s.morale=clamp(s.morale-5,0,100); s.pol=clamp(s.pol-2,0,100);
        return '你婉拒了。她点了点头走了。你知道，你从此失去了一些东西——不是钱。'; } }
  ]},

{ id:'fin_lend_soldier', w:7, cat:'economy',
  cond:s=>s.yos>=3 && s.finance && s.npcs.subordinate.value>=60,
  text:'一名士兵找到你，说他家里出了事，急需一笔钱。他想向你借 $2,000。',
  choices:[
    { label:'借 $2,000，不问为什么',
      apply:s=>{ if(s.finance.balance>=2000){ s.finance.balance-=2000; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+8,0,100); s.morale=clamp(s.morale+3,0,100);
          return '你把钱给了他，没问原因。三个月后他还了钱，还多买了一条烟给你。他说"长官，我记住了"。'; }
        else { s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+5,0,100);
          return '你手头也紧，但还是凑了 $1,000 给他。他说"够了，谢谢长官"。'; } } },
    { label:'借 $500，说自己也有难处',
      apply:s=>{ s.finance.balance-=500; s.npcs.subordinate.value=clamp(s.npcs.subordinate.value+3,0,100);
        return '你给了他 $500，解释了一下自己的情况。他说"理解"。你知道，这句话之后，你们的关系变了一点——不那么纯粹了。'; } },
    { label:'不借，军队不允许上下级借贷',
      apply:s=>{ s.pol=clamp(s.pol+3,0,100); s.npcs.subordinate.value=clamp(s.npcs.subordinate.value-5,0,100);
        return '你按规矩拒绝了他。他点了点头走了。你做的是"对的事"，但你看到他眼里的失望。'; } }
  ]},

{ id:'fin_car', w:0, force:true,
  cond:s=>s.yos>=4 && s.finance && s.finance.balance>=15000 && !s.financeFlags.car,
  text:'你的旧车快撑不住了。看车的时候，销售给你介绍了两种选择：一辆 $8,000 的二手车，或者一辆 $25,000 的新车贷款。',
  choices:[
    { label:'买 $8,000 的二手车',
      apply:s=>{ s.financeFlags.car=true; s.finance.balance-=8000;
        return '你买了那辆二手车。它不好看，但它能开。'; } },
    { label:'贷款买 $25,000 的新车',
      apply:s=>{ s.financeFlags.car=true; s.finance.hasCar=true; s.finance.balance-=5000;
        s.morale=clamp(s.morale+5,0,100);
        return '你贷款买了新车。每月多了一笔车贷，但每次开车去基地时，你都觉得值。'; } },
    { label:'先不买，继续开旧的',
      apply:s=>{ s.financeFlags.car=true;
        return '你决定再撑一年。旧车还能跑，钱留着更重要。'; } }
  ]},

/* =========================================================
   婚姻系统 · 相遇事件
   ========================================================= */
{ id:'meet_1', w:0, force:true,
  cond:s=>s.spouse.status==='single' && s.yos>=2 && s.yos<=7 && !s.marriageFlags.meet1 && s.age>=21,
  text:'你的老班长邀请你去他家吃饭。席间他说："我妻子有个同事，人很不错，要不要见一面？"',
  choices:[
    { label:'见一面，没什么坏处',
      apply:s=>{
        s.marriageFlags.meet1 = true;
        const sp = generateSpouse('female', 'teacher', 'supportive');
        s.spouse = Object.assign(s.spouse, sp, { status:'dating', meetYear:s.yos });
        return `那天晚上，你在班长家见到了 ${sp.name}。她在一所小学教书。你们聊了很久，从军队聊到书，从书聊到各自的童年。离开的时候，她给了你她的电话。`;
      } },
    { label:'婉拒，现在专注事业',
      apply:s=>{ s.marriageFlags.meet1 = true; s.pol=clamp(s.pol+2,0,100); return '你说现在还没准备好。班长笑了笑说"机会不等人"。'; } }
  ]},

{ id:'meet_2', w:0, force:true,
  cond:s=>s.spouse.status==='single' && s.yos>=3 && s.yos<=8 && !s.marriageFlags.meet2 && s.age>=22,
  text:'驻地附近的小镇办周末市集。你被战友拉去逛，在一个卖手工艺品的摊位前停下。摊主是一位年轻人，正在低头修一个木雕。',
  choices:[
    { label:'主动搭话，夸一句他的手艺',
      apply:s=>{
        s.marriageFlags.meet2 = true;
        const sp = generateSpouse('female', 'homemaker', 'anxious');
        s.spouse = Object.assign(s.spouse, sp, { status:'dating', meetYear:s.yos });
        return `TA抬起头，笑了一下。"要不要看看这个？" TA递给你一个小木雕——是一只鹰。你买下了它，也在那天晚上知道 TA 叫 ${sp.name}。`;
      } },
    { label:'远远看看，不打扰',
      apply:s=>{ s.marriageFlags.meet2 = true; return '你在摊位前站了一会儿，然后走开了。有些机会，错过就是错过了。'; } }
  ]},

{ id:'meet_3', w:0, force:true,
  cond:s=>s.spouse.status==='single' && s.flags.deployed && s.yos>=3 && !s.marriageFlags.meet3,
  text:'部署期间，你在一处人道主义援助点遇到了一位当地翻译。她在帮助一个家庭登记物资，工作认真，英语流利。',
  choices:[
    { label:'保持联系，交换邮箱',
      apply:s=>{
        s.marriageFlags.meet3 = true;
        const sp = generateSpouse('female', 'teacher', 'independent');
        s.spouse = Object.assign(s.spouse, sp, { status:'dating', meetYear:s.yos });
        return `你们交换了邮箱。从那天起，你们每隔几天就会发一封邮件。她讲述她的国家，你讲述你的家乡。`;
      } },
    { label:'礼貌告别，保持职业距离',
      apply:s=>{ s.marriageFlags.meet3 = true; s.pol=clamp(s.pol+3,0,100); return '你和她握手告别。这是正确的做法，也是会让你偶尔想起的做法。'; } }
  ]},

{ id:'meet_4', w:0, force:true,
  cond:s=>s.spouse.status==='single' && s.yos>=4 && !s.marriageFlags.meet4 && s.age>=24,
  text:'母亲在电话里说："你表哥的同事有个女儿，人很好，也在城里工作。要不要认识一下？"',
  choices:[
    { label:'接受母亲的安排',
      apply:s=>{
        s.marriageFlags.meet4 = true;
        const sp = generateSpouse('female', 'nurse', 'practical');
        s.spouse = Object.assign(s.spouse, sp, { status:'dating', meetYear:s.yos });
        return `你回家探亲时见了 ${sp.name}。她是一名护士，工作忙但很开朗。你们在咖啡馆聊了三个小时。`;
      } },
    { label:'说自己还不想被安排',
      apply:s=>{ s.marriageFlags.meet4 = true; return '母亲在电话那头叹了一口气，说"随你吧"。'; } }
  ]},

{ id:'meet_5', w:0, force:true,
  cond:s=>s.spouse.status==='single' && s.yos>=5 && !s.marriageFlags.meet5 && s.track!=='E',
  text:'军校/技术学校的一位同学邀请你参加她的生日聚会。在聚会上，你遇到了一位在另一支部队服役的军官。',
  choices:[
    { label:'主动聊天，深入了解',
      apply:s=>{
        s.marriageFlags.meet5 = true;

function generateChild(name, gender, s){
  // 孩子天赋：从父母属性里遗传 + 随机
  const talentPool = [
    { id:'scholar', name:'聪慧', desc:'智力出众', bonus:{lead:5,pol:5} },
    { id:'athlete', name:'强壮', desc:'体格出众', bonus:{pt:8} },
    { id:'tech', name:'技术天赋', desc:'对机械和电子有天赋', bonus:{mos:8} },
    { id:'social', name:'社交天赋', desc:'容易与人相处', bonus:{net:5,morale:5} },
    { id:'rebel', name:'叛逆', desc:'不喜欢服从', bonus:{lead:-3,pt:3} },
    { id:'calm', name:'沉稳', desc:'冷静有耐心', bonus:{pol:5,lead:3} }
  ];
  const inherited = talentPool[Math.floor(Math.random()*talentPool.length)];
  const second = talentPool[Math.floor(Math.random()*talentPool.length)];
  const talents = inherited.id === second.id ? [inherited] : [inherited, second];

  return {
    name, gender, age: 0, birthYear: s.yos,
    talents: talents,
    // 成长属性
    intelligence: 40 + randomInt(-5, 5) + (s.pol * 0.1),
    physique:    40 + randomInt(-5, 5) + (s.pt * 0.1),
    discipline:  40 + randomInt(-5, 5) + (s.lead * 0.1),
    // 军事兴趣（影响参军的概率）
    militaryInterest: 20 + randomInt(0, 20) + (s.lead * 0.2) + (s.flags.sof ? 15 : 0),
    // 人生轨迹
    path: null,
    pathYear: 0,
    // 长大后才有的数据
    armyData: null,
    // 家庭关系
    relation: 60,
    // 履历
    events: []
  };
},

function generateChildArmyData(child, s){
  return {
    rank: 1,
    track: 'E',
    mosCode: pickChildMOS(child),
    mosName: '',
    yearsIn: 0,
    pt: Math.round(child.physique * 0.7 + 20),
    mos: Math.round(child.intelligence * 0.6 + 20),
    lead: Math.round(child.discipline * 0.6 + 20),
    pol: 40,
    morale: 70,
    medals: [],
    deployed: false
  };
},

function pickChildMOS(child){
  if(child.physique > child.intelligence + 10) return '11B';
  if(child.intelligence > child.physique + 15) return '35F';
  if(child.intelligence > 60 && child.discipline > 60) return '25B';
  const pool = ['11B','12B','68W','25B','35F','92Y','88M'];
  return pool[Math.floor(Math.random()*pool.length)];
},

        return '你用了 Triage 标准——按存活概率分配。老班长被推进了手术帐篷，新兵被推到角落。这是"正确"的做法，但你当晚没有睡着。'; } }
  ]},

{ id:'triage_2', w:0, force:true,
  cond:s=>s.chains.triage && !s.chains.triageStage2,
  text:'六个月后，你收到了被放弃那名士兵的母亲寄来的一封信。信里只有一句话："我儿子死的时候，身边有人吗？"',
  choices:[
    { label:'回信，如实告诉她那天的一切',
      apply:s=>{ s.chains.triageStage2='honest'; s.morale=clamp(s.morale-6,0,100); s.lead=clamp(s.lead+3,0,100); s.net=clamp(s.net+2,0,100);
        return '你在信里写了每一个细节——你握着他的手，你跟他说了话，他最后很安静。她回信说："谢谢你没有骗我。"'; } },
    { label:'回信，但只写温暖的部分',
      apply:s=>{ s.chains.triageStage2='soft'; s.morale=clamp(s.morale-3,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你写了他是个好兵、他很勇敢、他最后很平静——但没有写"我们没有足够的血浆"。保护她，也是保护自己。'; } },
    { label:'不回信，把信归档',
      apply:s=>{ s.chains.triageStage2='silent'; s.morale=clamp(s.morale-8,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你把信放进档案柜。有些问题，回答不了。'; } }
  ]},

{ id:'triage_3', w:0, force:true,
  cond:s=>s.chains.triageStage2 && !s.chains.triageEnd,
  text:'你申请去军医学校深造。面试官问你："你已经救过很多人了，为什么还要学？"',
  choices:[
    { label:'"为了以后不再需要做那种选择"',
      apply:s=>{ s.chains.triageEnd='stronger'; s.mos=clamp(s.mos+6,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale+6,0,100);
        return '面试官沉默了几秒，然后说："你是我们想要的那种人。" 你入学了。'; } },
    { label:'"为了学得更清楚，做决定时更果断"',
      apply:s=>{ s.chains.triageEnd='decisive'; s.mos=clamp(s.mos+5,0,100); s.pol=clamp(s.pol+3,0,100);
        return '面试官说："诚实。" 你入学了，但在学习过程中，你越来越清楚——有些选择永远不会变得容易。'; } },
    { label:'"为了找答案——为什么是我决定"',
      apply:s=>{ s.chains.triageEnd='seeking'; s.mos=clamp(s.mos+4,0,100); s.morale=clamp(s.morale+3,0,100); s.pol=clamp(s.pol+2,0,100);
        return '面试官看了你很久，最后说："这个问题，可能一辈子都没有答案。" 但他还是录取了你。'; } }
  ]},

{ id:'triage_4', w:0, force:true,
  cond:s=>s.chains.triageEnd && s.grade>=6,
  text:'你成为军医学校的教官。第一堂课，坐在下面的是一群刚从医学院毕业的年轻军医。他们还没见过战场。你站在讲台上，手里的讲义第一页写着"Triage 原则"。',
  fx:{mos:+4,lead:+5,morale:+5,pol:+3}, flag:'triage_instructor' },

/* =========================================================
   剧情链条 · 16
   军犬（通用）
   ========================================================= */
{ id:'k9_1', w:0, force:true,
  cond:s=>s.yos>=3 && s.grade>=3 && !s.chains.k9,
  text:'军犬队分给你一条比利时马里努阿犬，名字叫"阿波罗"。它三岁，训练有素，但脾气倔。军犬训导员说："它挑人。看看它认不认你。"',
  choices:[
    { label:'花时间跟它培养感情，从喂食开始',
      apply:s=>{ s.chains.k9='bond'; s.lead=clamp(s.lead+3,0,100); s.morale=clamp(s.morale+5,0,100);
        s.flags.k9Name = '阿波罗';
        return '接下来三个月，你每天亲自喂它、遛它、陪它训练。第四个月的一天早上，它第一次主动把头靠在你腿上。训导员说："它认你了。"'; } },
    { label:'严格训练，不跟它套近乎',
      apply:s=>{ s.chains.k9='strict'; s.mos=clamp(s.mos+3,0,100); s.lead=clamp(s.lead+2,0,100);
        s.flags.k9Name = '阿波罗';
        return '你用最严格的军犬训练法——奖励、惩罚、重复。它服从你，但你看不到它眼睛里的东西。训导员说："这样也行，只是少了点什么。"'; } },
    { label:'先问训导员阿波罗的过去',
      apply:s=>{ s.chains.k9='story'; s.morale=clamp(s.morale+4,0,100); s.lead=clamp(s.lead+2,0,100); s.pol=clamp(s.pol+2,0,100);
        s.flags.k9Name = '阿波罗';
        return '训导员告诉你，阿波罗的前任训导员在一次爆炸中牺牲，它守了尸体两天才被找到。从那以后，它不轻易相信任何人。你听完之后，蹲下来看着它的眼睛说了句："我明白。"'; } }
  ]},

{ id:'k9_2', w:0, force:true,
  cond:s=>s.chains.k9 && s.flags.deployed && !s.chains.k9Stage2,
  text:'首次带着阿波罗部署。一次夜间巡逻，它突然停住，抬头闻了闻，然后回头看你，发出低沉的呜咽。前面十米处是一片看似平静的路边。',
  choices:[
    { label:'相信它，全队停止前进，呼叫排爆',
      apply:s=>{ s.chains.k9Stage2='trust'; s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+6,0,100);
        return '排爆组在路边发现了两个简易爆炸装置。如果你们再走十米，全队都会在爆炸中。事后连长在简报里写了"军犬阿波罗，功勋卓著"。它当晚吃了双份肉干。'; } },
    { label:'犹豫了一下，让工兵先行确认',
      apply:s=>{ s.chains.k9Stage2='careful'; s.mos=clamp(s.mos+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '工兵用探雷器确认了爆炸装置。全队没事，但你耽误了十分钟，错过了原定的行动窗口。上级评价你"谨慎，但代价不小"。'; } },
    { label:'怀疑它判断错了，带队继续前进',
      apply:s=>{ s.chains.k9Stage2='ignored'; s.morale=clamp(s.morale-8,0,100); s.pt=clamp(s.pt-3,0,100);
        return '你们走过了那段路。爆炸没有发生。但阿波罗从那以后再也没有对任何气味做出过反应——它不再相信你会听它的。'; } }
  ]},

{ id:'k9_3', w:0, force:true,
  cond:s=>s.chains.k9Stage2 && s.yos>=s.chains.k9Year+3 && !s.chains.k9End,
  text:'一次任务中，阿波罗为了掩护你而扑向了一名武装分子，子弹打中了它的后腿。军医检查后说："动脉断了，救不回来。安乐死是唯一的选择。"',
  choices:[
    { label:'签字同意安乐死，陪着它到最后',
      apply:s=>{ s.chains.k9End='euthanize'; s.morale=clamp(s.morale-15,0,100); s.lead=clamp(s.lead+4,0,100);
        return '你坐在它旁边，一只手放在它头上。它抬头看了你一眼，然后闭上了眼睛。你没有哭，但那天你一句话都没说。'; } },
    { label:'坚持手术，哪怕它不能继续服役',
      apply:s=>{ s.chains.k9End='surgery'; s.morale=clamp(s.morale-5,0,100); s.pol=clamp(s.pol-3,0,100); s.net=clamp(s.net+3,0,100);
        return '手术花了六个小时。它活了下来，但再也无法服役。军犬队让你负责它的退役安置——这是规则外的例外。'; } },
    { label:'打电话给军犬队，让专业训导员处理',
      apply:s=>{ s.chains.k9End='handover'; s.morale=clamp(s.morale-10,0,100); s.pol=clamp(s.pol+2,0,100);
        return '你没有签字，也没有陪着它。训导员后来说："它最后一直在看门口。" 这句话你记了一辈子。'; } }
  ]},

{ id:'k9_4', w:0, force:true,
  cond:s=>s.chains.k9End && s.yos>=15,
  text:'你退役前一个月，收到军犬队的通知：阿波罗（或它的继任者）也到了退役年龄。他们问："你愿意领养它吗？"',
  fx:{morale:+12,lead:+3,pol:+2}, flag:'k9_adopted' },

/* =========================================================
   剧情链条 · 17
   战俘（通用，需部署或 SOF 背景）
   ========================================================= */
{ id:'pow_1', w:0, force:true,
  cond:s=>(s.flags.deployed || s.flags.sof) && s.yos>=5 && !s.chains.pow,
  text:'一次巡逻中，你的小队遭遇伏击。你被打晕，醒来时发现自己被绑在一间土房里。一个蒙面人坐在你面前，手里拿着一把刀。他用蹩脚的英语说："告诉我你们的下一个行动。"',
  choices:[
    { label:'一句话不说，无论他怎么威胁',
      apply:s=>{ s.chains.pow='silent'; s.morale=clamp(s.morale-15,0,100); s.pt=clamp(s.pt-8,0,100); s.lead=clamp(s.lead+5,0,100);
        return '接下来四天，你被打了三次，没有说一个字。他们最后把你扔在路边。你的肋骨裂了两根，但你的小队安然无恙。'; } },
    { label:'拖延时间，说一些没有价值的信息',
      apply:s=>{ s.chains.pow='delay'; s.morale=clamp(s.morale-10,0,100); s.pt=clamp(s.pt-5,0,100); s.pol=clamp(s.pol+4,0,100);
        return '你告诉了他们一些已经过期的部署信息。他们意识到被骗后暴怒，但你的小队已经安全转移。你被关了六天。'; } },
    { label:'假装配合，试图在过程中找到逃生的机会',
      apply:s=>{ s.chains.pow='escape'; s.morale=clamp(s.morale-8,0,100); s.pt=clamp(s.pt-3,0,100); s.lead=clamp(s.lead+4,0,100); s.mos=clamp(s.mos+3,0,100);
        return '你在第四天夜里趁守卫换班时挣脱绳索，从窗户跳了出去。你在荒野里走了两天才被友军巡逻队发现。'; } }
  ]},

{ id:'pow_2', w:0, force:true,
  cond:s=>s.chains.pow && !s.chains.powStage2,
  text:'被释放后，军方的战俘审查委员会找你谈话。他们问的第一个问题是："你在被俘期间，有没有泄露任何机密信息？"',
  choices:[
    { label:'如实陈述，包括所有细节',
      apply:s=>{ s.chains.powStage2='honest'; s.pol=clamp(s.pol+4,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你讲了四个小时。委员会最终结论："符合行为准则。" 但你的档案里留下了一条备注——只是"程序性"的。'; } },
    { label:'只讲必要部分，保护自己的隐私',
      apply:s=>{ s.chains.powStage2='guarded'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-3,0,100);
        return '委员会觉得你"有所保留"，但最终通过了你的审查。你离开时，一位老上校在门口对你说："我理解。"'; } },
    { label:'反问委员会："你们被俘过吗？"',
      apply:s=>{ s.chains.powStage2='challenge'; s.pol=clamp(s.pol-4,0,100); s.lead=clamp(s.lead+4,0,100); s.net=clamp(s.net+3,0,100);
        return '会议室安静了很久。最终审查通过了，但你和一个关键人物结了仇。这件事多年后还会被提起。'; } }
  ]},

{ id:'pow_3', w:0, force:true,
  cond:s=>s.chains.powStage2 && !s.chains.powEnd,
  text:'一年后，军方决定是否给你颁发"战俘勋章"——这是美军给被俘期间表现坚贞的军人的荣誉。但颁发它，意味着你要在公开场合承认自己曾被俘。',
  choices:[
    { label:'接受勋章，公开承认这段经历',
      apply:s=>{ s.chains.powEnd='accept'; addMedal('战俘勋章'); s.lead=clamp(s.lead+5,0,100); s.morale=clamp(s.morale+8,0,100); s.net=clamp(s.net+4,0,100);
        return '授勋仪式上，你穿着礼服站在全旅面前。你没有低头。多年后，新兵入伍时听到你的名字，会知道——被俘不是耻辱，投降才是。'; } },
    { label:'拒绝勋章，希望这件事过去',
      apply:s=>{ s.chains.powEnd='decline'; s.morale=clamp(s.morale+3,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你婉拒了。授勋委员会理解你的选择。你把那段记忆收了起来——不是忘记，是不再让它定义你。'; } },
    { label:'接受勋章，但要求不公开宣传',
      apply:s=>{ s.chains.powEnd='quiet'; addMedal('战俘勋章'); s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+5,0,100);
        return '勋章以内部形式颁发，没有记者，没有仪式。但你知道，它就在那里。'; } }
  ]},

{ id:'pow_4', w:0, force:true,
  cond:s=>s.chains.powEnd && s.yos>=12,
  text:'多年后，一个陌生号码给你打电话。对方说："我是当年和你一起被关的人。我一直没敢问你——你当时到底说了什么？"',
  fx:{lead:+4,morale:+6,pol:+3}, flag:'pow_reunion' },

/* =========================================================
   剧情链条 · 18
   情报失误（35F 专属）
   ========================================================= */
{ id:'intel_1', w:0, force:true,
  cond:s=>s.mosCode==='35F' && s.grade>=4 && s.yos>=4 && !s.chains.intel,
  text:'你向上级提交了一份情报评估：目标区域是极端组织的武器库，周边 500 米内无平民活动。这个结论是基于三份信号情报和一份无人机图像做出的。',
  choices:[
    { label:'坚持报告——证据链完整',
      apply:s=>{ s.chains.intel='submit'; s.mos=clamp(s.mos+4,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你在报告上签了字。半小时后，打击命令下达。'; } },
    { label:'加一句备注："建议再侦察一次"',
      apply:s=>{ s.chains.intel='caution'; s.mos=clamp(s.mos+3,0,100); s.pol=clamp(s.pol+3,0,100);
        return '你加了一句风险提示。上级看了之后，决定延后 24 小时执行。'; } },
    { label:'请示上级，让他决定',
      apply:s=>{ s.chains.intel='defer'; s.pol=clamp(s.pol+4,0,100); s.mos=clamp(s.mos+1,0,100);
        return '你把判断权交给了上级。他说"按你的报告走"。这句话后来会变成你的噩梦。'; } }
  ]},

{ id:'intel_2', w:0, force:true,
  cond:s=>s.chains.intel && !s.chains.intelStage2,
  text:'打击之后，地面部队报告：目标区域有 6 名平民死亡，其中 2 名是儿童。他们住在情报中"无平民"的那栋楼的地下室里——那里没被无人机拍到。调查委员会开始介入。',
  choices:[
    { label:'主动承担责任，承认判断失误',
      apply:s=>{ s.chains.intelStage2='accept'; s.pol=clamp(s.pol-3,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale-12,0,100);
        return '你在调查委员会面前说："这是我的判断，责任在我。" 委员会最终结论是"符合流程，但存在改进空间"。你没有被处分，但那份报告永远在你的档案里。'; } },
    { label:'指出流程本身的问题——无人机侦察不足以覆盖地下',
      apply:s=>{ s.chains.intelStage2='system'; s.pol=clamp(s.pol+5,0,100); s.mos=clamp(s.mos+4,0,100); s.morale=clamp(s.morale-8,0,100);
        return '你在委员会上陈述了整个情报流程的结构性缺陷。委员会采纳了你的建议，新的侦察规程被写进了手册。但你个人的责任依然被记录。'; } },
    { label:'保持沉默，让调查自行进行',
      apply:s=>{ s.chains.intelStage2='silent'; s.pol=clamp(s.pol+2,0,100); s.morale=clamp(s.morale-10,0,100);
        return '你没有主动说什么。委员会认定"流程合规"。但你知道——你曾经在签字前犹豫过一秒。那一秒，你永远不会告诉任何人。'; } }
  ]},

{ id:'intel_3', w:0, force:true,
  cond:s=>s.chains.intelStage2 && !s.chains.intelEnd,
  text:'事件过去半年。你的指挥官找你谈话："有人提议把你调离情报岗，去后方做文书。但我觉得你适合继续干。你怎么想？"',
  choices:[
    { label:'留下来，继续做情报分析',
      apply:s=>{ s.chains.intelEnd='stay'; s.mos=clamp(s.mos+5,0,100); s.lead=clamp(s.lead+4,0,100); s.morale=clamp(s.morale+3,0,100);
        return '你说："我需要继续做这件事。" 指挥官点了点头。接下来的每个月，你在签字之前都会花两倍的时间复核。'; } },
    { label:'接受调动，去后方',
      apply:s=>{ s.chains.intelEnd='transfer'; s.pol=clamp(s.pol+4,0,100); s.morale=clamp(s.morale+5,0,100); s.mos=clamp(s.mos-2,0,100);
        return '你选择了后方。新的岗位没有那么多生死——但你偶尔会想起那句"目标区域无平民"。'; } },
    { label:'申请去情报学校深造',
      apply:s=>{ s.chains.intelEnd='school'; s.mos=clamp(s.mos+6,0,100); s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+3,0,100);
        return '你去学校重新学习情报分析。不是为了升职，而是为了理解——为什么会错。'; } }
  ]},

{ id:'intel_4', w:0, force:true,
  cond:s=>s.chains.intelEnd && s.grade>=6,
  text:'你成为情报学校的教官。第一堂课上，你对台下的新学员说："你们分析的不是数字，是人命。每一个坐标背后，都可能有一个家庭。"',
  fx:{mos:+5,lead:+5,pol:+4,morale:+5}, flag:'intel_instructor' },

/* =========================================================
   剧情链条 · 19
   吹哨人（通用，中高级）
   ========================================================= */
{ id:'whistle_1', w:0, force:true,
  cond:s=>(s.track==='E'?s.grade>=6:s.grade>=3) && s.yos>=8 && !s.chains.whistle,
  text:'一次例行装备检查中，你发现某型号装甲车的防护板存在设计缺陷——在特定角度的爆炸冲击下，会向内破裂。这个型号已经部署到前线，最近三个月有三名士兵在类似情况下死亡。你把报告递给了直接上级。',
  choices:[
    { label:'按正常渠道逐级上报',
      apply:s=>{ s.chains.whistle='report'; s.pol=clamp(s.pol+3,0,100); s.lead=clamp(s.lead+2,0,100);
        return '你的报告被一级级转上去。两周后，你收到答复："已收悉，问题正在评估。" 然后，就没有然后了。'; } },
    { label:'直接去找装备司令部的人',
