{ id:'child_1', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age===6 && !c.milestone1) && !s.flags.child1Done,
  text:'你的孩子六岁了，到了上小学的年纪。有一天你回家，看到他在客厅里用积木搭了一个"基地"，还拿着一个玩具兵在"巡逻"。他抬头看见你，问："爸爸，你打仗的时候是什么样子的？"',
  choices:[
    { label:'坐下来，给他讲一个真实的（适合孩子的）故事',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===6 && !x.milestone1);
        if(c){ c.milestone1 = true; c.relation = clamp(c.relation+10, 0, 100); c.militaryInterest = clamp(c.militaryInterest+8, 0, 100); }
        s.morale = clamp(s.morale+5, 0, 100);
        return '你讲了 20 分钟。他听得入迷，眼睛里全是光。那天晚上他不肯睡觉，非要把积木基地再搭高一层。';
      } },
    { label:'说"等你长大了再讲"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===6 && !x.milestone1);
        if(c){ c.milestone1 = true; c.relation = clamp(c.relation-5, 0, 100); }
        return '他有点失望，但没再追问。你看着他继续搭积木，忽然觉得——有些距离，是从这种小事上开始的。';
      } },
    { label:'把玩具兵拿过来，教他怎么"排兵布阵"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===6 && !x.milestone1);
        if(c){ c.milestone1 = true; c.relation = clamp(c.relation+8, 0, 100); c.discipline = clamp(c.discipline+5, 0, 100); c.militaryInterest = clamp(c.militaryInterest+10, 0, 100); }
        s.lead = clamp(s.lead+3, 0, 100);
        return '你把玩具兵排成防御阵型，他认真地听你讲"侧翼"和"火力点"。他母亲在门口看着你们，笑了。';
      } }
  ]},

{ id:'child_2', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age===14 && !c.milestone2) && !s.flags.child2Done,
  text:'孩子十四岁了。一天晚饭时，他忽然说："我不想上大学，我想去当兵。" 配偶的筷子停在半空中，看向你。',
  choices:[
    { label:'支持他——"这是你自己的选择"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===14 && !x.milestone2);
        if(c){ c.milestone2 = true; c.militaryInterest = clamp(c.militaryInterest+20, 0, 100); c.relation = clamp(c.relation+10, 0, 100); }
        s.morale = clamp(s.morale+5, 0, 100);
        return '你放下筷子，说："如果你真的想去，我会支持你。" 他用力点头。你的配偶什么也没说，但晚上她问你："你不担心吗？" 你说："我担心，但我更不想让他后悔。"';
      } },
    { label:'反对——"先去读大学，再想这件事"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===14 && !x.milestone2);
        if(c){ c.milestone2 = true; c.militaryInterest = clamp(c.militaryInterest-15, 0, 100); c.relation = clamp(c.relation-8, 0, 100); c.intelligence = clamp(c.intelligence+5, 0, 100); }
        s.pol = clamp(s.pol+3, 0, 100);
        return '你说："至少读完大学，你会更清楚自己想要什么。" 他没说话，把饭吃完了。之后的几天，他跟你说话明显少了。';
      } },
    { label:'坦白讲清楚这条路有多难',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===14 && !x.milestone2);
        if(c){ c.milestone2 = true; c.militaryInterest = clamp(c.militaryInterest+5, 0, 100); c.relation = clamp(c.relation+5, 0, 100); c.discipline = clamp(c.discipline+5, 0, 100); }
        return '你讲了一个多小时——不是讲荣誉，是讲分离、孤独、失去战友的夜晚。讲完之后你说："如果你还想走，那我支持你。" 他沉默了很久，然后说："我还是想。"';
      } }
  ]},

{ id:'child_3', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age===18 && !c.path) && !s.flags.child3Done,
  text:'孩子十八岁了。他收到了一份征兵办的体检通知。今晚，他坐在你的书房里，手里拿着那张纸，问你："你希望我去吗？"',
  choices:[
    { label:'"这是你的人生，不是我的。"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===18 && !x.path);
        if(c){
          c.path = 'army';
          c.pathYear = s.yos;
          c.armyData = generateChildArmyData(c, s);
        }
        s.flags.child3Done = true;
        s.morale = clamp(s.morale+8, 0, 100);
        addLog(`👦 ${c ? c.name : '你的孩子'} 决定入伍。`, 'good');
        addCareer('milestone', `${c ? c.name : '孩子'}入伍`, '');
        return '他说"好"，然后走了。三个月后，你在新兵训练营的毕业典礼上，穿着正装，站在家长席。他穿着新军装，向你敬了第一个军礼——不是对父亲的，是对军人的。';
      } },
        { label:'"我希望你走自己想走的路。"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===18 && !x.path);
        if(c){
          c.path = c.militaryInterest >= 50 ? 'army' : 'college';
          c.pathYear = s.yos;
          if(c.path === 'army') c.armyData = generateChildArmyData(c, s);
        }
        s.flags.child3Done = true;
        if(c && c.path === 'army'){
          addLog(`👦 ${c.name} 决定入伍。`, 'good');
          addCareer('milestone', `${c.name}入伍`, '');
          return '他想了很久，最后选择了入伍。你说不清自己是骄傲还是担心。';
        } else {
          addLog(`👦 ${c ? c.name : '你的孩子'} 决定上大学。`, 'fx');
          return '他选择了大学。你有点意外，但更多是松了一口气。你说："无论你做什么，爸爸都为你骄傲。"';
        }
      } },
    { label:'"我希望你别去。"',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age===18 && !x.path);
        if(c){
          c.path = 'college';
          c.pathYear = s.yos;
          c.relation = clamp(c.relation-10, 0, 100);
        }
        s.flags.child3Done = true;
        return '他说"好"。三个月后他去了大学。你偶尔会想——如果他去了部队，会是什么样子。但他没去。也许这就是你想要的。';
      } }
  ]},

/* =========================================================
   跨代系统 · 孩子互动事件
   ========================================================= */
{ id:'child_school', w:6, cat:'family',
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age>=8 && c.age<=15),
  text:'孩子的老师给你打电话，说孩子在学校和同学打架了。老师问你："你作为父亲，打算怎么处理？"',
  choices:[
    { label:'严肃批评——动手是不对的',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=8 && x.age<=15);
        if(c){ c.discipline = clamp(c.discipline+4, 0, 100); c.relation = clamp(c.relation-3, 0, 100); }
        return '你和孩子谈了一个小时，他一直低着头。最后他说："我知道了。" 但你不知道他是不是真的知道。';
      } },
    { label:'先问清楚原因——他为什么打人',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=8 && x.age<=15);
        if(c){ c.intelligence = clamp(c.intelligence+3, 0, 100); c.relation = clamp(c.relation+5, 0, 100); }
        return '原来那个同学一直在欺负另一个孩子。你的孩子是"路见不平"。你没有批评他，但告诉他"以后用更好的方式"。';
      } },
    { label:'带着孩子一起去道歉',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=8 && x.age<=15);
        if(c){ c.discipline = clamp(c.discipline+5, 0, 100); c.relation = clamp(c.relation+3, 0, 100); }
        return '你带着孩子去了对方家里。孩子当面道歉了。回来的路上，他问你："爸爸，你以前也打过架吗？" 你说："打过，但后来我学会了不打。"';
      } }
  ]},

{ id:'child_grades', w:6, cat:'family',
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age>=12 && c.age<=17 && c.intelligence>=60),
  text:'孩子的成绩单下来了——全校前十。老师建议你们考虑让孩子将来读军校或名牌大学。',
  choices:[
    { label:'鼓励他考军校',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=12 && x.age<=17);
        if(c){ c.militaryInterest = clamp(c.militaryInterest+10, 0, 100); c.discipline = clamp(c.discipline+5, 0, 100); }
        return '你和孩子聊了一晚上，讲了西点军校、讲了军队的机会和责任。他听完说："我愿意试试。"';
      } },
    { label:'让他自己决定',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=12 && x.age<=17);
        if(c){ c.intelligence = clamp(c.intelligence+4, 0, 100); c.relation = clamp(c.relation+4, 0, 100); }
        return '你说："你想干什么，我和妈妈都支持。" 他想了一会儿，说："我还没想好。" 你说："不急。"';
      } },
    { label:'建议他读普通大学',
      apply:s=>{
        const c = s.spouse.children.find(x=>x.age>=12 && x.age<=17);
        if(c){ c.militaryInterest = clamp(c.militaryInterest-10, 0, 100); c.intelligence = clamp(c.intelligence+5, 0, 100); }
        return '你说："军队太苦，我希望你过更轻松的生活。" 他没说话，但你知道——他有点失落。';
      } }
  ]},

{ id:'child_inherit', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.path==='army' && c.armyData && c.armyData.yearsIn>=5) && !s.flags.childInherited,
  text:'孩子已经服役五年了。一天，他打电话给你，说他被推荐参加 SOF 选拔。他问你："爸，我应该去吗？"',
  choices:[
    { label:'"去。这是你自己的路。"',
      apply:s=>{
        s.flags.childInherited = true;
        const c = s.spouse.children.find(x=>x.path==='army' && x.armyData && x.armyData.yearsIn>=5);
        if(c){
          c.armyData.pt = clamp(c.armyData.pt+5, 0, 100);
          c.armyData.lead = clamp(c.armyData.lead+5, 0, 100);
          c.events.push(`第 ${state.yos} 年 · 参加 SOF 选拔`);
        }
        addLog(`👦 ${c ? c.name : '你的孩子'} 决定参加 SOF 选拔。`, 'good');
        return '电话那头安静了一下，然后他说"谢谢爸"。挂电话之前，你听见他对旁边的人说："我爸支持我。"';
      } },
    { label:'"别去。SOF 太危险。"',
      apply:s=>{
        s.flags.childInherited = true;
        const c = s.spouse.children.find(x=>x.path==='army' && x.armyData && x.armyData.yearsIn>=5);
        if(c){ c.militaryInterest = clamp(c.militaryInterest-15, 0, 100); c.relation = clamp(c.relation-5, 0, 100); }
        return '他说"好"，然后挂了电话。你不知道他会不会真的不去。那晚你没睡好。';
      } },
    { label:'"你自己决定。但无论去哪，都要记住——回来。"',
      apply:s=>{
        s.flags.childInherited = true;
        const c = s.spouse.children.find(x=>x.path==='army' && x.armyData && x.armyData.yearsIn>=5);
        if(c){ c.lead = clamp(c.lead+3, 0, 100); c.relation = clamp(c.relation+5, 0, 100); }
        return '他没说话，但你知道他听懂了。三个月后他告诉你——他报名了。';
      } }
  ]},

{ id:'child_wedding', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.age>=22 && c.age<=30 && !c.married) && !s.flags.childWeddingDone,
  text:'孩子要结婚了。他在电话里说："爸，我希望你能来。"',
  choices:[
    { label:'请假，飞回去参加婚礼',
      apply:s=>{
        s.flags.childWeddingDone = true;
        const c = s.spouse.children.find(x=>x.age>=22 && x.age<=30);
        if(c){ c.married = true; c.relation = clamp(c.relation+15, 0, 100); }
        s.pol = clamp(s.pol-3, 0, 100);
        s.morale = clamp(s.morale+10, 0, 100);
        addLog(`💒 你参加了 ${c ? c.name : '孩子'} 的婚礼。`, 'good');
        return '你飞了 12 个小时赶回去。婚礼上你致辞，说了三分钟。最后你说："我这一生，做过很多决定。最好的一个，是成为你的父亲。"';
      } },
    { label:'打电话祝贺，但说自己赶不回来',
      apply:s=>{
        s.flags.childWeddingDone = true;
        const c = s.spouse.children.find(x=>x.age>=22 && x.age<=30);
        if(c){ c.married = true; c.relation = clamp(c.relation-10, 0, 100); }
        s.pol = clamp(s.pol+3, 0, 100);
        s.morale = clamp(s.morale-8, 0, 100);
        return '你在电话里说了很多祝福的话。挂了之后，你一个人坐在办公室里，很久没动。';
      } }
  ]},

{ id:'child_grandkid', w:0, force:true,
  cond:s=>s.spouse && s.spouse.children && s.spouse.children.some(c=>c.married && c.age>=25 && !c.hasChild) && !s.flags.grandkidDone,
  text:'孩子告诉你一个消息——你要当祖父/外祖父了。',
  fx:{morale:+12,lead:+3,pol:+2}, flag:'has_grandkid' },

   荣誉勋章 · 事件链
   ========================================================= */
{ id:'moh_moment', w:0, force:true,
  cond:s=>s.flags.mohMomentPending,
  text:'任务进行到第 4 个小时。你所在的小队被压制在一处废弃建筑里。敌人的火力点占据三个方向，唯一的撤退通道被机枪封锁。两名战友倒在前方开阔地带，还有呼吸。指挥官在无线电里喊："撤退！立刻撤退！" 但你听见倒地的战友在呼救。',
  choices:[
    { label:'冲出去救他们——哪怕自己回不来',
      apply:s=>{
        s.flags.mohMomentPending = false;
        s.flags.mohChoice = 'hero';
        addLog('你做出了决定。剩下的，交给命运。', 'rank');
        return '你让剩下的弟兄掩护，自己冲进了火网。';
      } },
    { label:'服从命令，带队撤退',
      apply:s=>{
        s.flags.mohMomentPending = false;
        s.flags.mohChoice = 'withdraw';
        s.lead = clamp(s.lead+3, 0, 100);
        s.morale = clamp(s.morale-8, 0, 100);
        addCareer('milestone', '荣誉时刻：服从命令', '带队撤退');
        return '你下达了撤退命令。全队安全撤离，但两名战友没有回来。这个决定会在你心里留很久。';
      } },
    { label:'用无线电呼叫空中支援，自己死守待援',
      apply:s=>{
        s.flags.mohMomentPending = false;
        s.flags.mohChoice = 'hold';
        addLog('你选择死守。等待，或者死亡。', 'rank');
        return '你呼叫了空中支援，告诉所有人"守住位置"。接下来的 20 分钟，你和死亡只隔一条无线电信号。';
      } }
  ]},

{ id:'moh_aftermath_hero', w:0, force:true,
  cond:s=>s.flags.mohChoice === 'hero' && !s.flags.mohAftermath,
  text:'你冲进了火网。子弹擦过你的肩膀，爆炸的气浪把你掀翻在地。你抓起第一个战友，往回拖了 30 米。然后你回头，再次冲了进去。第二次，你被击中了大腿。但你把他拖回来了。',
  choices:[
    { label:'继续——还有一个人在里面',
      apply:s=>{
        s.flags.mohAftermath = true;
        const roll = Math.random();
        if(roll < 0.6){
          // 成功
          s.flags.mohResult = 'success';
          s.medals.push('国会荣誉勋章');
          s.pt = clamp(s.pt-15, 0, 100);
          s.morale = clamp(s.morale+20, 0, 100);
          s.lead = clamp(s.lead+10, 0, 100);
          s.net = clamp(s.net+8, 0, 100);
          s.pol = clamp(s.pol+5, 0, 100);
          addFaction('warrior', 15);
          addFaction('idealist', 10);
          addLog('🏅 你带回了最后一名战友。你被推荐授勋。', 'rank');
          addCareer('milestone', '荣誉时刻：国会荣誉勋章', '冒死救回两名战友');
          return '你第三次冲进火网。这一次，你成功了。直升机到达时，你身上有三处弹伤，但两名战友都还活着。';
        } else if(roll < 0.85){
          // 受伤
          s.flags.mohResult = 'wounded';
          s.medals.push('国会荣誉勋章');
          s.pt = clamp(s.pt-30, 0, 100);
          s.morale = clamp(s.morale+10, 0, 100);
          s.lead = clamp(s.lead+8, 0, 100);
          addFaction('warrior', 15);
          addLog('🏅 你被击中，但活了下来。你被推荐授勋。', 'rank');
          addCareer('milestone', '荣誉时刻：国会荣誉勋章', '重伤救回战友');
          return '你冲进去之后被重创，昏迷了三天。醒来时，医生说："你差点没命。" 你问的第一句话是："他们呢？" 医生说："都活着。" 你闭上了眼睛。';
        } else {
          // 牺牲
          s.flags.mohResult = 'killed';
          s.medals.push('国会荣誉勋章');
          s.flags.retire_early = true;
          s.morale = 100;
          s.lead = clamp(s.lead+15, 0, 100);
          addFaction('warrior', 20);
          addFaction('idealist', 15);
          addLog('🏅 你在任务中牺牲。国会荣誉勋章由家属代领。', 'rank');
          addCareer('milestone', '荣誉时刻：牺牲', '追授国会荣誉勋章');
          return '你第三次冲进去了。这次，你把战友拖出来了——但你自己倒在了离掩体五米的地方。后来，将军把那枚蓝色缎带勋章交到你妻子手里。';
        }
      } },
    { label:'停下来——你已经救了一个，够了',
      apply:s=>{
        s.flags.mohAftermath = true;
        s.flags.mohResult = 'partial';
        s.medals.push('银星勋章');
        s.pt = clamp(s.pt-10, 0, 100);
        s.morale = clamp(s.morale-5, 0, 100);
        s.lead = clamp(s.lead+5, 0, 100);
        addLog('你救回了一个人，但另一个没有回来。', 'warn');
        addCareer('milestone', '荣誉时刻：有限救援', '救回一人，失去一人');
        return '你选择了停下。你救回的那个人跪在地上大哭。你没说话。你知道——有些选择没有对错，只有代价。';
      } }
  ]},

{ id:'moh_aftermath_hold', w:0, force:true,
  cond:s=>s.flags.mohChoice === 'hold' && !s.flags.mohAftermath,
  text:'你死守位置，呼叫空中支援。20 分钟后，A-10 攻击机到达，火力点被摧毁。但在这 20 分钟里，两名倒地的战友没有撑住。',
  choices:[
    { label:'接受结果——你做了正确的战术决策',
      apply:s=>{
        s.flags.mohAftermath = true;
        s.flags.mohResult = 'tactical';
        s.lead = clamp(s.lead+4, 0, 100);
        s.pol = clamp(s.pol+5, 0, 100);
        s.morale = clamp(s.morale-10, 0, 100);
        addLog('你保住了全队，但失去了两名战友。', 'warn');
        addCareer('milestone', '荣誉时刻：战术胜利', '保住全队');
        return '战后报告里写"指挥果断，全队无伤亡"。但你在报告最后加了一句："两名战友未能救回。" 这句话没人要求你写。';
      } },
    { label:'在报告里承认你本来可以做得更多',
      apply:s=>{
        s.flags.mohAftermath = true;

function maxGrade(){
  return state.track==='E'?9:state.track==='W'?5:10;

  if(state.grade>=maxGrade()) return null;

/* =========================================================
   属性 & 效果
   ========================================================= */
function applyFx(fx){
  const parts = [];
  for(const [k,v] of Object.entries(fx)){
    if(STATS.includes(k)){
      const before = state[k];
      state[k] = clamp(state[k]+v, 0, 100);
      if(state._moraleFloor && k==='morale') state[k] = Math.max(state[k], state._moraleFloor);
      const diff = state[k]-before;
      if(diff!==0) parts.push(`${STAT_CN[k]}${diff>0?'+':''}${diff}`);
    }
  }
  return parts.join('  ');
}

function perfScore(){
  const s = state;
  let base = s.pt*0.14 + s.mos*0.24 + s.lead*0.24 + s.pol*0.14 + s.net*0.10 + s.morale*0.14;
  if(s._perfBonus) base += s._perfBonus;
  if(s.flags.sof) base += 4;
  return Math.round(base*10)/10;
}


function doPromote(key){
  const [t,g] = key.split('-');
  state.track = t;
  state.grade = parseInt(g);
  state.tig = 0;
    // 检查 MOS 上限（仅 E 序列）
  if(t==='E' && state.mosCode){
    const cap = getMOSEffectiveCap();
    if(state.grade > cap){
      state.grade = cap; // 兜底，正常不应发生
    }
  }

  state.failStreak = 0;
  state.morale = clamp(state.morale+6, 0, 100);
  addCareer('promotion', `晋升 ${RANK_NAMES[key]}`, `肩章：${RANK_ABBR[key]}`);

  // 转军官 / 准尉时额外奖励
  if(t==='O' && state.grade===1){ state.pol+=3; state.lead+=3; }
  if(t==='W' && state.grade===1){ state.mos+=4; }
}

/* =========================================================
   事件抽取
   ========================================================= */
function pickEvent(){
  // 优先强制事件
  for(const e of EVENTS){
    if(!e) continue;
    if(!e.force) continue;
    if(usedEvents.has(e.id)) continue;
    try{ if(e.cond && !e.cond(state)) continue; }catch(err){ continue; }
    return e;
  }
  // 加权随机
  const pool = EVENTS.filter(e=>{
    if(!e) return false;
    if(e.force) return false;
    if(usedEvents.has(e.id) && !e.repeat) return false;
    try{ return !e.cond || e.cond(state); }catch(err){ return false; }
  });
  if(!pool.length) return null;

  let total = 0;
  const weights = pool.map(e=>{
    let w = (e.w||1);
    w *= getWeightMultiplier(e);
    w *= getRemovalMultiplier(e);
    w *= getWorldWeightMultiplier(e);
    w = Math.max(w, 0.01); // 保底
    total += w;
    return w;
  });
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return pool[i];
  }
  return pool[pool.length-1];
}

    // 3. 领导/政治年度 +1（按路线调整）
    const pathEff = getCareerPathEffects();
    state.lead = clamp(state.lead + 1, 0, 100);
    state.pol = clamp(state.pol + 1, 0, 100);
    if(pathEff.moraleYearly){
      state.morale = clamp(state.morale + pathEff.moraleYearly, 0, 100);
    }
    if(pathEff.mosYearly){
      state.mos = clamp(state.mos + pathEff.mosYearly, 0, 100);
    }

    // 4. 专长年度增长
    const specEff = getSpecialtyEffects();
    for(const [k,v] of Object.entries(specEff.yearlyGain)){
      if(STATS.includes(k)) state[k] = clamp(state[k]+v, 0, 100);
    }

    // 5. 晋升考核
    const check = checkPromoQualification();
    if(check.none){
      // 已到顶
    } else if(check.eligible){
      if(check.auto){
        doPromote(check.next);
        addLog(`▲ 晋升 ——— ${RANK_NAMES[check.next]}（${RANK_ABBR[check.next]}）`, 'rank');
        refreshHud();
        await sleep(320);
      } else {
        await runPromotionFlow(check);
        await sleep(220);
      }
    } else if(check.close){
      addLog(`距离 ${RANK_NAMES[check.next]} 还差：${check.missing.join('、')}`, 'warn');
    }

    // 6. 重置年度标记
    state.yearHadEvent = false;
    state.breakthroughAttemptedThisYear = false;

    // 单位年度评估
    checkCommandYearlyReport();

    // 荣誉勋章判定
    if(checkMOHTrigger()){
      state.flags.mohMomentPending = true;
      state.flags.mohAttempted = true;
      state.flags.mohYear = state.yos;
      addLog('⚔ 一次极端战斗情境正在酝酿……', 'rank');
    }

    state.yearPromoBonus = 0;

    // 孩子军旅成长
    if(state.spouse && state.spouse.children){
      state.spouse.children.forEach(c=>{
        if(c.path === 'army' && c.armyData){
          c.armyData.yearsIn += 1;
          // 属性成长
          c.armyData.pt = clamp(c.armyData.pt + randomInt(1,3), 0, 100);
          c.armyData.mos = clamp(c.armyData.mos + randomInt(1,3), 0, 100);
          c.armyData.lead = clamp(c.armyData.lead + randomInt(0,2), 0, 100);
          c.armyData.pol = clamp(c.armyData.pol + randomInt(0,2), 0, 100);
          // 晋升判定
          const minYears = [0, 0, 2, 3, 5, 8, 12, 16, 21];
          const currentMin = minYears[c.armyData.rank+1] || 999;
          if(c.armyData.yearsIn >= currentMin && c.armyData.rank < 9){
            const score = c.armyData.pt*0.3 + c.armyData.mos*0.3 + c.armyData.lead*0.3 + c.armyData.pol*0.1;
            if(score >= 50 + c.armyData.rank * 3){
              c.armyData.rank += 1;
              c.events.push(`第 ${state.yos} 年 · 晋升 ${RANK_NAMES['E-'+c.armyData.rank]}`);
            }
          }
          // 阵亡判定（概率极低，但存在）
          if(c.armyData.deployed && Math.random() < 0.005){
            c.path = 'killed';
            s.morale = clamp(s.morale-25, 0, 100);
            addLog(`💀 你的孩子 ${c.name} 在部署中阵亡。`, 'bad');
            addCareer('milestone', `${c.name} 阵亡`, '在部署中牺牲');
          }
        }
      });
    }

    // PCS 永久换防（每 3~5 年一次）
    if(state.unit && state.yos >= (state._lastPCS || 0) + 3){
      if(Math.random() < 0.6){
        triggerPCS();
      }
    }

    // 战友年度更新
    if(state.squad){
      const allMembers = [...state.squad.core, ...state.squad.flow];
      allMembers.forEach(m=>{
        m.age += 1;
        if(m.age <= 25 && Math.random() < 0.5){
          m.pt = clamp(m.pt + 1, 0, 100);
          m.mos = clamp(m.mos + 1, 0, 100);
        }
      });

      // 流动战友自然轮换
      const toRemove = [];
      state.squad.flow.forEach((m, i)=>{
        if(Math.random() < 0.20){
          toRemove.push(i);
        }
      });
      toRemove.reverse().forEach(i=>{
        const m = state.squad.flow[i];
        state.squad.memorial.push({
          name: m.name,
          rank: m.rank,
          reason: '调动离开',
          year: state.yos
        });
        addLog(`${m.name} 被调往其他单位，离开了你的小队。`, 'warn');
        state.squad.flow.splice(i, 1);
      });
      while(state.squad.flow.length < 4){
        state.squad.flow.push(generateSquadMember(false, state.squad.flow.length));
      }
    }
  }

  const end = checkEnd();
  if(end){ endGame(end); return; }

    // 月度结算：功勋 + 等级勋章
  settleMonthlyRewards();

  // 处理嘉奖队列（一等功/二等功弹窗）
  await processMedalQueue();

  // 检查待激活的军校资格
  if(state.pendingAcademy > 0 && checkAcademyEligibility() && state.track !== 'O'){
    await processAcademyActivation();
  }

  // 重置月度状态
  state.ap = state.apMax;
  state.usedActionsThisMonth = [];
  renderActions();
  refreshHud();
  renderFinanceLine();
  renderMarriageLine();
  refreshStats();

  // 债务危机弹窗（延迟触发）
  if(state.flags.debtCrisisPending){
    applyDebtCrisis();
  }

  // 自动存档
  saveGame(activeSaveSlot);

  busy = false;
  document.getElementById('btn-next').disabled = false;
}


function monthlyDrift(){
  // 衰减档位：30 岁前 -1，30~34 岁 -2，35 岁+ -3
  let decay = 1;
  if(state.age >= 35) decay = 3;
  else if(state.age >= 30) decay = 2;

  // 五维属性月度衰减
  for(const k of ['pt','mos','lead','pol','net']){
    if(state[k] > 0) state[k] = clamp(state[k] - decay, 0, 100);
  }

  // 士气自然回归（高了回落，低了继续下滑）
  if(state.morale > 70) state.morale = clamp(state.morale - 1, 0, 100);
  if(state.morale < 30) state.morale = clamp(state.morale - 1, 0, 100);

  // NPC 关系月度衰减 -1
  if(state.npcs){
    ['superior','peer','subordinate'].forEach(k=>{
      state.npcs[k].value = clamp(state.npcs[k].value - 1, 0, 100);
    });
    // 关系网联动
    const sup = state.npcs.superior.value;
    const peer = state.npcs.peer.value;
    const sub = state.npcs.subordinate.value;
    if(sup >= 80 && peer <= 40){
      state.npcs.peer.value = clamp(state.npcs.peer.value - 1, 0, 100);
    }
    if(peer >= 80 && sup <= 40){
      state.npcs.superior.value = clamp(state.npcs.superior.value - 1, 0, 100);
    }
    if(sub >= 80 && sup >= 80 && !state.flags.npc_pos_hc){
      state.flags.npc_pos_hc = true;
      state.npcs.superior.value = clamp(state.npcs.superior.value + 3, 0, 100);
      state.npcs.subordinate.value = clamp(state.npcs.subordinate.value + 3, 0, 100);
    }
    if(sub >= 80 && peer >= 80 && !state.flags.npc_pos_rc){
      state.flags.npc_pos_rc = true;
      state.npcs.peer.value = clamp(state.npcs.peer.value + 3, 0, 100);
    }
    if(sup >= 70 && peer >= 70 && sub >= 70 && !hasTag('veteran_of_all')){
      addTag('veteran_of_all');
    }
  }

  // 士气下限保护（专长）
  const specEff = getSpecialtyEffects();
  if(specEff.moraleFloor && state.morale < specEff.moraleFloor){
    state.morale = specEff.moraleFloor;
  }

  // 战友月度衰减
  if(state.squad){
    const allMembers = [...state.squad.core, ...state.squad.flow];
    allMembers.forEach(m=>{
      m.loyalty = clamp(m.loyalty - 1, 0, 100);
      m.morale = clamp(m.morale - 1, 0, 100);
      if(m.age >= 30) m.pt = clamp(m.pt - 1, 0, 100);
    });
  }
}

function checkEnd(){
  if(state.flags.retire_early) return '你主动提交了退役申请，结束了这段军旅生涯。';
  if(state.morale <= 0) return '长期的心理压力终于压垮了你。军医诊断你患有重度创伤后应激障碍，你以医疗原因退役。';
  if(state.failStreak >= 3 && state.yos >= 4) return '连续三次晋升失败。根据"要么晋升要么退伍"（Up or Out）政策，你收到了强制退役通知。';
  if(state.yos >= 35) return '你达到了35年服役上限，正式退役。';
  if(state.age >= 62) return '你达到了法定退役年龄。';
  return null;
}

function renderActions(){
  // 主界面只更新 AP 显示
  const bar = document.getElementById('ap-bar');
  if(bar){
    bar.innerHTML = `第 ${state.yos} 年 ${state.month} 月 · 行动点 <b>${state.ap}</b> / ${state.apMax}`;
  }
  // 如果覆盖层打开，同步刷新
  const overlay = document.getElementById('action-overlay');
  if(overlay && overlay.classList.contains('show')){
    renderActionOverlay();
  }
}

function openActionOverlay(){
  const overlay = document.getElementById('action-overlay');
  const content = document.getElementById('action-content');
  if(!overlay || !content) return;
  overlay.classList.add('show');
  overlay.scrollTop = 0;
  renderActionOverlay();
}

function renderActionOverlay(){
  const content = document.getElementById('action-content');
  if(!content) return;

  let html = `
    <div class="promo-title">行 动</div>
    <div class="promo-sub">第 ${state.yos} 年 ${state.month} 月 · 行动点 ${state.ap} / ${state.apMax}</div>
    <div class="promo-section">选择行动</div>
    <div id="action-grid-overlay" style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px"></div>
  `;
  content.innerHTML = html;

  const grid = document.getElementById('action-grid-overlay');
  ACTIONS.forEach(a=>{
    // 婚姻维护行动：只有恋爱/订婚/已婚时显示
    if(a.id === 'marriage_care'){
      const sp = state.spouse;
      if(!sp || (sp.status !== 'dating' && sp.status !== 'engaged' && sp.status !== 'married')) return;
    }
    const used = state.usedActionsThisMonth.includes(a.id);
    const isRest = a.id === 'rest';
    const b = document.createElement('button');
    b.className = 'act-btn';
    b.style.minHeight = '56px';
    b.innerHTML = `${a.name}<span class="cost">消耗 <b>${a.cost}</b> AP${(used && !isRest) ?' · 本月已用':''}</span>`;
    b.disabled = state.ap < a.cost || state.over || (used && !isRest);
    b.onclick = ()=>{
      doAction(a);
      // 行动后刷新覆盖层
      renderActionOverlay();
    };
    grid.appendChild(b);
  });

  // 破格按钮
  if(canAttemptBreakthrough() && !state.breakthroughAttemptedThisYear && state.ap >= 2){
    const bt = document.createElement('button');
    bt.className = 'act-btn';
    bt.style.gridColumn = '1 / -1';
    bt.style.minHeight = '56px';
    bt.style.borderColor = '#7a6a1a';
    bt.style.color = '#e8d98a';
    bt.innerHTML = `⚡ 争取破格 <span class="cost">消耗全部 AP · 突破 MOS 上限</span>`;
    bt.onclick = ()=>{
      state.ap = 0;
      renderActionOverlay();
      runBreakthrough('active').then(()=>{
        refreshHud();
        refreshStats();
      });
    };
    grid.appendChild(bt);
  }

  // 底部关闭按钮
  const closeBtn = document.createElement('button');
  closeBtn.className = 'promo-btn';
  closeBtn.textContent = '关 闭';
  closeBtn.onclick = ()=>{
    document.getElementById('action-overlay').classList.remove('show');
  };
  content.appendChild(closeBtn);
}

function doAction(a){
  if(state.ap < a.cost || state.over) return;
  if(a.id !== 'rest' && state.usedActionsThisMonth.includes(a.id)) return;
  state.ap -= a.cost;
  if(a.id !== 'rest') state.usedActionsThisMonth.push(a.id);
  const txt = a.run(state);
  addLog(txt, 'fx');
  refreshStats();
  renderActions();
}

function hasInterviewPhase(target){
  const [t,g] = target.split('-'); const n = parseInt(g);
  return (t==='E'&&n>=5)||(t==='W'&&n>=2)||(t==='O'&&n>=3);
}
function getExamPhasesForTarget(target){
  const list = [EXAM_PHASE_POOL.pt,EXAM_PHASE_POOL.mos,EXAM_PHASE_POOL.lead];

  // MOS 专属环节
  if(state.mosCode){
    const map = {
      '11B':'mos_11b','12B':'mos_12b','68W':'mos_68w',
      '35F':'mos_35f','25B':'mos_25b','92Y':'mos_92y','88M':'mos_88m'
    };
    const mk = map[state.mosCode];
    if(mk && EXAM_PHASE_POOL[mk]) list.push(EXAM_PHASE_POOL[mk]);
  }

  // 动态环节 · 按世界状态
  // 技术评审：准尉链完成 或 25B/12B 老兵
  if(state.chains.woEnd || ((state.mosCode==='25B'||state.mosCode==='12B') && state.yos>=10)){
    list.push(EXAM_PHASE_POOL.dynamic_tech_review);
  }
  // 背景审查：有污点标签 或 军事法庭结束
  if(hasTag('compromised') || state.chains.courtEnd){
    list.push(EXAM_PHASE_POOL.dynamic_background);
  }
  // 传承评估：服役 15 年以上 且有传承标签
  if(state.yos>=15 && (hasTag('mentor_legacy') || hasTag('battle_bond') || hasTag('wo_master'))){
    list.push(EXAM_PHASE_POOL.dynamic_legacy);
  }
  // 安全评估：伤亡问责后选择训练改革
  if(state.chains.casualtyEnd==='trainer'){
    list.push(EXAM_PHASE_POOL.dynamic_safety);
  }

  // 面试环节
  if(hasInterviewPhase(target)) list.push(EXAM_PHASE_POOL.interview);

  return list;
}
function resultLabel(r){return {excellent:'优秀',good:'良好',pass:'合格',marginal:'勉强',fail:'不及格'}[r]||r;}
function resultScore(r){return {excellent:4,good:3,pass:2,marginal:1,fail:0}[r]||0;}
function resultFlavor(r){
  return {
    excellent:'你的表现超出了预期，在场所有人都看在眼里。',
    good:'干净利落的完成，没有给任何人留下把柄。',
    pass:'达到了标准，虽然不算出彩，但也无可指摘。',
    marginal:'勉强通过。你能感觉到有人在皱眉。',
    fail:'这一环节砸了。你必须靠后面的环节把分数拉回来。'
  }[r];
}

function checkPromoQualification(){
  const next = nextRankKey();
  if(!next) return {none:true};
  const req = RANK_REQ[next];
  if(!req) return {none:true};

  // MOS 上限检查（仅 E 序列）
  if(state.track === 'E' && state.mosCode){
    const cap = getMOSEffectiveCap();
    const nextGrade = parseInt(next.split('-')[1]);
    if(nextGrade > cap){
      return {
        none:false, eligible:false, close:false, blocked:true,
        next, req, cap,
        missing: [`MOS 自然上限（E-${cap}）`]
      };
    }
  }

  const missing = [];
  if(state.yos < req.tis) missing.push(`服役年限 ${state.yos}/${req.tis} 年`);
  if(state.tig < req.tig) missing.push(`衔龄 ${state.tig}/${req.tig} 年`);
  for(const [k,v] of Object.entries(req.min||{})){
    if(state[k] < v) missing.push(`${STAT_CN[k]} ${Math.round(state[k])}/${v}`);
  }

  if(next==='E-2' && missing.length===0){
    return {eligible:true,auto:true,next,req};
  }
  return {
    eligible: missing.length===0,
    close: missing.length>0 && missing.length<=2,
    missing, next, req
  };
}

async function runPromotionFlow(check){
  return new Promise(resolve=>{
    promoFlow = {
      step:'qualify',
      target:check.next,
      req:check.req,
      prepChoices:[],
      phases:null,
      currentPhase:0,
      results:[],
      hiddenMod: ((state._promoBonus||0)+(state.yearPromoBonus||0))*15 + npcMods().superior + ((getCurrentWorldState().promoBonus||0) * 20) + (getCareerPathEffects().promoMult - 1) * 20,
      resolve
    };
    state.examTarget = EXAM_TARGETS[check.next] || 60;
    state.examPrep = {};
    renderPromoOverlay();
  });
}

function renderPromoOverlay(){
  const overlay = document.getElementById('promo-overlay');
  const content = document.getElementById('promo-content');
  overlay.classList.add('show');
  overlay.scrollTop = 0;

  switch(promoFlow.step){
    case 'qualify':
      content.innerHTML = renderQualifyHTML();
      document.getElementById('promo-next-btn').onclick = ()=>{
        promoFlow.step='prepare'; renderPromoOverlay();
      };
      break;
    case 'prepare':
      content.innerHTML = renderPrepareHTML();
      bindPrepareEvents();
      break;
    case 'exam':
      content.innerHTML = renderExamHTML();
      bindExamEvents();
      break;
    case 'phaseResult':
      content.innerHTML = renderPhaseResultHTML();
      bindPhaseResultEvents();
      break;
    case 'result':
      content.innerHTML = renderResultHTML();
      bindResultEvents();
      break;
  }
}

  let html = `
    <div class="promo-title">晋 升 资 格 审 查</div>

    <div class="promo-section">资格条件</div>

    html += checkItem(STAT_CN[k],state[k],v);

    </div>
    <button class="promo-btn" id="promo-next-btn">提 交 晋 升 申 请</button>

    <div class="promo-section">选择 ${need} 项针对性准备</div>

  PREP_OPTIONS.forEach(opt=>{

function bindPrepareEvents(){
  document.querySelectorAll('[data-prep]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.prep;
      const idx = promoFlow.prepChoices.indexOf(id);
      if(idx>=0){ promoFlow.prepChoices.splice(idx,1); }
      else if(promoFlow.prepChoices.length < 2){ promoFlow.prepChoices.push(id); }
      else { promoFlow.prepChoices.shift(); promoFlow.prepChoices.push(id); }
      renderPromoOverlay();
    };
  });
  const start = document.getElementById('promo-start-exam');
  if(start){
    start.onclick = ()=>{
      // 应用准备效果
      promoFlow.prepChoices.forEach(id=>{
        const opt = PREP_OPTIONS.find(o=>o.id===id);
        if(opt.target==='morale'){
          state.morale = clamp(state.morale+opt.bonus,0,100);
        } else {
          state.examPrep[opt.target] = (state.examPrep[opt.target]||0) + opt.bonus;
        }
        state.morale = clamp(state.morale+opt.morale,0,100);
      });
      promoFlow.phases = getExamPhasesForTarget(promoFlow.target);
      promoFlow.currentPhase = 0;
      promoFlow.results = [];
      promoFlow.step = 'exam';
      renderPromoOverlay();
    };
  }
}

function renderExamHTML(){
  const phase = promoFlow.phases[promoFlow.currentPhase];
  const total = promoFlow.phases.length;
  let html = `
    <div class="promo-title">晋 升 考 核</div>
    <div class="promo-sub">环节 ${promoFlow.currentPhase+1} / ${total} · ${phase.name}</div>
  `;
  // 已完成的环节成绩
  promoFlow.results.forEach(r=>{
    html += `<div class="result-line result-${r.result}">${r.phaseName}：${resultLabel(r.result)}（${resultScore(r.result)} 分）</div>`;
  });
  // 当前环节
  html += `
    <div class="promo-phase">
      <div class="phase-name">${phase.name}</div>
      <div class="phase-desc">${phase.text}</div>
      ${phase.options.map((o,i)=>`
        <button class="phase-choice" data-idx="${i}">
          ${o.label}
          <span class="hint">${o.hint||''}</span>
        </button>
      `).join('')}
    </div>
  `;
  return html;
}

function executeExamChoice(choiceIdx){
  const phase = promoFlow.phases[promoFlow.currentPhase];
  const choice = phase.options[choiceIdx];
  const attrVal = state[phase.attr] || 0;
  const prep = state.examPrep[phase.id] || 0;
  const hidden = promoFlow.hiddenMod || 0;
  const roll = Math.random()*20 - 10;
  const specBonus = getSpecialtyEffects().examBonus[phase.id] || 0;
  // 政治站队中立派 → 面试难度 +15%（判定值降低）
  let interviewPenalty = 0;
  if(phase.id==='interview'){
    if(state.chains.politics==='neutral') interviewPenalty -= 5;
    const npcMod = npcMods();
    if(npcMod){
      interviewPenalty += (NPC_PROFILES.peer.contextMult.interview - 1) * (npcMod.peer || 0) * 0.5;
      interviewPenalty += (NPC_PROFILES.superior.contextMult.interview - 1) * (npcMod.superior || 0) * 0.5;
      interviewPenalty += (NPC_PROFILES.technician.contextMult.interview - 1) * (npcMod.technician || 0) * 0.5;
    }
    // 派系加成：立场与评委团一致 → +N
    if(state.factions){
      interviewPenalty += getFactionMedalBonus('warrior');
      interviewPenalty += getFactionMedalBonus('intellect');
      interviewPenalty += getFactionMedalBonus('pragmatist');
      interviewPenalty += getFactionMedalBonus('idealist');
    }
    // 单位评分加成
    if(state.command && state.command.active){
      const c = state.command;
      const cmdScore = (c.morale + c.training + c.equipment) / 3 * (5 - c.readiness) / 4;
      if(cmdScore >= 80) interviewPenalty += 3;
      else if(cmdScore < 40) interviewPenalty -= 3;
    }
  }
  // 改革状态 → 考核难度提高（判定值降低）
  const reformPenalty = (getCurrentWorldState().examDifficulty || 0);
  const total = attrVal + prep + hidden + (choice.mod||0) + specBonus + interviewPenalty - reformPenalty + roll;
  const target = state.examTarget;

  let result;
  if(total >= target+20) result='excellent';
  else if(total >= target+8) result='good';
  else if(total >= target) result='pass';
  else if(total >= target-12) result='marginal';
  else result='fail';

  if(choice.morale) state.morale = clamp(state.morale+choice.morale,0,100);
  if(choice.nextBonus && promoFlow.currentPhase+1 < promoFlow.phases.length){
    const nxt = promoFlow.phases[promoFlow.currentPhase+1];
    state.examPrep[nxt.id] = (state.examPrep[nxt.id]||0) + choice.nextBonus;
  }

  promoFlow.lastResult = {
    phaseName: phase.name,
    result,
    total: Math.round(total),
    choiceLabel: choice.label
  };
  promoFlow.results.push(promoFlow.lastResult);
  promoFlow.step = 'phaseResult';
  renderPromoOverlay();
}

function renderPhaseResultHTML(){
  const r = promoFlow.lastResult;
  const isLast = promoFlow.currentPhase+1 >= promoFlow.phases.length;
  return `
    <div class="promo-title">环 节 结 果</div>
    <div class="promo-sub">${r.phaseName}</div>
    <div class="promo-phase">
      <div class="phase-name">你选择了：${r.choiceLabel}</div>
      <div class="result-line result-${r.result}">
        ${resultLabel(r.result)}　（判定值 ${r.total} / 目标 ${state.examTarget}）
      </div>
      <div style="color:#94a878;font-size:12px;line-height:1.7;margin-top:8px">
        ${resultFlavor(r.result)}
      </div>
    </div>
    <button class="promo-btn" id="promo-continue">
      ${isLast?'查 看 最 终 结 果':'进 入 下 一 环 节'}
    </button>
  `;
}

function bindPhaseResultEvents(){
  document.getElementById('promo-continue').onclick = ()=>{
    promoFlow.currentPhase++;
    if(promoFlow.currentPhase >= promoFlow.phases.length){
      promoFlow.step = 'result';
    } else {
      promoFlow.step = 'exam';
    }
    renderPromoOverlay();
  };

function renderResultHTML(){
  const totalScore = promoFlow.results.reduce((s,r)=>s+resultScore(r.result),0);
  const maxScore = promoFlow.results.length * 4;
  const threshold = promoFlow.results.length * 2.25;
  const passed = totalScore >= threshold;

  promoFlow._passed = passed;
  return html;
}

function checkSOFTrigger(){
  if(state.flags.sof || state.flags.sof_rejected) return null;
  if(state.track !== 'E') return null;
  // 第一窗口：E-3 ~ E-4，服役 3~4 年
  if(!state.flags.sof_attempted
     && state.grade >= 3 && state.grade <= 4
     && state.yos >= 3 && state.yos <= 4
     && state.pt >= 72 && state.mos >= 62){
    return 'first';
  }
  // 第二窗口：E-5 ~ E-6，服役 6~7 年（最后机会）
  if(!state.flags.sof2_attempted
     && state.grade >= 5 && state.grade <= 6
     && state.yos >= 6 && state.yos <= 7
     && state.pt >= 78 && state.mos >= 70){
    return 'second';
  }
  return null;
}

async function runSOFSelection(windowType){
  return new Promise(resolve=>{
    sofFlow = {
      step:'brief',
      window:windowType,
      currentPhase:0,
      results:[],
      failCount:0,
      target: windowType==='first' ? 70 : 76,
      hiddenMod: npcMods().superior * NPC_PROFILES.superior.contextMult.sof
              + npcMods().peer * NPC_PROFILES.peer.contextMult.sof
              + npcMods().subordinate * NPC_PROFILES.subordinate.contextMult.sof,
      resolve
    };
    if(windowType==='first') state.flags.sof_attempted = true;
    else state.flags.sof2_attempted = true;
    renderSOFOverlay();
  });
}

function renderSOFOverlay(){
  const overlay = document.getElementById('promo-overlay');
  const content = document.getElementById('promo-content');
  overlay.classList.add('show');
  overlay.scrollTop = 0;

  switch(sofFlow.step){
    case 'brief':
      content.innerHTML = renderSOFBriefHTML();
      document.getElementById('sof-start-btn').onclick = ()=>{
        sofFlow.step = 'exam';
        renderSOFOverlay();

      break;
    case 'exam':
      content.innerHTML = renderSOFExamHTML();
      bindSOFExamEvents();
      break;
    case 'result':
      content.innerHTML = renderSOFResultHTML();
      bindSOFResultEvents();

  }

function executeSOFChoice(idx){
  const phase = SOF_PHASES[sofFlow.currentPhase];
  const choice = phase.options[idx];
  const attrVal = state[phase.attr] || 0;
  const roll = Math.random()*20 - 10;
  const specBonus = getSpecialtyEffects().sofBonus[phase.id] || 0;
  const total = attrVal + (choice.mod||0) + roll + sofFlow.hiddenMod + specBonus;
  const target = sofFlow.target;

  let result;
  if(total >= target+22) result='excellent';
  else if(total >= target+10) result='good';
  else if(total >= target) result='pass';
  else if(total >= target-14) result='marginal';
  else result='fail';

  if(choice.morale) state.morale = clamp(state.morale+choice.morale, 0, 100);
  if(choice.leadBonus) state.lead = clamp(state.lead+choice.leadBonus, 0, 100);
  if(choice.nextBonus && sofFlow.currentPhase+1 < SOF_PHASES.length){
    sofFlow.hiddenMod += choice.nextBonus;
  }

  if(result === 'fail') sofFlow.failCount++;

  sofFlow.results.push({
    phaseName: phase.name,
    result,
    choiceLabel: choice.label
  });

  if(sofFlow.failCount >= 2){
    sofFlow.step = 'result';
    sofFlow._eliminated = true;
    renderSOFOverlay();
    return;
  }

  sofFlow.currentPhase++;
  if(sofFlow.currentPhase >= SOF_PHASES.length){
    sofFlow.step = 'result';
  }
  renderSOFOverlay();
}

    </div>`;
  } else if(eliminated){
    html += `<div class="sof-fail">淘 汰</div>`;

  }
  html += `<button class="promo-btn" id="sof-close-btn">确 定</button>`;

function checkDeployTrigger(){
  if(state.track!=='E' && state.track!=='W' && state.track!=='O') return null;
  if(state.yos < 2) return null;
  if(state.flags.in_deploy) return null;
  // 至少 25% 概率触发；军龄越长越容易
  let chance = 0.22 + Math.min(state.yos * 0.01, 0.15);
  chance *= getCareerPathEffects().deployMult;
  const w = getCurrentWorldState();
  if(w.deployMult) chance *= w.deployMult;
  if(w.id === 'peace') chance *= 0.5;
  if(Math.random() > chance) return null;
  // 筛选可用任务
  const eligible = DEPLOY_MISSIONS.filter(m=>{
    try{ return m.eligible(state); }catch(e){ return false; }
  });
  if(!eligible.length) return null;
  return eligible[Math.floor(Math.random()*eligible.length)];
}

function checkDeployTriggerForce(){
  if(state.track!=='E' && state.track!=='W' && state.track!=='O') return null;
  if(state.yos < 2) return null;
  if(state.flags.in_deploy) return null;
  if(Math.random() > getCareerPathEffects().deployMult / 1.2) return null;
  const eligible = DEPLOY_MISSIONS.filter(m=>{
    try{ return m.eligible(state); }catch(e){ return false; }
  });
  if(!eligible.length) return null;
  return eligible[Math.floor(Math.random()*eligible.length)];
}

function getDeployTypeMult(missionId){
  const profile = NPC_PROFILES.subordinate;
  if(!profile.deployTypeMult) return 1.0;
  return profile.deployTypeMult[missionId] || 1.0;
}

function pickSquadForDeployment(){
  if(!state.squad) return [];
  const allMembers = [...state.squad.core, ...state.squad.flow];
  if(!allMembers.length) return [];
  const shuffled = [...allMembers].sort(()=>Math.random()-0.5);
  return shuffled.slice(0, Math.min(2, shuffled.length));
}

function pickDeployLocation(mission){
  const deployLocs = ['arifjan','iraq','syria','eastafrica'];
  if(mission.id === 'humanitarian') return LOCATIONS['eastafrica'];
  if(mission.id === 'sof_recon') return LOCATIONS['syria'];
  if(mission.id === 'patrol' || mission.id === 'mos_11b_assault') return LOCATIONS['iraq'];
  if(mission.id === 'convoy' || mission.id === 'mos_92y_hub') return LOCATIONS['arifjan'];
  return LOCATIONS[deployLocs[Math.floor(Math.random()*deployLocs.length)]];
}

async function runDeployment(mission){
  return new Promise(resolve=>{
    deployFlow = {
      step:'brief',
      mission,
      squadMembers: pickSquadForDeployment(),
      deployLocation: pickDeployLocation(mission),
      currentPhase:0,
      totalScore:0,
      subBonus: Math.round(npcMods().subordinate * getDeployTypeMult(mission.id)),
      maxScore:mission.phases.length * 5,
      choices:[],
      resolve
    };
    state.flags.in_deploy = true;
    state.deployedLocation = deployFlow.deployLocation || null;
    renderDeployOverlay();
  });
}

function renderDeployOverlay(){
  const overlay = document.getElementById('promo-overlay');
  const content = document.getElementById('promo-content');
  overlay.classList.add('show');
  overlay.scrollTop = 0;

  switch(deployFlow.step){
    case 'brief':
      content.innerHTML = renderDeployBriefHTML();
      document.getElementById('deploy-start-btn').onclick = ()=>{
        deployFlow.step = 'phase';
        renderDeployOverlay();
      };
      break;
    case 'phase':
      content.innerHTML = renderDeployPhaseHTML();
      bindDeployPhaseEvents();
      break;
    case 'result':
      content.innerHTML = renderDeployResultHTML();
      bindDeployResultEvents();
      break;
  }
}

function renderDeployPhaseHTML(){
  const m = deployFlow.mission;
  const phase = m.phases[deployFlow.currentPhase];
  const total = m.phases.length;
  let html = `
    <div class="deploy-header">
      <div class="promo-title">部 署 任 务</div>
      <div class="deploy-meta">${m.name} · 环节 ${deployFlow.currentPhase+1} / ${total}</div>
      <div class="deploy-status ${m.riskCls}">风险等级 · ${m.risk}</div>
    </div>
  `;
  // 已完成的叙事行
  if(deployFlow.choices.length){
    deployFlow.choices.forEach(c=>{
      html += `<div class="deploy-narr" style="border-left-color:#6d9440;color:#b6cc8a">${c}</div>`;
    });
  }
  html += `
    <div class="promo-phase">
      <div class="phase-name">${phase.name}</div>
      <div class="phase-desc">${phase.text}</div>
      ${phase.options.map((o,i)=>`
        <button class="phase-choice" data-deploy-idx="${i}">
          ${o.label}
          <span class="hint">${o.hint||''}</span>
        </button>
      `).join('')}
    </div>
    <button class="sof-dor" id="deploy-withdraw-btn">撤 出 任 务</button>
  `;
  return html;
}

function bindDeployPhaseEvents(){
  document.querySelectorAll('.phase-choice[data-deploy-idx]').forEach(btn=>{
    btn.onclick = ()=> executeDeployChoice(parseInt(btn.dataset.deployIdx));
  });
  document.getElementById('deploy-withdraw-btn').onclick = ()=>{
    if(confirm('确认撤出任务？\n\n撤退意味着任务失败，会留下记录。')){
      doWithdraw();
    }
  };
}

function executeDeployChoice(idx){
  const m = deployFlow.mission;
  const phase = m.phases[deployFlow.currentPhase];
  const choice = phase.options[idx];

  // 累积分数 + 应用属性
  const specEff = getSpecialtyEffects();
  const missionId = deployFlow.mission.id;
  let specBonus = specEff.deployBonus[missionId] || 0;
  if(specEff.deployBonus['any']) specBonus += specEff.deployBonus['any'];
  deployFlow.totalScore += (choice.score || 0);
  if(!deployFlow.specAccum) deployFlow.specAccum = 0;
  // 不每个环节都加，只在总分结算时加一次
  if(choice.fx){
    for(const [k,v] of Object.entries(choice.fx)){
      if(STATS.includes(k)) state[k] = clamp(state[k]+v, 0, 100);
    }
  }
  // 叙事反馈（非数字，只是情境描述）
  const narrMap = {
    5:'进展非常顺利。',
    4:'情况在掌控之中。',
    3:'按计划推进。',
    2:'略有波折，但还能应付。',
    1:'情况不太妙。',
    0:'你感觉到事情正在往坏的方向发展。'
  };
  deployFlow.choices.push(narrMap[choice.score] || '继续推进。');

  refreshStats();

  deployFlow.currentPhase++;
  if(deployFlow.currentPhase >= m.phases.length){
    deployFlow.step = 'result';
  }
  renderDeployOverlay();
}

function renderDeployResultHTML(){
  const m = deployFlow.mission;

  // 战友加成
  let squadBonus = 0;
  if(deployFlow.squadMembers && deployFlow.squadMembers.length){
    const avgPT = deployFlow.squadMembers.reduce((s,x)=>s+x.pt,0) / deployFlow.squadMembers.length;
    const avgMOS = deployFlow.squadMembers.reduce((s,x)=>s+x.mos,0) / deployFlow.squadMembers.length;
    squadBonus = Math.round((avgPT + avgMOS) / 20);
  }

  // 单位加成
  let commandBonus = 0;
  if(state.command && state.command.active){
    const c = state.command;
    commandBonus = Math.min(Math.round((c.morale + c.training + c.equipment) / 30), 10);
  }

  const specEff = getSpecialtyEffects();
  const missionId = deployFlow.mission.id;
  let specBonus = specEff.deployBonus[missionId] || 0;
  if(specEff.deployBonus['any']) specBonus += specEff.deployBonus['any'];
  const totalScore = deployFlow.totalScore + (deployFlow.subBonus || 0) + specBonus + squadBonus + commandBonus;
  const safeBuffer = specEff.deploySafeBuffer || 0;

  const effectiveScore = totalScore + safeBuffer;
  const ratio = Math.min(effectiveScore / deployFlow.maxScore, 1.0);
  const maxScore = deployFlow.maxScore;

  let tier, tierCls, tierName, narrative;
  if(ratio >= 0.85){
    tier='excellent'; tierCls='result-excellent'; tierName='出色完成';
    narrative='任务圆满完成，甚至超出了上级的预期。你的名字被写进了本季度的战报。';
  } else if(ratio >= 0.65){
    tier='good'; tierCls='result-good'; tierName='成功';
    narrative='任务达成。没有意外，也没有惊喜，这就是专业。';
  } else if(ratio >= 0.45){
    tier='pass'; tierCls='result-pass'; tierName='勉强完成';
    narrative='任务完成了，但代价比预想中高。有些环节你可以做得更好。';
  } else if(ratio >= 0.25){
    tier='marginal'; tierCls='result-marginal'; tierName='部分失败';
    narrative='任务目标部分未达成。上级要求你提交一份详细复盘报告。';
  } else {
    tier='fail'; tierCls='result-fail'; tierName='失败';
    narrative='任务失败。有人员伤亡，装备也有损失。你必须在调查委员会面前解释整个过程。';
  }

  let html = `
    <div class="deploy-header">
      <div class="promo-title">任 务 结 果</div>
      <div class="deploy-meta">${m.name}</div>
      <div class="deploy-status ${m.riskCls}">风险等级 · ${m.risk}</div>
    </div>
    <div class="promo-section">任务总评</div>
    <div class="promo-item">
      <span>累积得分</span>
      <span style="color:${ratio>=0.65?'#9dd96a':ratio>=0.45?'#c9a227':'#d95a4a'};font-weight:700">${totalScore} / ${maxScore}</span>
    </div>
    ${squadBonus > 0 ? `<div class="promo-item"><span>战友加成</span><span style="color:#8fbf55">+${squadBonus}</span></div>` : ''}
    ${commandBonus > 0 ? `<div class="promo-item"><span>单位加成</span><span style="color:#8fbf55">+${commandBonus}</span></div>` : ''}
    <div class="promo-item">
      <span>完成度</span>
      <span>${Math.round(ratio*100)}%</span>
    </div>
    <div class="result-line ${tierCls}" style="margin-top:14px;font-size:14px;font-weight:700;text-align:center">
      ${tierName}
    </div>
    <div class="deploy-narr" style="margin-top:10px">${narrative}</div>
  `;

  deployFlow._tier = tier;
  deployFlow._ratio = ratio;
  html += `<button class="promo-btn" id="deploy-close-btn">确 定</button>`;
  return html;
}

function bindDeployResultEvents(){
  document.getElementById('deploy-close-btn').onclick = ()=>{
    document.getElementById('promo-overlay').classList.remove('show');
    const m = deployFlow.mission;
    const tier = deployFlow._tier;
    const ratio = deployFlow._ratio;
    const resolve = deployFlow.resolve;
    const squadMembers = deployFlow.squadMembers || [];
    deployFlow = null;
    state.flags.in_deploy = false;
    state.deployedLocation = null;

    // 应用成功收益
    const s = m.success;
    let scale = 0;
    if(tier==='excellent') scale = 1.2;
    else if(tier==='good') scale = 0.9;
    else if(tier==='pass') scale = 0.5;
    else if(tier==='marginal') scale = 0.2;
    else scale = 0;

    const gains = [];
    for(const [k,v] of Object.entries(s)){
      if(!STATS.includes(k)) continue;
      const delta = Math.round(v * scale);
      if(delta === 0) continue;
      state[k] = clamp(state[k]+delta, 0, 100);
      gains.push(`${STAT_CN[k]}${delta>0?'+':''}${delta}`);
    }

    // 失败惩罚
    let penaltyLog = '';
    if(tier==='marginal' || tier==='fail'){
      const half = getSpecialtyEffects().deployCasualtyHalf;
      const mPen = half ? 4 : 8;
      const pPen = half ? 2 : 4;
      state.morale = clamp(state.morale-mPen, 0, 100);
      state.pt = clamp(state.pt-pPen, 0, 100);
      penaltyLog = `士气 -${mPen}　体能 -${pPen}${half?'（战地医师减半）':''}`;
    }

    // 勋章（带兵路线加成）
    const medalMult = getCareerPathEffects().medalMult;
    const medalRoll = Math.random() < medalMult;
    if((tier==='excellent' || tier==='good') && m.medal && medalRoll){
      addMedal(m.medal);
    }

    // 等级勋章
    if(tier === 'excellent') addRankMedal('first');
    else if(tier === 'good') addRankMedal('second');
    else if(tier === 'pass') addRankMedal('third');

    // 晋升加分
    const bonusMap = {excellent:0.12, good:0.06, pass:0.02, marginal:0, fail:-0.05};
    state.yearPromoBonus = (state.yearPromoBonus||0) + (bonusMap[tier]||0);

    // 战友伤亡判定
    const casualties = [];
    squadMembers.forEach(m2=>{
      let fate = 'safe';
      const r = Math.random();
      if(tier === 'fail'){
        if(r < 0.30) fate = 'killed';
        else if(r < 0.70) fate = 'injured';
      } else if(tier === 'marginal'){
        if(r < 0.15) fate = 'killed';
        else if(r < 0.45) fate = 'injured';
      } else if(tier === 'pass'){
        if(r < 0.10) fate = 'injured';
      } else if(tier === 'good'){
        if(r < 0.05) fate = 'injured';
      }

      const current = getSquadMember(m2.id);
      if(!current) return;

      if(fate === 'killed'){
        current.events.push(`第 ${state.yos} 年 ${state.month} 月 · 阵亡于「${m.name}」`);
        casualties.push({ name: current.name, fate: 'killed', mission: m.name });
        removeSquadMember(current, `阵亡于「${m.name}」`);
      } else if(fate === 'injured'){
        current.pt = clamp(current.pt - 8, 0, 100);
        current.morale = clamp(current.morale - 5, 0, 100);
        current.events.push(`第 ${state.yos} 年 ${state.month} 月 · 在「${m.name}」中负伤`);
        casualties.push({ name: current.name, fate: 'injured', mission: m.name });
      } else {
        current.events.push(`第 ${state.yos} 年 ${state.month} 月 · 参与「${m.name}」`);
      }
    });

    // 日志
    addCareer('deploy', `部署任务：${m.name} · ${tierNameOf(tier)}`, `完成度 ${Math.round(ratio*100)}%`);
    addLog(`◆ 部署任务：${m.name} — ${tierNameOf(tier)}`, tier==='fail'||tier==='marginal'?'bad':'good');
    if(gains.length) addLog(gains.join('　'), 'fx');
    if(penaltyLog) addLog(penaltyLog, 'warn');
    if(m.medal && (tier==='excellent'||tier==='good')) addLog(`获得勋章：${m.medal}`, 'good');
    if(bonusMap[tier] > 0) addLog(`本年晋升几率 +${Math.round(bonusMap[tier]*100)}%`, 'good');

    // 伤亡日志
    casualties.forEach(c=>{
      if(c.fate === 'killed'){
        addLog(`💀 ${c.name} 在「${c.mission}」中阵亡。`, 'bad');
      } else {
        addLog(`🩸 ${c.name} 在「${c.mission}」中负伤。体能 -8，士气 -5`, 'warn');
      }
    });

    refreshHud();
    refreshStats();
    resolve();
  };
}

function tierNameOf(t){
  return {excellent:'出色完成', good:'成功', pass:'勉强完成', marginal:'部分失败', fail:'失败'}[t]||'结束';
}

function doWithdraw(){
  document.getElementById('promo-overlay').classList.remove('show');

  const m = deployFlow.mission;
  deployFlow = null;
  state.flags.in_deploy = false;
  state.deployedLocation = null;

  addCareer('deploy', `部署任务：${m.name} · 中途撤出`, '');

}

    let hint = a.hint;
    if(a.id === 'train' && isTrainingCenter) hint += '（训练中心 +2）';
    if(a.id === 'rally' && isCombatUnit) hint += '（战斗部队 +2）';
    if(a.id === 'maintain' && state.location && state.location._key === 'meade') hint += '（后勤基地 +2）';
    b.innerHTML = `${a.name}<span class="cost">消耗 <b>${a.cost}</b> AP · ${hint}</span>`;
    b.disabled = cmd.ap < a.cost || disabledByDeploy;
    if(disabledByDeploy) b.innerHTML += `<span class="cost" style="color:#d95a4a">部署期间不可用</span>`;
    b.onclick = ()=> executeCommandAction(a);
    grid.appendChild(b);
  });
}

function executeCommandAction(a){
  const cmd = state.command;
  if(!cmd || cmd.ap < a.cost) return;
  cmd.ap -= a.cost;
  let result = a.run(cmd);

  // 驻地额外加成
  const locKey = state.location && state.location._key;
  if(a.id === 'train' && ['benning','bliss','riley','stewart'].includes(locKey)){
    cmd.training = clamp(cmd.training+2, 0, 100);
    result += '　训练中心 +2';
  }
  if(a.id === 'rally' && ['bragg','campbell','hood','drum','lewis'].includes(locKey)){
    cmd.morale = clamp(cmd.morale+2, 0, 100);
    result += '　战斗部队 +2';
  }
  if(a.id === 'maintain' && locKey === 'meade'){
    cmd.equipment = clamp(cmd.equipment+2, 0, 100);
    result += '　后勤基地 +2';
  }

  addLog(result, 'fx');
  refreshStats();
  renderCommandActions();
}

  const sp = state.spouse;
  if(!sp || !sp.children || !sp.children[childDetailIdx]) return;

    addLog(`你陪了 ${c.name} 一会儿。亲密度 +5，士气 +2`, 'fx');
  } else if(action === 'teach'){
    if(state.ap < 1) return;
    state.ap -= 1;
    c.intelligence = clamp(c.intelligence + 2, 0, 100);
    c.discipline = clamp(c.discipline + 2, 0, 100);
    c.relation = clamp(c.relation + 3, 0, 100);
    addLog(`你教导 ${c.name}。智力 +2，纪律 +2，亲密度 +3`, 'fx');
  } else if(action === 'story'){
    if(state.ap < 1) return;
    state.ap -= 1;
    c.militaryInterest = clamp(c.militaryInterest + 5, 0, 100);
    c.relation = clamp(c.relation + 3, 0, 100);
    addLog(`你给 ${c.name} 讲了一个军旅故事。军事兴趣 +5，亲密度 +3`, 'fx');
  } else if(action === 'career_advice'){
    if(state.ap < 2) return;
    state.ap -= 2;
    if(c.armyData){
      c.armyData.lead = clamp(c.armyData.lead + 3, 0, 100);
      c.armyData.pol = clamp(c.armyData.pol + 3, 0, 100);

    addLog(`你给孩子做了职业指导。孩子领导/政治 +3，亲密度 +5`, 'fx');
  }

  refreshHud();
  refreshStats();
  renderActions();
  renderChildDetail();
}

function removeSquadMember(member, reason){
  if(!state.squad) return;
  let idx = state.squad.core.findIndex(m=>m.id===member.id);
  let isCore = idx >= 0;
  if(!isCore){
    idx = state.squad.flow.findIndex(m=>m.id===member.id);
  }
  if(idx < 0) return;

  if(isCore){
    state.squad.core.splice(idx, 1);
  } else {
    state.squad.flow.splice(idx, 1);
  }

  state.squad.memorial.push({
    name: member.name,
    rank: member.isOfficer ? member.officerRank : member.rank,
    reason: reason,
    year: state.yos
  });

  if(reason.includes('阵亡')){
    state.morale = clamp(state.morale - 10, 0, 100);
    addLog(`💀 ${member.name} 在任务中阵亡。`, 'bad');
    addLog('士气 -10', 'warn');
    addCareer('milestone', `${member.name} 阵亡`, reason);
  } else {
    addLog(`${member.name} 离开了你的小队（${reason}）。`, 'warn');
    addCareer('milestone', `${member.name} 离开`, reason);
  }
}

async function executeSquadAction(action){
  const m = getSquadMember(squadDetailId);
  if(!m) return;

  if(action === 'train'){
    if(state.ap < 1){ addLog('AP 不足。', 'warn'); return; }
    state.ap -= 1;
    m.pt = clamp(m.pt + 2, 0, 100);
    m.mos = clamp(m.mos + 2, 0, 100);
    m.loyalty = clamp(m.loyalty + 1, 0, 100);
    addLog(`你带训了 ${m.name}。体能 +2，专业 +2，忠诚 +1`, 'fx');
  } else if(action === 'talk'){
    if(state.ap < 1){ addLog('AP 不足。', 'warn'); return; }
    state.ap -= 1;
    m.loyalty = clamp(m.loyalty + 3, 0, 100);
    m.morale = clamp(m.morale + 3, 0, 100);
    addLog(`你和 ${m.name} 谈了一次心。忠诚 +3，士气 +3`, 'fx');
  } else if(action === 'promote'){
    if(state.ap < 2){ addLog('AP 不足。', 'warn'); return; }
    if(m.loyalty < 70){ addLog(`${m.name} 的忠诚不足 70，他还需要更多信任。`, 'warn'); return; }
    if(m.isOfficer){ addLog(`${m.name} 已经是军官，无法通过士官序列晋升。`, 'warn'); return; }
    if(m.rank >= 7){ addLog(`${m.name} 已达高级士官，难以再通过常规晋升。`, 'warn'); return; }
    state.ap -= 2;
    const oldRank = m.rank;
    m.rank += 1;
    m.loyalty = clamp(m.loyalty + 5, 0, 100);
    m.morale = clamp(m.morale + 5, 0, 100);
    m.events.push(`第 ${state.yos} 年 ${state.month} 月 · 晋升 ${getSquadRankName(m.rank)}`);
    addLog(`你推荐 ${m.name} 参加晋升考核。他通过了，${getSquadRankName(oldRank)} → ${getSquadRankName(m.rank)}`, 'good');
  } else if(action === 'recommend'){
    if(state.ap < 2){ addLog('AP 不足。', 'warn'); return; }
    if(m.isOfficer){ addLog(`${m.name} 已经是军官。`, 'warn'); return; }
    if(m.loyalty < 80){ addLog(`${m.name} 的忠诚不足 80，写推荐信还为时过早。`, 'warn'); return; }
    if(m.rank < 4){ addLog(`${m.name} 军衔太低，还不能申请 OCS/准尉。`, 'warn'); return; }
    state.ap -= 2;
    const score = m.loyalty * 0.4 + m.mos * 0.3 + m.pt * 0.3;
    if(score >= 75){
      if(m.isCore){
        // 核心战友：转为下级军官，留在小队
        m.isOfficer = true;
        m.officerRank = 1;
        m.events.push(`第 ${state.yos} 年 ${state.month} 月 · 被推荐进入 OCS，成为少尉`);
        m.loyalty = clamp(m.loyalty + 5, 0, 100);
        m.morale = clamp(m.morale + 10, 0, 100);
        addLog(`你为 ${m.name} 写了推荐信。他被 OCS 录取了——他将作为少尉留在你的小队里。`, 'good');
        addCareer('milestone', `${m.name} 晋升军官`, '从你的小队走出去的少尉');
      } else {
        // 流动战友：离开，加入纪念墙
        removeSquadMember(m, '被推荐进入 OCS');
      }
    } else {
      m.loyalty = clamp(m.loyalty - 5, 0, 100);
      m.morale = clamp(m.morale - 3, 0, 100);
      addLog(`你为 ${m.name} 写了推荐信，但他没有被录取。忠诚 -5，士气 -3`, 'warn');
    }
  }

  refreshHud();
  refreshStats();
  renderActions();
  renderSquadDetail();
}

function canAttemptBreakthrough(){
  if(state.breakthroughDone) return false;
  if(state.track !== 'E') return false;
  if(!state.mosCode) return false;
  const m = getMOS(state.mosCode);
  if(!m) return false;
  if(state.grade < m.cap) return false;
  // 需要达到 cap 且下一级超过 cap
  const next = nextRankKey();
  if(!next) return false;
  const nextGrade = parseInt(next.split('-')[1]);
  return nextGrade > m.cap;
}

function checkBreakthroughTrigger(){
  if(!canAttemptBreakthrough()) return null;
  if(state.breakthroughAttemptedThisYear) return null;
  // 被动触发 8%
  if(Math.random() < 0.08){
    return 'passive';
  }
  return null;
}

async function runBreakthrough(mode){
  return new Promise(resolve=>{
    // 根据主导派系选择破格方式
    let ev;
    if(state.factions){
      const f = state.factions;
      const max = Math.max(f.warrior, f.intellect, f.pragmatist, f.idealist);
      if(max >= 30){
        if(max === f.warrior && f.warrior >= 30) ev = BREAKTHROUGH_EVENTS.find(e=>e.id==='battle');
        else if(max === f.intellect && f.intellect >= 30) ev = BREAKTHROUGH_EVENTS.find(e=>e.id==='special');
        else if(max === f.pragmatist && f.pragmatist >= 30) ev = BREAKTHROUGH_EVENTS.find(e=>e.id==='political');
        else if(max === f.idealist && f.idealist >= 30) ev = BREAKTHROUGH_EVENTS.find(e=>e.id==='political');
      }
    }
    if(!ev) ev = BREAKTHROUGH_EVENTS[Math.floor(Math.random()*BREAKTHROUGH_EVENTS.length)];

    const phase = ev.phase;

    const baseAttr = state[phase.key] || 0;
    const roll = Math.random()*20 - 10;
    const factionBonus = Math.max(0, Math.floor((state.factions ? Math.max(state.factions.warrior, state.factions.intellect, state.factions.pragmatist, state.factions.idealist) : 0) / 15));
    const total = baseAttr + (mode === 'active' ? -5 : 0) + roll + factionBonus;
    const target = 65;
    const passed = total >= target;

    breakthroughFlow = {
      step:'intro',
      event:ev,
      phase,
      passed,
      total: Math.round(total),
      mode,
      resolve
    };
    state.breakthroughAttemptedThisYear = true;
    renderBreakthroughOverlay();
  });
}

function executeBreakthroughChoice(idx){
  const bf = breakthroughFlow;
  const choice = bf.phase.options[idx];
  const baseAttr = state[choice.key] || 0;
  const roll = Math.random()*20 - 10;
  const modePenalty = bf.mode === 'active' ? -5 : 0;
  const specBonus = getSpecialtyEffects().breakthroughBonus;
  const npcBf = npcMods();
  const bfNpcBonus = (npcBf.superior||0) * NPC_PROFILES.superior.contextMult.breakthrough
                   + (npcBf.peer||0) * NPC_PROFILES.peer.contextMult.breakthrough
                   + (npcBf.subordinate||0) * NPC_PROFILES.subordinate.contextMult.breakthrough;
  const total = baseAttr + (choice.mod||0) + roll + modePenalty + specBonus + bfNpcBonus;
  const target = 65;
  const passed = total >= target;

  // 应用属性变化
  if(choice.morale) state.morale = clamp(state.morale+choice.morale, 0, 100);
  if(choice.leadBonus) state.lead = clamp(state.lead+choice.leadBonus, 0, 100);
  if(choice.netBonus) state.net = clamp(state.net+choice.netBonus, 0, 100);

  bf.passed = passed;
  bf.total = Math.round(total);
  bf.step = 'result';
  renderBreakthroughOverlay();
}

function hasSpecialty(id){
  return (state.specialties||[]).some(s=>s.id===id);
}

function getSpecialtyEffects(){
  const out = {
    examBonus:{}, sofBonus:{}, deployBonus:{},
    yearlyGain:{}, moraleFloor:0, breakthroughBonus:0,
    deployCasualtyHalf:false, deploySafeBuffer:0, woBonus:0
  };
  (state.specialties||[]).forEach(sp=>{
    const def = SPECIALTIES.find(x=>x.id===sp.id);
    if(!def || !def.effects) return;
    const e = def.effects;
    if(e.examBonus) for(const [k,v] of Object.entries(e.examBonus))
      out.examBonus[k] = (out.examBonus[k]||0) + v;
    if(e.sofBonus) for(const [k,v] of Object.entries(e.sofBonus))
      out.sofBonus[k] = (out.sofBonus[k]||0) + v;
    if(e.deployBonus) for(const [k,v] of Object.entries(e.deployBonus))
      out.deployBonus[k] = (out.deployBonus[k]||0) + v;
    if(e.yearlyGain) for(const [k,v] of Object.entries(e.yearlyGain))
      out.yearlyGain[k] = (out.yearlyGain[k]||0) + v;
    if(e.moraleFloor) out.moraleFloor = Math.max(out.moraleFloor, e.moraleFloor);
    if(e.breakthroughBonus) out.breakthroughBonus += e.breakthroughBonus;
    if(e.deployCasualtyHalf) out.deployCasualtyHalf = true;
    if(e.deploySafeBuffer) out.deploySafeBuffer += e.deploySafeBuffer;
    if(e.woBonus) out.woBonus += e.woBonus;
  });
  return out;
}

function checkSpecialtyTrigger(){
  if(!state.specialties) return null;
  if(state.specialties.length >= 3) return null;
  if(state.yos < 4) return null;
  if(state.yos - (state._lastSpecYear||0) < 3) return null;

  let chance = 0;
  if(state.yos <= 8) chance = 0.30;
  else if(state.yos <= 15) chance = 0.40;
  else chance = 0.50;

  if(Math.random() > chance) return null;

  // 筛选候选
  const owned = state.specialties.map(s=>s.id);
  const pool = SPECIALTIES.filter(sp=>{
    if(owned.includes(sp.id)) return false;
    try{ return sp.cond(state); }catch(e){ return false; }
  });
  if(!pool.length) return null;

  // 打乱后取 3 个
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  return shuffled.slice(0, 3);
}

async function runSpecialtyChoice(candidates){
  return new Promise(resolve=>{
    specialtyFlow = {
      step:'choose',
      candidates,
      resolve
    };
    renderSpecialtyOverlay();
  });
}

function selectSpecialty(idx){
  const sp = specialtyFlow.candidates[idx];
  const overlay = document.getElementById('promo-overlay');
  overlay.classList.remove('show');

  state.specialties = state.specialties || [];
  state.specialties.push({ id:sp.id, name:sp.name, source:sp.source, effects:sp.effects });
  state._lastSpecYear = state.yos;

  addCareer('milestone', `解锁专长：${sp.name}`, sp.effectText);
  addLog(`⚡ 解锁专长：${sp.name}（${sp.source}）`, 'good');
  addLog(sp.effectText, 'fx');

  refreshStats();
  renderSpecialtyLine();
  const resolve = specialtyFlow.resolve;
  specialtyFlow = null;
  resolve();

function renderSpecialtyLine(){
  const el = document.getElementById('specialty-line');
  if(!el) return;
  const specs = state.specialties || [];
  if(!specs.length){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = '⚡ ' + specs.map(s=>s.name).join(' · ');
}

   功勋嘉奖窗口
   ========================================================= */
function checkAcademyEligibility(){
  if(state.track === 'O') return false;
  if(!state.mosCode) return false;
  const grade = state.grade;
  if(state.track === 'E' && grade < 4) return false;
  if(state.track === 'W' && grade < 1) return false;
  if(state.lead < 60) return false;
  if(state.pol < 50) return false;
  return true;
}

async function processMedalQueue(){
  while(state.pendingMedalQueue && state.pendingMedalQueue.length){
    const medal = state.pendingMedalQueue.shift();
    await showMedalCeremony(medal);
  }
}

async function showMedalCeremony(medal){
  return new Promise(resolve=>{
    medalCeremonyFlow = { medal, resolve };
    renderMedalCeremony();
  });
}

function renderMedalCeremony(){
  const overlay = document.getElementById('promo-overlay');
  const content = document.getElementById('promo-content');
  overlay.classList.add('show');
  overlay.scrollTop = 0;

  const { level } = medalCeremonyFlow.medal;
  const levelName = level === 'first' ? '一 等 功' : '二 等 功';
  const levelCls = level === 'first' ? 'first' : 'second';

  const ceremonyText = level === 'first'
    ? '本月你因卓越的表现被上级记一等功。这是一次真正的功勋——它足以改变你军旅生涯的轨迹。晋升委员会为你破了一次例。'
    : '本月你因出色的表现被上级记二等功。晋升委员会注意到了你的名字——这是一个打破常规的机会，也可能是一个需要耐心的时刻。';

  // 判断选项可用性
  const next = nextRankKey();
  const canPromote = (()=>{
    if(!next) return false;
    if(state.track === 'E' && state.mosCode){
      const cap = getMOSEffectiveCap();
      const nextGrade = parseInt(next.split('-')[1]);
      if(nextGrade > cap) return false;
    }
    return true;
  })();

  const academyEligible = checkAcademyEligibility();
  const academyAvailable = (level === 'first') && (state.track !== 'O');

  let html = `
    <div class="medal-ceremony-header">
      <div class="medal-ceremony-title">功 勋 嘉 奖</div>
      <div class="medal-ceremony-level ${levelCls}">${levelName}</div>
    </div>
    <div class="medal-ceremony-text">${ceremonyText}</div>

    <div class="medal-choice ${canPromote?'':'disabled'}" data-medal-idx="promote">
      <div class="medal-choice-quote">“你的表现已经超越了你当前的军衔。”</div>
      <div class="medal-choice-title">提前晋升</div>
      <div class="medal-choice-desc">${canPromote ? `直接晋升为 ${RANK_NAMES[next]}（${RANK_ABBR[next]}），跳过正常考核流程。` : '已达 MOS 自然晋升上限，暂不可用。'}</div>
      ${canPromote?'' : '<div class="medal-choice-hint">需要突破 MOS 上限，或等待正常晋升通道开放。</div>'}
    </div>

    <div class="medal-choice" data-medal-idx="train">
      <div class="medal-choice-quote">“有时候，最好的成长是留在原地，把根扎得更深。”</div>
      <div class="medal-choice-title">继续历练</div>
      <div class="medal-choice-desc">放弃本次提前晋升机会。士气 +5，本年度晋升考核加成 +10%。</div>
    </div>
  `;

  if(academyAvailable){
    if(academyEligible){
      html += `
        <div class="medal-choice" data-medal-idx="academy">
          <div class="medal-choice-quote">“军校的大门为你敞开——这是你应得的机会。”</div>
          <div class="medal-choice-title">军校破格录取</div>
          <div class="medal-choice-desc">转入军官路线，从少尉（O-1）开始。属性保留，领导 +5，政治 +5。</div>
        </div>
      `;
    } else {
      html += `
        <div class="medal-choice" data-medal-idx="save_academy">
          <div class="medal-choice-quote">“现在还不是时候。把这份机会收好。”</div>
          <div class="medal-choice-title">保留军校机会</div>
          <div class="medal-choice-desc">将本次军校入学资格保留，达到门槛后自动激活。</div>
          <div class="medal-choice-hint">需要：E-4 以上 · 领导 ≥ 60 · 政治 ≥ 50</div>
        </div>
      `;
    }
  }

  content.innerHTML = html;

  document.querySelectorAll('.medal-choice').forEach(el=>{
    el.onclick = ()=>{
      if(el.classList.contains('disabled')) return;
      executeMedalChoice(el.dataset.medalIdx);
    };
  });
}

function executeMedalChoice(choice){
  const overlay = document.getElementById('promo-overlay');
  overlay.classList.remove('show');
  const resolve = medalCeremonyFlow.resolve;
  const { level } = medalCeremonyFlow.medal;
  medalCeremonyFlow = null;

  if(choice === 'promote'){
    const next = nextRankKey();
    if(next){
      doPromote(next);
      addLog(`▲ 功勋提前晋升 ——— ${RANK_NAMES[next]}（${RANK_ABBR[next]}）`, 'rank');
    }
  } else if(choice === 'train'){
    state.morale = clamp(state.morale+5, 0, 100);
    state.yearPromoBonus = (state.yearPromoBonus||0) + 0.10;
    addLog('你选择继续历练。士气 +5，本年晋升考核加成 +10%。', 'good');
  } else if(choice === 'academy'){
    // 转军官路线
    state.track = 'O';
    state.grade = 1;
    state.tig = 0;
    state.lead = clamp(state.lead+5, 0, 100);
    state.pol = clamp(state.pol+5, 0, 100);
    state.morale = clamp(state.morale+10, 0, 100);
    addLog('▲ 军校破格录取 ——— 你成为了少尉（2LT）。', 'rank');
    addCareer('promotion', '军校破格录取', '转入军官路线');
  } else if(choice === 'save_academy'){
    state.pendingAcademy = (state.pendingAcademy||0) + 1;
    addLog('你保留了军校入学资格。达成门槛后将自动激活。', 'good');
    addCareer('milestone', '保留军校机会', '等待满足门槛');
  }

  refreshHud();
  refreshStats();
  resolve();
}

  return new Promise(resolve=>{
    const overlay = document.getElementById('promo-overlay');
    const content = document.getElementById('promo-content');
    overlay.classList.add('show');

    content.innerHTML = `
      <div class="medal-ceremony-header">

      <div class="medal-ceremony-text">

      </div>

        <div class="medal-choice-title">激活军校资格</div>
        <div class="medal-choice-desc">转入军官路线，从少尉（O-1）开始。领导 +5，政治 +5。</div>
      </div>
      <div class="medal-choice" data-academy-idx="no">
        <div class="medal-choice-quote">“不是现在。也许永远不是。”</div>
        <div class="medal-choice-title">放弃军校资格</div>
        <div class="medal-choice-desc">放弃本次军校机会，资格作废。你将留在原路线继续晋升。</div>
      </div>
    `;

    document.querySelectorAll('[data-academy-idx]').forEach(el=>{

        if(el.dataset.academyIdx === 'yes'){
          state.track = 'O';
          state.grade = 1;
          state.tig = 0;
          state.lead = clamp(state.lead+5, 0, 100);
          state.pol = clamp(state.pol+5, 0, 100);

          addLog('你放弃了军校资格。这次机会作废。', 'warn');
          addCareer('milestone', '放弃军校资格', '机会作废');
        }
        refreshHud();
        refreshStats();
        resolve();
      };
    });
  });
}

function addCareer(type, text, detail){
  if(!state.career) state.career = [];
  state.career.push({
    year: state.yos, month: state.month, age: state.age,
    rank: rankName(), abbr: rankAbbr(),
    type, text, detail: detail||''
  });
  if(!state.chains) state.chains = {};
  if(text.includes('战友负伤'))  state.chains.buddyYear       = state.yos;
  if(text.includes('恩师出现'))  state.chains.mentorYear      = state.yos;
  if(text.includes('士兵违纪'))  state.chains.officerYear     = state.yos;
  if(text.includes('灰色账目'))  state.chains.grayYear        = state.yos;
  if(text.includes('老准尉的邀请')) state.chains.woYear        = state.yos;
  if(text.includes('队友牺牲'))  state.chains.sofYear         = state.yos;
  if(text.includes('谈话')&&text.includes('家庭')) state.chains.familyYear = state.yos;
  if(text.includes('当地人家'))  state.chains.localYear       = state.yos;
  if(text.includes('站队'))      state.chains.politicsYear    = state.yos;
  if(text.includes('训练事故'))  state.chains.casualtyYear    = state.yos;
  if(text.includes('军校深造'))  state.chains.schoolYear      = state.yos;
  if(text.includes('噩梦'))      state.chains.ptsdYear        = state.yos;
  if(text.includes('未来规划'))  state.chains.transitionYear  = state.yos;
  if(text.includes('被指控'))    state.chains.courtYear       = state.yos;
  if(text.includes('军医的抉择')) state.chains.triageYear      = state.yos;
  if(text.includes('军犬阿波罗')) state.chains.k9Year          = state.yos;
  if(text.includes('被俘'))       state.chains.powYear         = state.yos;
  if(text.includes('情报评估'))   state.chains.intelYear       = state.yos;
  if(text.includes('装备缺陷'))   state.chains.whistleYear     = state.yos;
}

    html += `<div class="promo-item"><span>独立性</span><span>${Math.round(sp.independence)} / 100</span></div>`;
    html += `<div class="promo-item"><span>耐心</span><span>${Math.round(sp.patience)} / 100</span></div>`;
    html += `<div class="promo-item"><span>爱意</span><span>${Math.round(sp.love)} / 100</span></div>`;

    }
        if(sp.children && sp.children.length){
      html += `<div class="promo-section">子女</div>`;
      sp.children.forEach(c=>{
        const ageLabel = c.age < 6 ? '幼儿' : c.age < 12 ? '小学' : c.age < 18 ? '中学' : '成年';
        html += `<div class="promo-item"><span>${c.name}（${c.gender}）</span><span>${c.age} 岁 · ${ageLabel}</span></div>`;
        // 天赋
        if(c.talents && c.talents.length){
          html += `<div class="promo-item" style="padding-left:20px"><span style="color:#68774f;font-size:11px">天赋</span><span style="color:#94a878;font-size:11px">${c.talents.map(t=>t.name).join(' · ')}</span></div>`;

        html += `<div class="promo-item" style="padding-left:20px"><span style="color:#68774f;font-size:11px">智力 / 体格 / 纪律</span><span style="color:#94a878;font-size:11px">${Math.round(c.intelligence)} / ${Math.round(c.physique)} / ${Math.round(c.discipline)}</span></div>`;
        // 军事兴趣
        if(c.age >= 10){
          html += `<div class="promo-item" style="padding-left:20px"><span style="color:#68774f;font-size:11px">军事兴趣</span><span style="color:#94a878;font-size:11px">${Math.round(c.militaryInterest)} / 100</span></div>`;
        }
        // 军旅状态
        if(c.path === 'army' && c.armyData){
          html += `<div class="promo-item" style="padding-left:20px"><span style="color:#c9a227;font-size:11px">军旅</span><span style="color:#e8d98a;font-size:11px">${RANK_NAMES['E-'+c.armyData.rank] || '士兵'} · ${c.armyData.mosCode} · 服役 ${c.armyData.yearsIn} 年</span></div>`;
        } else if(c.path === 'killed'){
          html += `<div class="promo-item" style="padding-left:20px"><span style="color:#d95a4a;font-size:11px">阵亡</span><span style="color:#d95a4a;font-size:11px">第 ${c.pathYear} 年</span></div>`;
        } else if(c.path === 'college'){
          html += `<div class="promo-item" style="padding-left:20px"><span style="color:#68774f;font-size:11px">人生</span><span style="color:#94a878;font-size:11px">大学在读</span></div>`;
        }
      });
    }
  }

  // 提示
  html += `<div style="color:#68774f;font-size:11px;text-align:center;padding:6px 0 12px;letter-spacing:1px">
    —— 人际关系请点击底部「人 际」按钮查看 ——
  </div>`;

  // 时间线
  html += `<div class="promo-section">生涯时间线</div>`;
  if(!state.career || !state.career.length){
    html += `<div style="color:#68774f;font-size:12px;padding:8px 0">暂无记录</div>`;
  } else {
    const sorted = [...state.career].sort((a,b)=>{
      if(a.year !== b.year) return a.year - b.year;
      return (a.month||1) - (b.month||1);
    });
    let lastStage = '';
    sorted.forEach(entry=>{
      const stage = careerStageLabel(entry.year);
      if(stage !== lastStage){
        html += `<div class="career-stage">${stage}</div>`;
        lastStage = stage;
      }
      const monthStr = entry.month ? ` ${entry.month} 月` : '';
      const borderStyle = entry.type === 'event' ? ' style="border-left-color:#5a6b3a"' : '';
      html += `
        <div class="career-entry ${entry.type}"${borderStyle}>
          <div class="career-year">第 ${entry.year} 年${monthStr} · ${entry.age} 岁 · ${entry.rank}</div>
          <div class="career-text">${entry.text}</div>
          ${entry.detail?`<div class="career-detail">${entry.detail}</div>`:''}
        </div>`;
    });
  }

  html += `<button class="promo-btn" id="career-close-btn">关 闭</button>`;
  content.innerHTML = html;

  document.getElementById('career-close-btn').onclick = ()=>{
    overlay.classList.remove('show');
  };
}
