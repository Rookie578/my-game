function renderRankBadge(){
  const box = document.getElementById('rank-badge');
  if(!box) return;
  const gold = '#c9a227';
  const silver = '#c8d0c0';
  const dark = '#3a4a26';

  let inner = `<svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">`;
  inner += `<rect width="26" height="26" fill="#0a0d07" rx="3"/>`;
  inner += `<rect x="0.5" y="0.5" width="25" height="25" fill="none" stroke="${gold}" stroke-width="0.6" rx="3"/>`;

  const cx = 13;
  const cy = 13;

  if(state.track === 'E'){
    const grade = state.grade;
    const chevrons = {1:0, 2:1, 3:2, 4:2, 5:3, 6:3, 7:3, 8:3, 9:3}[grade] || 0;
    const arcs = {1:0, 2:0, 3:0, 4:1, 5:0, 6:1, 7:2, 8:3, 9:3}[grade] || 0;

    if(grade === 1){
      inner += `<circle cx="${cx}" cy="${cy}" r="1.5" fill="${gold}"/>`;
    } else {
      const baseY = cy + (chevrons - 1) * 1.8;
      for(let i = 0; i < chevrons; i++){
        const y = baseY - i * 2.8;
        inner += `<path d="M ${cx-5} ${y} L ${cx} ${y-3} L ${cx+5} ${y} L ${cx+5} ${y+1.4} L ${cx} ${y-1.6} L ${cx-5} ${y+1.4} Z" fill="${gold}"/>`;
      }
      const arcBaseY = baseY - chevrons * 2.8 - 0.5;
      for(let i = 0; i < arcs; i++){
        const y = arcBaseY - i * 2.2;
        inner += `<path d="M ${cx-5} ${y} Q ${cx} ${y-2.2} ${cx+5} ${y}" stroke="${gold}" stroke-width="1.2" fill="none"/>`;
      }
      if(grade === 9){
        inner += `<circle cx="${cx}" cy="${arcBaseY - arcs*2.2 - 2.5}" r="1.5" fill="${gold}"/>`;
      }
    }
  } else if(state.track === 'W'){
    const n = state.grade;
    const startY = cy - (n - 1) * 2.2 / 2;
    for(let i = 0; i < n; i++){
      inner += `<rect x="${cx-5}" y="${startY + i*2.2 - 0.7}" width="10" height="1.5" fill="${silver}"/>`;
    }
  } else {
    const grade = state.grade;
    if(grade === 1){
      inner += `<rect x="${cx-5}" y="${cy-1}" width="10" height="2" fill="${silver}"/>`;
    } else if(grade === 2){
      inner += `<rect x="${cx-5}" y="${cy-1}" width="10" height="2" fill="${silver}"/>`;
    } else if(grade === 3){
      inner += `<rect x="${cx-5}" y="${cy-2}" width="10" height="1.7" fill="${silver}"/>`;
      inner += `<rect x="${cx-5}" y="${cy+0.3}" width="10" height="1.7" fill="${silver}"/>`;
    } else if(grade === 4){
      inner += `<circle cx="${cx}" cy="${cy}" r="2.2" fill="${gold}"/>`;
    } else if(grade === 5){
      inner += `<circle cx="${cx}" cy="${cy}" r="2.2" fill="${silver}"/>`;
    } else if(grade === 6){
      inner += `<circle cx="${cx}" cy="${cy}" r="2.8" fill="${silver}"/>`;
    } else if(grade >= 7){
      const stars = grade - 6;
      const spacing = 3.5;
      const startX = cx - (stars-1) * spacing / 2;
      for(let i = 0; i < stars; i++){
        inner += `<circle cx="${startX + i*spacing}" cy="${cy}" r="1.5" fill="${gold}"/>`;
      }
    }
  }

  inner += `</svg>`;
  box.innerHTML = inner;
}

function renderAvatar(){
  const box = document.getElementById('hud-avatar');
  const img = document.getElementById('avatar-img');
  const svg = document.getElementById('avatar-svg');
  if(!box || !img || !svg) return;

  // 边框颜色
  box.className = '';
  let cls = 'rank-bronze';
  if(state.track === 'E'){
    if(state.grade <= 3) cls = 'rank-bronze';
    else if(state.grade <= 6) cls = 'rank-silver';
    else cls = 'rank-gold';
  } else if(state.track === 'W'){
    cls = 'rank-wo';
  } else {
    cls = 'rank-gold';
  }
  box.classList.add(cls);

  // 切换底图
  if(state.track === 'O'){
    img.src = '02.png';
    svg.innerHTML = renderOfficerOverlay();
  } else {
    img.src = '01.png';
    svg.innerHTML = renderEnlistedOverlay();
  }
}

/* =========================================================
   士兵 / 准尉 · 胸前魔术贴军衔叠加
   ========================================================= */
function renderEnlistedOverlay(){
  const isWO = state.track === 'W';
  const gold = '#e8d98a';
  const silver = '#d8d8d0';

  // 胸前补丁位置（60×60 视图坐标）
  const cx = 30;
  const cy = 52;

  let out = '';

  if(isWO){
    // 准尉：银色小条
    const n = state.grade;
    const startY = cy - (n - 1) * 1.3 / 2;
    for(let i = 0; i < n; i++){
      out += `<rect x="${cx-3}" y="${startY + i*1.3 - 0.4}" width="6" height="0.85" fill="${silver}"/>`;
    }
  } else {
    // 士兵：chevron + 弧线 + 星
    const grade = state.grade;
    const chevrons = {1:0, 2:1, 3:2, 4:2, 5:3, 6:3, 7:3, 8:3, 9:3}[grade] || 0;
    const arcs = {1:0, 2:0, 3:0, 4:1, 5:0, 6:1, 7:2, 8:3, 9:3}[grade] || 0;

    if(chevrons > 0){
      const baseY = cy + (chevrons - 1) * 1.0;
      for(let i = 0; i < chevrons; i++){
        const y = baseY - i * 1.7;
        out += `<path d="M ${cx-2.8} ${y} L ${cx} ${y-1.6} L ${cx+2.8} ${y} L ${cx+2.8} ${y+0.7} L ${cx} ${y-1} L ${cx-2.8} ${y+0.7} Z" fill="${gold}"/>`;
      }
      const arcBaseY = baseY - chevrons * 1.7 - 0.3;
      for(let i = 0; i < arcs; i++){
        const y = arcBaseY - i * 1.3;
        out += `<path d="M ${cx-3} ${y} Q ${cx} ${y-1.3} ${cx+3} ${y}" stroke="${gold}" stroke-width="0.75" fill="none"/>`;
      }
      if(grade === 9){
        out += `<circle cx="${cx}" cy="${arcBaseY - arcs*1.3 - 1.5}" r="0.95" fill="${gold}"/>`;
      }
    }
  }

  return out;
}

/* =========================================================
   军官 · 肩章军衔叠加
   ========================================================= */
function renderOfficerOverlay(){
  const grade = state.grade;
  const gold = '#e8d98a';
  const silver = '#d8d8d0';
  const dark = '#1a2210';

  // 左右肩章中心（60×60 视图坐标）
  const positions = [
    { cx: 14, cy: 44 },
    { cx: 46, cy: 44 }
  ];

  let out = '';

  positions.forEach(({cx, cy})=>{
    if(grade === 1){
      // O-1：1 金条
      out += `<rect x="${cx-3.5}" y="${cy-0.5}" width="7" height="1" fill="${dark}"/>`;
    } else if(grade === 2){
      // O-2：1 银条
      out += `<rect x="${cx-3.5}" y="${cy-0.5}" width="7" height="1" fill="${silver}"/>`;
    } else if(grade === 3){
      // O-3：2 银条
      out += `<rect x="${cx-3.5}" y="${cy-1.1}" width="7" height="0.85" fill="${silver}"/>`;
      out += `<rect x="${cx-3.5}" y="${cy+0.3}" width="7" height="0.85" fill="${silver}"/>`;
    } else if(grade === 4){
      // O-4：金星（简化叶）
      out += `<circle cx="${cx}" cy="${cy}" r="1.2" fill="${dark}"/>`;
    } else if(grade === 5){
      // O-5：银星
      out += `<circle cx="${cx}" cy="${cy}" r="1.2" fill="${silver}"/>`;
    } else if(grade === 6){
      // O-6：大银星
      out += `<circle cx="${cx}" cy="${cy}" r="1.5" fill="${silver}"/>`;
    } else if(grade >= 7){
      // O-7 ~ O-10：星数 = grade - 6
      const stars = grade - 6;
      const spacing = 1.8;
      const startX = cx - (stars-1) * spacing / 2;
      for(let i = 0; i < stars; i++){
        out += `<circle cx="${startX + i*spacing}" cy="${cy}" r="0.85" fill="${dark}"/>`;
      }
    }
  });

  return out;
}

function addLog(html, cls){
  const feed = document.getElementById('feed');
  const d = document.createElement('div');
  d.className = 'entry ' + (cls||'');
  d.innerHTML = html;
  feed.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ feed.scrollTop = feed.scrollHeight; }, 30);
}

function addMerit(n){
  if(!state.pendingMerits) state.pendingMerits = 0;
  state.pendingMerits += (n || 1);
}

function addRankMedal(level){
  if(!state.pendingRankMedals) state.pendingRankMedals = { first:0, second:0, third:0 };
  state.pendingRankMedals[level] = (state.pendingRankMedals[level] || 0) + 1;
}

function settleMonthlyRewards(){
  const pm = state.pendingMerits || 0;
  const prm = state.pendingRankMedals || { first:0, second:0, third:0 };
  const hasMedals = prm.first + prm.second + prm.third > 0;

  if(pm > 0){
    if(!state.merits) state.merits = 0;
    state.merits += pm;
    addLog(`📜 本月功勋 +${pm}（累计 ${state.merits}）`, 'good');
  }

  if(hasMedals){
    if(!state.rankMedals) state.rankMedals = { first:0, second:0, third:0 };
    if(!state.pendingMedalQueue) state.pendingMedalQueue = [];
    const nameMap = { first:'一等功', second:'二等功', third:'三等功' };
    ['first','second','third'].forEach(k=>{
      if(prm[k] > 0){
        state.rankMedals[k] = (state.rankMedals[k] || 0) + prm[k];
        addLog(`🎖 获得${nameMap[k]} ×${prm[k]}`, 'good');
        addCareer('medal', `获得${nameMap[k]}`, `月度结算 · 累计 ×${state.rankMedals[k]}`);
        // 一等功/二等功推入嘉奖队列，三等功不弹窗
        if(k === 'first' || k === 'second'){
          for(let i=0;i<prm[k];i++){
            state.pendingMedalQueue.push({ level:k, year:state.yos, month:state.month });
          }
        }
      }
    });
  }

  state.pendingMerits = 0;
  state.pendingRankMedals = { first:0, second:0, third:0 };
}

function addMedal(m){
  if(!state.medals.includes(m)){
    state.medals.push(m);
    addCareer('medal', `获得勋章：${m}`);
  }
}

function showChoices(choices, eventText){
  return new Promise(resolve=>{
    const overlay = document.getElementById('promo-overlay');
    const content = document.getElementById('promo-content');
    overlay.classList.add('show');
    overlay.scrollTop = 0;

    let html = `<div class="promo-title">事 件</div>`;
    if(eventText){
      html += `<div class="deploy-narr">${eventText}</div>`;
    }
    html += `<div class="promo-section">你的选择</div>`;

    choices.forEach((c, i)=>{
      // 特殊处理：技术路线选项，非匹配 MOS 禁用
      let disabled = false;
      if(c.label && c.label.includes('技术路线') && c.label.includes('需 MOS 匹配')){
        const okMOS = ['25B','35F','12B','68W'].includes(state.mosCode);
        if(!okMOS) disabled = true;
      }
      html += `<button class="phase-choice" data-choice-idx="${i}" ${disabled?'disabled style="opacity:.4;cursor:not-allowed"':''}>
        ${c.label}
      </button>`;
    });
    content.innerHTML = html;

        document.querySelectorAll('[data-choice-idx]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.choiceIdx);
        const c = choices[idx];
        // 检查是否被禁用
        let disabled = false;
        if(c.label && c.label.includes('技术路线') && c.label.includes('需 MOS 匹配')){
          const okMOS = ['25B','35F','12B','68W'].includes(state.mosCode);
          if(!okMOS) disabled = true;
        }
        if(disabled) return;

        overlay.classList.remove('show');
        const result = c.apply(state);
        if(result) addLog(result, 'good');
        if(window._lastChainEvent){
          addCareer('milestone', window._lastChainEvent.title, result ? result.slice(0,40)+'...' : '');
          window._lastChainEvent = null;
        }
        refreshStats();
        refreshHud();
        resolve();
      };
    });
  });
}

  activeSaveSlot = slot;

  showScreen('screen-game');
  document.getElementById('btn-career').onclick = renderCareerOverlay;

function endGame(reason){
  state.over = true;
  state.endReason = reason;

  // 退役前最后一次结算
  if(state.pendingMerits > 0 || (state.pendingRankMedals && (state.pendingRankMedals.first + state.pendingRankMedals.second + state.pendingRankMedals.third) > 0)){
    settleMonthlyRewards();
  }

  addCareer('end', '退役', reason);

  // 综合评分
  const score = computeCareerScore();

  // 荣誉勋章强制升级结局
  let forceMOH = false;
  if(state.medals.includes('国会荣誉勋章')){
    forceMOH = true;
  }

  // 退役结局判定
  const ending = determineEnding(score);

  const finalRank = rankName();
  const finalAbbr = rankAbbr();
  const st = state.finance ? getFinanceStatus() : { label:'—', color:'#94a878' };
  const bal = state.finance ? state.finance.balance : 0;

  const body = document.getElementById('end-body');
  body.innerHTML = `
    <div class="end-card">
      <div class="end-row"><span>最终军衔</span><span>${finalRank}（${finalAbbr}）</span></div>
      <div class="end-row"><span>服役年限</span><span>${state.yos} 年</span></div>
      <div class="end-row"><span>退役年龄</span><span>${state.age} 岁</span></div>
      <div class="end-row"><span>综合评分</span><span style="color:#e8d98a;font-weight:700">${score.total}</span></div>
      <div class="end-row"><span>获得勋章</span><span>${(state.medals.length) + (state.rankMedals ? (state.rankMedals.first + state.rankMedals.second + state.rankMedals.third) : 0)} 枚</span></div>
      <div class="end-row"><span>功勋</span><span>${state.merits || 0}</span></div>
      <div class="end-row"><span>财务状态</span><span style="color:${st.color}">${st.label} · $${bal.toLocaleString()}</span></div>
    </div>

    <div class="end-card">
      <div style="color:#68774f;font-size:11.5px;margin-bottom:8px">勋章墙</div>
      ${state.medals.length ? state.medals.map(m=>`<span class="medal">${m}</span>`).join('') : '<span style="color:#4a5540;font-size:12px">无</span>'}
    </div>

    <div class="end-card" style="border-color:${ending.color};box-shadow:0 0 16px ${ending.color}33">
      <div style="color:${ending.color};font-size:13px;letter-spacing:3px;text-align:center;font-weight:700;margin-bottom:10px">${ending.title}</div>
      <div style="color:#94a878;font-size:12.5px;line-height:1.85">${ending.text}</div>
    </div>

    <div class="end-text" style="color:#68774f;font-size:11.5px;margin-top:14px">${reason}</div>

    <div style="margin-top:16px;color:#94a878;font-size:11px;text-align:center;line-height:1.8">
      评分明细<br>
      军衔 ${score.rankScore} · 勋章 ${score.medalScore} · 功勋 ${score.meritScore} · 标签 ${score.tagScore} · 专长 ${score.specScore} · 财务 ${score.financeScore}
    </div>

    <button class="promo-btn" onclick="location.reload()" style="margin-top:16px">重 新 入 伍</button>
  `;
      showScreen('screen-end');

  // 成就检测
  const unlockedAch = checkAchievements();

  // 更新跨局元数据
  const meta = readMeta();
  meta.totalGames = (meta.totalGames || 0) + 1;
  meta.totalYears = (meta.totalYears || 0) + state.yos;
  if(score.total > (meta.bestScore || 0)){
    meta.bestScore = score.total;
  }

    // 图鉴收集
  if(!meta.gallery) meta.gallery = { medals: [], tags: [], endings: [], npcs: [] };
  state.medals.forEach(m=>{ if(!meta.gallery.medals.includes(m)) meta.gallery.medals.push(m); });
  (state.tags||[]).forEach(t=>{ if(!meta.gallery.tags.includes(t)) meta.gallery.tags.push(t); });
  ['npcBgHarrison','npcBgRivera','npcBgCole','npcBgChenard'].forEach(k=>{
    if(state.chains && state.chains[k] && !meta.gallery.npcs.includes(k)) meta.gallery.npcs.push(k);
  });
  // 结局
  if(!meta.gallery.endings.includes(ending.title)) meta.gallery.endings.push(ending.title);
  // 等级勋章也收集
  ['一等功','二等功','三等功'].forEach(m=>{
    if(state.rankMedals && state.rankMedals[m==='一等功'?'first':m==='二等功'?'second':'third'] > 0){
      if(!meta.gallery.medals.includes(m)) meta.gallery.medals.push(m);
    }
  });

  // 排行榜
  if(!meta.leaderboard) meta.leaderboard = [];
  meta.leaderboard.push({
    score: score.total,
    rank: `${finalRank}（${finalAbbr}）`,
    track: state.track,
    mos: state.mosCode || '—',
    years: state.yos,
    ending: ending.title,
    date: new Date().toISOString().split('T')[0]
  });
  meta.leaderboard.sort((a,b)=>b.score - a.score);
  meta.leaderboard = meta.leaderboard.slice(0, 10);
  writeMeta(meta);

  // 显示成就解锁
  if(unlockedAch.length){
    const achBox = document.createElement('div');
    achBox.className = 'end-card';
    achBox.style.borderColor = '#c9a227';
    achBox.innerHTML = `
      <div style="color:#e8d98a;font-size:12px;letter-spacing:3px;margin-bottom:10px">本 局 解 锁 成 就</div>
      ${unlockedAch.map(a=>`<div style="color:#b6cc8a;font-size:12px;line-height:1.7">✓ ${a.name}</div>`).join('')}
    `;
    const endBody = document.getElementById('end-body');
    const btn = endBody.querySelector('button');
    if(btn){
      endBody.insertBefore(achBox, btn);
    }
  }

  // 删除当前存档
  deleteSave(activeSaveSlot);
}

/* =========================================================
   综合评分 + 结局判定
   ========================================================= */
function computeCareerScore(){
  // 军衔分
  const rankScoreMap = {
    'E': { 1:0, 2:5, 3:10, 4:20, 5:35, 6:50, 7:70, 8:90, 9:110 },
    'W': { 1:60, 2:75, 3:90, 4:110, 5:130 },
    'O': { 1:55, 2:70, 3:85, 4:105, 5:125, 6:150, 7:175, 8:200, 9:230, 10:270 }
  };
  const rankScore = (rankScoreMap[state.track] || {})[state.grade] || 0;

  // 勋章分
  const rm = state.rankMedals || { first:0, second:0, third:0 };
  const medalScore = state.medals.length * 8 + rm.first * 15 + rm.second * 8 + rm.third * 4;

  // 功勋分
  const meritScore = Math.min(state.merits || 0, 100);

  // 标签分（正面 +5，负面 -3）
  let tagScore = 0;
  (state.tags || []).forEach(id=>{
    const d = TAG_DEFS[id];
    if(!d) return;
    if(d.type === 'positive') tagScore += 5;
    else if(d.type === 'negative') tagScore -= 3;
  });

  // 专长分
  const specScore = (state.specialties || []).length * 12;

  // 财务分
  let financeScore = 0;
  if(state.finance){
    const b = state.finance.balance;
    if(b >= 100000) financeScore = 30;
    else if(b >= 50000) financeScore = 20;
    else if(b >= 10000) financeScore = 10;
    else if(b >= 0) financeScore = 0;
    else if(b >= -10000) financeScore = -10;
    else financeScore = -25;
  }

  const total = Math.max(0, rankScore + medalScore + meritScore + tagScore + specScore + financeScore);
  return { total, rankScore, medalScore, meritScore, tagScore, specScore, financeScore };
}

function determineEnding(score){
  const total = score.total;
  const hasMOH = state.medals.includes('国会荣誉勋章');
  if(hasMOH){
    return {
      title: '英 雄',
      color: '#e8d98a',
      text: '你的名字被写进了美国军事史。不是因为你升了多高的军衔，不是因为你打了多少胜仗，而是因为那一天——在火网和死亡面前，你选择了逆行。国会荣誉勋章，这个国家能给一个军人的最高荣誉，戴在了你的胸前。多年以后，军校的每一届新学员，都会在课堂上读到你的名字。'
    };
  }
  const isOfficer = state.track === 'O' && state.grade >= 7;
  const isSNCO = state.track === 'E' && state.grade >= 7;
  const isWO = state.track === 'W' && state.grade >= 4;
  const hasSOF = state.flags.sof;
  const hasHidden = state.flags.hidden_buddy_unlocked || state.flags.hidden_mentor_unlocked ||
                    state.flags.hidden_family_unlocked || state.flags.hidden_local_unlocked;
  const isDivorced = state.spouse && state.spouse.status === 'divorced';
  const isMarried = state.spouse && state.spouse.status === 'married';
  const children = state.spouse && state.spouse.children ? state.spouse.children.length : 0;
  const bankrupt = state.finance && state.finance.balance < -10000;

  // 特殊结局
  if(bankrupt && total < 50){
    return {
      title: '破 碎 的 结 局',
      color: '#d95a4a',
      text: '你退役了。军装脱下之后，你发现自己什么都没有留下——没有积蓄，没有家庭，没有一个可以回去的地方。你在退伍军人事务部门口坐了一下午。'
    };
  }

  if(hasHidden && total >= 200){
    return {
      title: '传 奇 军 人',
      color: '#e8d98a',
      text: '你的一生被写进了军史。不是你打了多少仗，不是你升了多高的军衔，而是你在每一个关键时刻都做出了对得起自己、对得起弟兄们的选择。多年后，新兵入伍的第一课，就是读你的故事。'
    };
  }

  if(isOfficer && total >= 250){
    return {
      title: '将 军 之 路',
      color: '#e8d98a',
      text: '你走完了美军军官能走的最远的路。你的名字和那些在历史上留下印记的将军们排在一起。退役仪式上，五角大楼派了代表，全旅列队。你敬了最后一个军礼，然后转身离开。'
    };
  }

  if(isSNCO && hasSOF && total >= 180){
    return {
      title: '士 兵 之 魂',
      color: '#8fbf55',
      text: '你是士兵中的士兵。三十年里，你带过的兵遍布全军，有的成了军官，有的成了军士长，有的还在基层。他们说起你的时候，用的永远是同一个词——"那个人"。'
    };
  }

  if(isWO && total >= 150){
    return {
      title: '技 术 宗 师',
      color: '#7ba34a',
      text: '你离开部队那天，技术间全体准尉列队送你。你带走了一枚磨损的徽章，留下了一整代技术骨干。军队的技术手册里，有三条规范是你写的。'
    };
  }

  if(isMarried && children >= 2 && !isDivorced && total >= 100){
    return {
      title: '完 整 的 军 人',
      color: '#8fbf55',
      text: '你服役了一辈子，也守护了一个家庭。退役那天，孩子已经上大学了。你在退役演讲里说："我最骄傲的不是我当过兵，而是我爱的人一直在等我回家。"'
    };
  }

  if(isDivorced && total >= 80){
    return {
      title: '代 价',
      color: '#d98a4a',
      text: '你升到了该升的位置。脱下军装那天，没有人来接你。你一个人开车离开营区，在路边停了一会儿。你知道自己赢了什么，也知道自己输掉了什么。'
    };
  }

  if(total >= 120){
    return {
      title: '圆 满 退 役',
      color: '#8fbf55',
      text: '你服役了一辈子，做得不错。退役那天，战友们在小酒馆里为你送行。有人哭了，有人笑了。你说了很多话，最后一句是"弟兄们，我先走一步"。'
    };
  }

  if(total >= 60){
    return {
      title: '平 凡 的 军 旅',
      color: '#94a878',
      text: '你服役了这么多年，没做出什么惊天动地的事。但你也没有辜负这身军装。退役那天，你把军装叠好，放进衣柜最上层。'
    };
  }

  return {
    title: '无 名 之 卒',
    color: '#68774f',
    text: '你退役了。没有仪式，没有掌声，没有勋章。你在军队里度过了很多年，但军队很快就会忘记你。你回到家乡，找了一份普通的工作，过着普通的生活。'
  };
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* =========================================================
   启动
   ========================================================= */
document.getElementById('btn-next').addEventListener('click', endMonth);
renderStart();  // 现在 renderStart 内部调用 showSlotSelector
</script>
